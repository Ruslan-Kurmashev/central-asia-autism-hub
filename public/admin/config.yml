backend:
  name: turbo-github
  turbo_site_id: 04d6bfdc-d467-4c65-ac37-15d356e8af8c
  branch: main
  squash_merges: true

publish_mode: editorial_workflow
local_backend: true

site_url: "https://ruslan-kurmashev.github.io/central-asia-autism-hub"
display_url: "https://ruslan-kurmashev.github.io/central-asia-autism-hub"

media_folder: "public/images/uploads"
public_folder: "/central-asia-autism-hub/images/uploads"

slug:
  encoding: "unicode"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "pages_ru"
    label: "Статьи - Русский"
    label_singular: "Статья"
    description: "Основные информационные материалы Autism Hub Kazakhstan на русском языке."
    folder: "src/content/pages/kz/ru"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    slug: "{{fields.slug}}"
    preview_path: "kz/ru/{{fields.section}}/{{fields.slug}}/"
    summary: "{{title}} | {{section}} | draft={{draft}}"
    sortable_fields: ["title", "updatedAt", "publishedAt"]
    view_filters:
      - label: "Черновики"
        field: "draft"
        pattern: true
      - label: "Опубликованные"
        field: "draft"
        pattern: false
    fields: &page_fields_ru
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Краткое резюме", name: "summary", widget: "text" }
      - { label: "SEO-описание", name: "description", widget: "text" }
      - { label: "Изображение карточки", name: "featuredImage", widget: "image", required: false, hint: "Необязательно. Используется на главной и в подборках." }
      - { label: "Alt-текст изображения", name: "featuredImageAlt", widget: "string", required: false, hint: "Обязателен, если загружено изображение." }
      - { label: "Страна", name: "country", widget: "hidden", default: "kz" }
      - { label: "Язык", name: "language", widget: "hidden", default: "ru" }
      - label: "Раздел"
        name: "section"
        widget: "select"
        options:
          - { label: "Родителям", value: "parents" }
          - { label: "Исследования", value: "research" }
          - { label: "Помощь в Казахстане", value: "help-kazakhstan" }
          - { label: "Обучение", value: "learning" }
          - { label: "Специалистам", value: "professionals" }
          - { label: "О проекте", value: "about" }
      - { label: "Тема / topic key", name: "topic", widget: "string", hint: "Стабильный технический ключ темы, например autism-basics." }
      - { label: "URL slug", name: "slug", widget: "string", hint: "Только буквы, цифры и одиночные дефисы. Это адрес статьи." }
      - { label: "Ключ перевода", name: "translationKey", widget: "string", hint: "Одинаковый ключ связывает RU / KK / EN версии." }
      - label: "Статус перевода"
        name: "translationStatus"
        widget: "select"
        options:
          - { label: "Исходная версия", value: "source" }
          - { label: "Проверено", value: "checked" }
          - { label: "Ожидает проверки", value: "pending" }
      - label: "Аудитория"
        name: "audience"
        widget: "select"
        multiple: true
        min: 1
        options:
          - { label: "Родители", value: "parents" }
          - { label: "Семьи", value: "families" }
          - { label: "Специалисты", value: "professionals" }
          - { label: "Все читатели", value: "general" }
      - { label: "Автор", name: "author", widget: "string" }
      - { label: "Редактор", name: "editor", widget: "string" }
      - { label: "Внешний reviewer", name: "externalReviewer", widget: "string", required: false }
      - { label: "Дата публикации", name: "publishedAt", widget: "datetime", required: false, default: "", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, picker_utc: true }
      - { label: "Дата обновления", name: "updatedAt", widget: "datetime", required: false, default: "", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, picker_utc: true }
      - { label: "Следующий evidence review", name: "reviewDueAt", widget: "datetime", required: false, default: "", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, picker_utc: true }
      - label: "Уровень риска"
        name: "riskLevel"
        widget: "select"
        options:
          - { label: "Низкий", value: "lower" }
          - { label: "Средний", value: "moderate" }
          - { label: "Высокий", value: "high" }
      - label: "Тип дисклеймера"
        name: "disclaimerType"
        widget: "select"
        options:
          - { label: "Информационный", value: "informational" }
          - { label: "Медицинский", value: "medical" }
      - { label: "Конфликт интересов", name: "conflictOfInterest", widget: "text" }
      - { label: "Примечание к версии", name: "versionNote", widget: "text", required: false }
      - { label: "Черновик", name: "draft", widget: "boolean", default: true, hint: "Не отключайте до завершения evidence/editorial QA." }
      - label: "Ключевые пункты"
        name: "keyPoints"
        widget: "list"
        required: false
        default: []
        field: { label: "Пункт", name: "point", widget: "string" }
      - { label: "Ограничения доказательств", name: "evidenceLimitations", widget: "text", required: false }
      - label: "Источники"
        name: "sources"
        widget: "list"
        required: false
        default: []
        summary: "{{fields.title}}"
        fields:
          - { label: "Название", name: "title", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Организация", name: "organisation", widget: "string", required: false }
          - { label: "Год публикации", name: "publicationYear", widget: "number", value_type: "int", min: 1900, max: 2100, required: false }
          - { label: "Как использован источник", name: "note", widget: "text", required: false }
          - { label: "Дата доступа", name: "accessedAt", widget: "datetime", required: false, default: "", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, picker_utc: true }
      - { label: "Текст статьи", name: "body", widget: "richtext" }

