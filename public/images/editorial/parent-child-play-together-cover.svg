<title id="title">Совместная игра ребёнка и взрослого</title>
<desc id="desc">Оригинальная векторная обложка с дорожкой для машинки, разноцветными кубиками и символами предложения, выбора и совместного интереса. Не медицинская шкала и не изображение реального ребёнка.</desc>
