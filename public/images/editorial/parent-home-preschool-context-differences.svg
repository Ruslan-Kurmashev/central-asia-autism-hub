<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Ребёнок в разных условиях: дом и детский сад</title><desc id="d">Оригинальная редакционная схема: слева спокойная домашняя обстановка с окном и креслом, справа игровая зона с книгами и игрушками. Между ними пунктирная линия и одинаковая звезда интересов ребёнка. Не медицинский тест и не изображение реального ребёнка.</desc><rect width="960" height="540" fill="#E8F1F7"/><rect x="51" y="48" width="858" height="442" rx="25" fill="#FAFCFE" stroke="#C2D8E6" stroke-width="3"/><rect x="92" y="117" width="350" height="310" rx="19" fill="#EDF4F9" stroke="#9CBCCF" stroke-width="3"/><rect x="519" y="117" width="350" height="310" rx="19" fill="#EFF5F1" stroke="#ACC7B7" stroke-width="3"/><rect x="148" y="166" width="131" height="113" rx="8" fill="#CFE5F1" stroke="#6691AE" stroke-width="5"/><path d="M213 171v103M153 222h123" stroke="#FFF" stroke-width="6"/><path d="M124 358v-80q0-26 27-26h93q27 0 27 26v80" fill="#DCC8B5" stroke="#B39A82" stroke-width="5"/><rect x="121" y="340" width="176" height="20" rx="8" fill="#B99B81"/><rect x="132" y="356" width="20" height="40" rx="4" fill="#B99B81"/><rect x="271" y="356" width="20" height="40" rx="4" fill="#B99B81"/><rect x="574" y="204" width="99" height="131" rx="10" fill="#D1E2D7" stroke="#7DA78D" stroke-width="5"/><rect x="689" y="204" width="105" height="131" rx="10" fill="#C9E1ED" stroke="#739AB3" stroke-width="5"/><path d="M600 228h45M600 248h45M600 269h45M718 228h48M718 250h48M718 271h48" stroke="#7DAD98" stroke-width="7" stroke-linecap="round"/><rect x="600" y="355" width="77" height="58" rx="8" fill="#E7CAA4" stroke="#B88F61" stroke-width="4"/><rect x="685" y="373" width="96" height="40" rx="8" fill="#C3D9E9" stroke="#739AB3" stroke-width="4"/><path d="M446 285h71" stroke="#6B94AF" stroke-width="7" stroke-dasharray="10 12" stroke-linecap="round"/><path d="M481 205l15 32 35 5-26 25 6 36-30-17-31 17 6-36-26-25 36-5z" fill="#