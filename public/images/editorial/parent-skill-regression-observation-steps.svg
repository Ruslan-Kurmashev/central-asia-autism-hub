<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Наблюдение, связь с врачом, медицинская оценка</title><desc id="desc">Три иллюстративные панели о подготовке информации к медицинскому обращению. Не схема самостоятельной сортировки по степени срочности, не диагностический алгоритм.</desc><rect width="960" height="340" rx="18" fill="#eff6fa"/><g font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#204d75" text-anchor="middle"><rect x="13" y="18" width="296" height="305" rx="15" fill="#fff" stroke="#c4d9e7" stroke-width="3"/><rect x="333" y="18" width="295" height="305" rx="15" fill="#fff" stroke="#c4d9e7" stroke-width="3"/><rect x="652" y="18" width="295" height="305" rx="15" fill="#fff" stroke="#c4d9e7" stroke-width="3"/><text x="161" y="69">ЗАМЕТИТЬ</text><text x="480" y="69">СООБЩИТЬ</text><text x="800" y="69">ОЦЕНИТЬ</text><g fill="none" stroke="#527e9f" stroke-width="7" stroke-linecap="round"><rect x="118" y="104" width="85" height="110" rx="9" stroke-width="5"/><path d="M138 142h45M138 162h45M138 182h27"/><path d="M453 109h54v103h-54zM454 129h52M467 193h27" stroke-width="5"/><circle cx="799" cy="149" r="44" stroke-width="6"/><path d="M799 133v32M782 149h34"/></g><g font-size="17" font-weight="normal"><text x="161" y="252">Конкретные примеры</text><text x="161" y="279">до и после</text><text x="480" y="252">Обратиться за</text><text x="480" y="279">медицинской помощью</text><text x="800" y="252">Причины определяет</text><text x="800" y="279">специалист</text></g></g></svg>