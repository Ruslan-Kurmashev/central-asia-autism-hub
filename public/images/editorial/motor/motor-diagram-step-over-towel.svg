="#8fa8b9" stroke-width="4"/><ellipse cx="110" cy="136" rx="14" ry="28" fill="#518aab" transform="rotate(-12 110 136)"/><ellipse cx="169" cy="126" rx="14" ry="28" fill="#518aab" transform="rotate(-12 169 126)"/></g></svg>