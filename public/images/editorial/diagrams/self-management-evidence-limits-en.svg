<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 506" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Research limitations</title>
<desc id="chart-desc">15 studies. 9 met WWC fully or with reservations, including one without reservations. 7 assessed maintenance, 5 assessed generalisation. Not a measure of effectiveness.</desc>
<rect width="660" height="506" rx="12" fill="#ffffff"/>
<g fill="#183b53" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">
<text x="24" y="36" font-weight="700">Research limitations</text>
<text x="24" y="66">Studies out of 15</text>
<text x="24" y="105">WWC fully or with reservations</text>
<rect x="24" y="117" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="117" width="285.000" height="25" rx="3" fill="#397d96"/>
<text x="511" y="139" font-weight="700">9 of 15</text>
<text x="24" y="181">Assessed maintenance</text>
<rect x="24" y="193" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="193" width="221.667" height="25" rx="3" fill="#397d96"/>
<text x="511" y="215" font-weight="700">7 of 15</text>
<text x="24" y="257">Assessed generalisation</text>
<rect x="24" y="269" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="269" width="158.333" height="25" rx="3" fill="#397d96"/>
<text x="511" y="291" font-weight="700">5 of 15</text>
<text x="24" y="333">WWC without reservations</text>
<rect x="24" y="345" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="345" width="31.667" height="25" rx="3" fill="#397d96"/>
<text x="511" y="367" font-weight="700">1 of 15</text>
<text x="24" y="412" font-size="23">One study without reservations is included in the 9.</text>
<text x="24" y="444" font-size="23">Presence of measurements, not skill success.</text>
<text x="24" y="476" font-size="23">Aydin et al., 2025 (online 2024).</text>
</g></svg>
