<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" role="img" aria-labelledby="title desc">
<title id="title">Возможные маршруты образовательной поддержки в Казахстане</title>
<desc id="desc">Семья может обратиться в школу или детский сад и при необходимости в ПМПК. Школьное сопровождение может осуществляться с учётом оценки потребностей. Для приёма детей с ограниченными возможностями в КППК предусмотрены заключение и рекомендации ПМПК и согласие законного представителя. Возможны и другие организации. Результат пересматривают. Схема не является обязательной последовательностью.</desc>
<rect width="720" height="770" rx="12" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 3L0 6Z" fill="#527487"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#183b53">
<text x="24" y="40" font-weight="700">Маршруты образовательной поддержки</text>
<rect x="180" y="65" width="360" height="104" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/>
<text x="360.0" y="100" text-anchor="middle" font-weight="700">Семья</text>
<text x="360.0" y="131" text-anchor="middle">Трудности в обучении</text>
<path d="M280 169V189H177V216" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M440 169V189H543V216" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="24" y="222" width="306" height="134" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/>
<text x="177.0" y="257" text-anchor="middle" font-weight="700">Школа / детсад</text>
<text x="177.0" y="288" text-anchor="middle">Оценка потребностей</text>
<text x="177.0" y="317" text-anchor="middle">и сопровождение</text>
<rect x="390" y="222" width="306" height="134" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/>
<text x="543.0" y="257" text-anchor="middle" font-weight="700">ПМПК</text>
<text x="543.0" y="288" text-anchor="middle">При необходимости</text>
<text x="543.0" y="317" text-anchor="middle">Оценка потребностей</text>
<text x="543.0" y="346" text-anchor="middle">и рекомендации</text>
<path d="M330 285H384" fill="none" stroke="#527487" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M543 356V397" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M177 356V397" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="24" y="403" width="306" height="142" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/>
<text x="177.0" y="438" text-anchor="middle" font-weight="700">Поддержка в школе</text>
<text x="177.0" y="469" text-anchor="middle">Адаптации и помощь</text>
<text x="177.0" y="498" text-anchor="middle">по потребностям</text>
<rect x="390" y="403" width="306" height="142" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/>
<text x="543.0" y="438" text-anchor="middle" font-weight="700">КППК</text>
<text x="543.0" y="469" text-anchor="middle">Заключение ПМПК</text>
<text x="543.0" y="498" text-anchor="middle">и согласие родителей</text>
<path d="M177 545V568H360V593" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M543 545V568H360V593" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="108" y="599" width="504" height="102" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/>
<text x="360.0" y="634" text-anchor="middle" font-weight="700">Оценка результата</text>
<text x="360.0" y="665" text-anchor="middle">И пересмотр программы</text>
<text x="24" y="733" font-size="21">Возможны другие организации и частная помощь.</text>
<text x="24" y="758" font-size="21">Это не обязательная последовательность для всех.</text>
</g></svg>
