<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 824" role="img" aria-labelledby="title desc"><title id="title">Инклюзивті білім беру нәтижелері</title><desc id="desc">233 жұмыс, таңдалған қабаттасатын санаттар: әлеуметтік дағдылар 71, өзара әрекеттесу 56, когнитивтік, қимыл және сенсорлық дағдылар 45, әлеуметтік орта 40, денсаулық пен әл-ауқат 15, ұйымдастырушылық факторлар 12, мектеп ахуалы 11, эмоцияларды реттеу 11.</desc><rect width="720" height="824" rx="12" fill="#fff"/><g fill="#183b53" font-family="DejaVu Sans, Arial, sans-serif" font-size="24"><text x="26" y="39" font-weight="700">Инклюзивті білім беру нәтижелері</text><text x="26" y="70">Зерттеулер саны</text><text x="26" y="112">Әлеуметтік дағдылар</text><rect x="26" y="124" width="600.000" height="25" rx="3" fill="#397d96"/><text x="638.000" y="146" font-weight="700">71</text><text x="26" y="188">Әлеуметтік өзара әрекеттесу</text><rect x="26" y="200" width="473.239" height="25" rx="3" fill="#397d96"/><text x="511.239" y="222" font-weight="700">56</text><text x="26" y="264">Когнитивтік, қимыл және сенсорлық дағдылар</text><rect x="26" y="276" width="380.282" height="25" rx="3" fill="#397d96"/><text x="418.282" y="298" font-weight="700">45</text><text x="26" y="340">Әлеуметтік орта</text><rect x="26" y="352" width="338.028" height="25" rx="3" fill="#397d96"/><text x="376.028" y="374" font-weight="700">40</text><text x="26" y="416">Денсаулық пен әл-ауқат</text><rect x="26" y="428" width="126.761" height="25" rx="3" fill="#397d96"/><text x="164.761" y="450" font-weight="700">15</text><text x="26" y="492">Ұйымдастырушылық факторлар</text><rect x="26" y="504" width="101.408" height="25" rx="3" fill="#397d96"/><text x="139.408" y="526" font-weight="700">12</text><text x="26" y="568">Мектеп ахуалы</text><rect x="26" y="580" width="92.958" height="25" rx="3" fill="#397d96"/><text x="130.958" y="602" font-weight="700">11</text><text x="26" y="644">Эмоцияларды реттеу</text><rect x="26" y="656" width="92.958" height="25" rx="3" fill="#397d96"/><text x="130.958" y="678" font-weight="700">11</text><text x="26" y="744">233 жұмыс, таңдалған сегіз санат.</text><text x="26" y="773">Санаттар қабаттасады. Әсер бағасы емес.</text><text x="26" y="802">Perrelet et al., Autism, 2025</text></g></svg>
