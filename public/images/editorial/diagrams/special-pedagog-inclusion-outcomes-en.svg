<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 824" role="img" aria-labelledby="title desc"><title id="title">Outcomes of inclusive education</title><desc id="desc">233 studies, selected overlapping outcome categories: social skills 71, interaction 56, cognitive, motor and sensory skills 45, social environment 40, health and well-being 15, organisational factors 12, school climate 11, emotional regulation 11.</desc><rect width="720" height="824" rx="12" fill="#fff"/><g fill="#183b53" font-family="DejaVu Sans, Arial, sans-serif" font-size="24"><text x="26" y="39" font-weight="700">Outcomes of inclusive education</text><text x="26" y="70">Number of studies</text><text x="26" y="112">Social skills</text><rect x="26" y="124" width="600.000" height="25" rx="3" fill="#397d96"/><text x="638.000" y="146" font-weight="700">71</text><text x="26" y="188">Social interaction</text><rect x="26" y="200" width="473.239" height="25" rx="3" fill="#397d96"/><text x="511.239" y="222" font-weight="700">56</text><text x="26" y="264">Cognitive, motor and sensory skills</text><rect x="26" y="276" width="380.282" height="25" rx="3" fill="#397d96"/><text x="418.282" y="298" font-weight="700">45</text><text x="26" y="340">Social environment</text><rect x="26" y="352" width="338.028" height="25" rx="3" fill="#397d96"/><text x="376.028" y="374" font-weight="700">40</text><text x="26" y="416">Health and well-being</text><rect x="26" y="428" width="126.761" height="25" rx="3" fill="#397d96"/><text x="164.761" y="450" font-weight="700">15</text><text x="26" y="492">Organisational factors</text><rect x="26" y="504" width="101.408" height="25" rx="3" fill="#397d96"/><text x="139.408" y="526" font-weight="700">12</text><text x="26" y="568">School climate</text><rect x="26" y="580" width="92.958" height="25" rx="3" fill="#397d96"/><text x="130.958" y="602" font-weight="700">11</text><text x="26" y="644">Emotional regulation</text><rect x="26" y="656" width="92.958" height="25" rx="3" fill="#397d96"/><text x="130.958" y="678" font-weight="700">11</text><text x="26" y="744">233 studies, eight selected categories.</text><text x="26" y="773">Categories overlap. Not an effect estimate.</text><text x="26" y="802">Perrelet et al., Autism, 2025</text></g></svg>
