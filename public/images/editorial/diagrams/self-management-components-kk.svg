<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 658" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Өзін-өзі басқару құрамдастары</title>
<desc id="chart-desc">15 зерттеу. Өзін-өзі бақылау 11, өзіне нұсқау беру 3, өздігінен тіркеу 2, өзін-өзі нығайту 2, дербес таңдау 1, өзін-өзі бағалау 1. Санаттар қабаттасады.</desc>
