<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 506" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Ограничения исследований</title>
<desc id="chart-desc">15 работ. 9 соответствовали WWC полностью или с оговорками, включая одну без оговорок. 7 оценивали сохранение, 5 перенос. Не показатель эффективности.</desc>
<rect width="660" height="506" rx="12" fill="#ffffff"/>
<g fill="#183b53" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">
<text x="24" y="36" font-weight="700">Ограничения исследований</text>
<text x="24" y="66">Число работ из 15</text>
<text x="24" y="105">WWC полностью или с оговорками</text>
<rect x="24" y="117" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="117" width="285.000" height="25" rx="3" fill="#397d96"/>
<text x="511" y="139" font-weight="700">9 из 15</text>
<text x="24" y="181">Оценивали сохранение</text>
<rect x="24" y="193" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="193" width="221.667" height="25" rx="3" fill="#397d96"/>
<text x="511" y="215" font-weight="700">7 из 15</text>
<text x="24" y="257">Оценивали перенос</text>
<rect x="24" y="269" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="269" width="158.333" height="25" rx="3" fill="#397d96"/>
<text x="511" y="291" font-weight="700">5 из 15</text>
<text x="24" y="333">WWC без оговорок</text>
<rect x="24" y="345" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="345" width="31.667" height="25" rx="3" fill="#397d96"/>
<text x="511" y="367" font-weight="700">1 из 15</text>
<text x="24" y="412" font-size="23">Одна работа без оговорок входит в число 9.</text>
<text x="24" y="444" font-size="23">Наличие измерений, не успешность навыка.</text>
<text x="24" y="476" font-size="23">Aydin et al., 2025 (онлайн 2024).</text>
</g></svg>
