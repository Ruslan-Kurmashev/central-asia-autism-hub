<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 506" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Зерттеулердің шектеулері</title>
<desc id="chart-desc">15 жұмыс. 9-ы WWC талаптарына толық немесе ескертпелермен сәйкес, біреуі ескертусіз. 7-еуі сақталуды, 5-еуі басқа жағдайда қолдануды бағалаған. Тиімділік көрсеткіші емес.</desc>
<rect width="660" height="506" rx="12" fill="#ffffff"/>
<g fill="#183b53" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">
<text x="24" y="36" font-weight="700">Зерттеулердің шектеулері</text>
<text x="24" y="66">15 жұмыстың ішіндегі саны</text>
<text x="24" y="105">WWC толық немесе ескертпелермен</text>
<rect x="24" y="117" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="117" width="285.000" height="25" rx="3" fill="#397d96"/>
<text x="511" y="139" font-weight="700">15-тен 9</text>
<text x="24" y="181">Дағдының сақталуын бағалаған</text>
<rect x="24" y="193" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="193" width="221.667" height="25" rx="3" fill="#397d96"/>
<text x="511" y="215" font-weight="700">15-тен 7</text>
<text x="24" y="257">Басқа жағдайда қолдануды бағалаған</text>
<rect x="24" y="269" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="269" width="158.333" height="25" rx="3" fill="#397d96"/>
<text x="511" y="291" font-weight="700">15-тен 5</text>
<text x="24" y="333">WWC ескертусіз</text>
<rect x="24" y="345" width="475" height="25" rx="3" fill="#edf2f6"/>
<rect x="24" y="345" width="31.667" height="25" rx="3" fill="#397d96"/>
<text x="511" y="367" font-weight="700">15-тен 1</text>
<text x="24" y="412" font-size="23">Ескертусіз бір жұмыс 9 жұмыстың ішіне кіреді.</text>
<text x="24" y="444" font-size="23">Өлшемдердің болуы, дағдының жетістігі емес.</text>
<text x="24" y="476" font-size="23">Aydin et al., 2025 (онлайн 2024).</text>
</g></svg>
