<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" role="img" aria-labelledby="title desc"><title id="title">Educational support pathways</title><desc id="desc">A family may contact the school or preschool, and PMPK if necessary. School support may follow needs assessment. Admission of children with disabilities to KPPK requires PMPK conclusions and recommendations and the legal representative’s consent. Outcomes are assessed and the programme reviewed. Other organisations and private assistance are possible.</desc><rect width="720" height="770" rx="12" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 3L0 6Z" fill="#527487"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#183b53"><text x="24" y="40" font-weight="700">Educational support pathways</text><rect x="180" y="65" width="360" height="104" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/><text x="360.0" y="100" text-anchor="middle" font-weight="700">Family</text><text x="360.0" y="129" text-anchor="middle">Learning difficulties</text><rect x="24" y="222" width="306" height="134" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/><text x="177.0" y="257" text-anchor="middle" font-weight="700">School / preschool</text><text x="177.0" y="286" text-anchor="middle">Needs assessment</text><text x="177.0" y="315" text-anchor="middle">and support</text><rect x="390" y="222" width="306" height="134" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/><text x="543.0" y="257" text-anchor="middle" font-weight="700">PMPK</text><text x="543.0" y="286" text-anchor="middle">If necessary</text><text x="543.0" y="315" text-anchor="middle">Needs assessment</text><text x="543.0" y="344" text-anchor="middle">and recommendations</text><rect x="24" y="403" width="306" height="142" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/><text x="177.0" y="438" text-anchor="middle" font-weight="700">School support</text><text x="177.0" y="467" text-anchor="middle">Adaptations and help</text><text x="177.0" y="496" text-anchor="middle">based on needs</text><rect x="390" y="403" width="306" height="142" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/><text x="543.0" y="438" text-anchor="middle" font-weight="700">KPPK</text><text x="543.0" y="467" text-anchor="middle">PMPK conclusion</text><text x="543.0" y="496" text-anchor="middle">and parental consent</text><rect x="108" y="599" width="504" height="102" rx="12" fill="#edf4f8" stroke="#7697aa" stroke-width="2"/><text x="360.0" y="634" text-anchor="middle" font-weight="700">Outcome assessment</text><text x="360.0" y="663" text-anchor="middle">and programme review</text><path d="M280 169V189H177V216" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/><path d="M440 169V189H543V216" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/><path d="M330 285H384" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="5 4"/><path d="M543 356V397" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/><path d="M177 356V397" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/><path d="M177 545V568H360V593" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/><path d="M543 545V568H360V593" fill="none" stroke="#527487" stroke-width="2.5" marker-end="url(#a)"/><text x="24" y="733" font-size="21">Other organisations and private help are possible.</text><text x="24" y="758" font-size="21">This is not a mandatory sequence for everyone.</text></g></svg>
