<title id="title">Два языка в одной семье: общение и совместное чтение</title>
<desc id="desc">Редакционная геометрическая схема: открытая книга, два облака разговора и соединяющая их линия. Цветовая кодировка не обозначает диагностические категории. Реальных детей и сгенерированных фотопортретов нет.</desc>
