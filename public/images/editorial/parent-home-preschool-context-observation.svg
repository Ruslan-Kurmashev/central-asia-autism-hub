<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">Как сопоставить условия дома и в детском саду</title><desc id="d">Три панели для наблюдений: условия и требования, доступная поддержка, фактическое участие и состояние ребёнка. Условная редакционная схема, не диагностическая шкала.</desc><rect width="960" height="340" rx="18" fill="#F0F6FA"/><g fill="#FFF" stroke="#C4D8E5" stroke-width="3"><rect x="15" y="19" width="295" height="301" rx="15"/><rect x="333" y="19" width="295" height="301" rx="15"/><rect x="650" y="19" width="295" height="301" rx="15"/></g><g font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#26567E"><text x="162" y="64">УСЛОВИЯ</text><text x="481" y="64">ПОДДЕРЖКА</text><text x="798" y="64">УЧАСТИЕ</text></g><g stroke="#6393B1" stroke-width="6" fill="none" stroke-linecap="round"><rect x="111" y="102" width="102" height="113" rx="9"/><path d="M127 126h70M127 151h52M127 176h63"/><circle cx="480" cy="158" r="57"/><path d="M457 158l16 17 33-37"/><path d="M751 165l29 29 62-66" stroke="#6B9E84" stroke-width="10"/></g><g font-family="Arial,sans-serif" font-size="17" fill="#49657A" text-anchor="middle"><text x="162" y="256">Шум, люди, переходы</text><text x="162" y="280">и ожидания</text><text x="481" y="256">Паузы, понятные шаги</text><text x="481" y="280">и способы общения</text><text x="798" y="256">Что ребёнок сделал</text><text x="798" y="280">и как себя чувствовал</text></g></svg>