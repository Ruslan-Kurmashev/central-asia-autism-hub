<title id="t">Сравниваем условия, поддержку и участие ребёнка</title>
<desc id="d">Три одинаковые карточки с чёткими синими контурными иконками: дом и детский сад для условий, диалог и поддерживающая рука для помощи, двое людей и галочка для участия. Текст напоминает взрослым сравнивать среду, а не оценивать характер.</desc>
