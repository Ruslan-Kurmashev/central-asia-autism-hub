<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Три момента поддержки: до, во время и после</title><desc id="desc">Три отдельные карточки: перед трудной ситуацией - уменьшить нагрузку; в момент сильного напряжения - обеспечить безопасность и поддержку; после - восстановиться и обсудить. Не числовая шкала.</desc><rect width="960" height="350" rx="18" fill="#f2f7fa"/><g font-family="Arial, sans-serif" fill="#214e72"><rect x="18" y="19" width="296" height="312" rx="15" fill="#fff" stroke="#b8d0e1" stroke-width="3"/><rect x="333" y="19" width="296" height="312" rx="15" fill="#fff" stroke="#b8d0e1" stroke-width="3"/><rect x="648" y="19" width="294" height="312" rx="15" fill="#fff" stroke="#b8d0e1" stroke-width="3"/><text x="166" y="64" font-size="23" font-weight="bold" text-anchor="middle">ДО</text><text x="481" y="64" font-size="23" font-weight="bold" text-anchor="middle">ВО ВРЕМЯ</text><text x="795" y="64" font-size="23" font-weight="bold" text-anchor="middle">ПОСЛЕ</text><circle cx="166" cy="148" r="47" fill="#e2eff6" stroke="#699bc0" stroke-width="4"/><path d="M143 149h47M150 133h33M150 166h30" stroke="#5785a8" stroke-width="6" stroke-linecap="round"/><circle cx="481" cy="148" r="47" fill="#f9e8ce" stroke="#c39a5d" stroke-width="4"/><path d="M481 117v50M454 144h54" stroke="#b08349" stroke-width="8" stroke-linecap="round"/><circle cx="795" cy="148" r="47" fill="#e2efe6" stroke="#7cad90" stroke-width="4"/><path d="M766 148l20 21 35-42" fill="none" stroke="#598b6d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="222" font-size="17" text-anchor="middle">Предсказуемость</text><text x="166" y="252" font-size="17" text-anchor="middle">и доступный выбор</text><text x="481" y="222" font-size="17" text-anchor="middle">Безопасность</text><text x="481" y="252" font-size="17" text-anchor="middle">и снижение нагрузки</text><text x="795" y="222" font-size="17" text-anchor="middle">Отдых</text><text x="795" y="252" font-size="17" text-anchor="middle">и спокойный разговор</text></g></svg>