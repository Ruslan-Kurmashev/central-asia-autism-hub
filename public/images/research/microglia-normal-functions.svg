<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 840" role="img" aria-labelledby="t d"><title id="t">Четыре нормальные функции микроглии в развивающемся мозге</title><desc id="d">Оригинальная схема четырёх направлений деятельности микроглии: наблюдение за окружением, уборка повреждённого материала, взаимодействие с нейронами и перестройка некоторых синапсов. Ни одно направление не равнозначно воспалению или установленной причине аутизма.</desc><rect width="1160" height="840" rx="24" fill="#f1f8fc"/><text x="49" y="69" font-size="30" font-weight="700" font-family="Arial,sans-serif" fill="#17496d">Что делает микроглия в норме</text><text x="49" y="105" font-size="18" font-family="Arial,sans-serif" fill="#53758c">Иммунная защита - лишь часть её функций</text><g fill="#fff" stroke="#b6d1e2" stroke-width="3"><rect x="54" y="159" width="504" height="250" rx="18"/><rect x="602" y="159" width="504" height="250" rx="18"/><rect x="54" y="449" width="504" height="250" rx="18"/><rect x="602" y="449" width="504" height="250" rx="18"/></g><g stroke="#4189b4" stroke-linecap="round" stroke-width="7" fill="none"><path d="M159 299 L119 268 M159 299 L196 264 M159 299 L212 325 M159 299 L116 342"/><path d="M711 290 L673 248 M711 290 L750 256 M711 290 L760 317 M711 290 L668 325"/><path d="M156 590 L116 556 M156 590 L208 552 M156 590 L217 614 M156 590 L120 636"/><path d="M709 588 L667 552 M709 588 L760 553 M709 588 L769 622 M709 588 L661 629"/></g><g fill="#2e7eac" stroke="#fff" stroke-width="4"><circle cx="159" cy="299" r="27"/><circle cx="711" cy="290" r="27"/><circle cx="156" cy="590" r="27"/><circle cx="709" cy="588" r="27"/></g><g font-family="Arial,sans-serif" fill="#215376" font-size="22" font-weight="700"><text x="100" y="220">Наблюдение за средой</text><text x="646" y="220">Удаление клеточных остатков</text><text x="100" y="510">Сигналы и взаимодействия</text><text x="646" y="510">Перестройка части контактов</text></g><g font-family="Arial,sans-serif" fill="#50718a" font-size="17"><text x="100" y="366">Отростки постоянно исследуют</text><text x="100" y="389">микроокружение клетки.</text><text x="646" y="366">Поглощение отдельных частиц</text><text x="646" y="389">и повреждённого материала.</text><text x="100" y="650">Сигналы другим клеткам</text><text x="100" y="674">зависят от состояния ткани.</text><text x="646" y="650">Некоторые синапсы меняются</text><text x="646" y="674">во время развития.</text></g><rect x="54" y="741" width="1052" height="68" rx="12" fill="#deedf7"/><text x="81" y="782" font-family="Arial,sans-serif" font-size="18" fill="#315d7c">Это функции здорового мозга, а не признаки «поломки» иммунной системы.</text></svg>