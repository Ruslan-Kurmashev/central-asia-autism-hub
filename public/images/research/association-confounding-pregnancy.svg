<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 810" role="img" aria-labelledby="t d"><title id="t">Почему статистическая связь не всегда означает причину</title><desc id="d">Авторская схема смешения факторов на примере лечения лихорадки: болезнь или температура может быть связана и с использованием лекарства, и с другими характеристиками исхода. Показаны стрелки от общего фактора к приёму лекарства и к исходу, без утверждения о доказанной причинности температуры и аутизма.</desc><rect width="1120" height="810" rx="23" fill="#f1f8fc"/><text x="50" y="71" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17486e">Корреляция - ещё не причина</text><text x="50" y="107" font-family="Arial,sans-serif" font-size="19" fill="#5a768e">Пример возможного смешения факторов в исследовании беременности</text><g fill="#fff" stroke="#97bfd8" stroke-width="3"><rect x="351" y="168" width="419" height="133" rx="20"/><rect x="47" y="447" width="440" height="143" rx="20"/><rect x="631" y="447" width="440" height="143" rx="20"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#1f577d" font-weight="700" font-size="23"><text x="560" y="218">Причина обращения</text><text x="560" y="249">за лечением: болезнь</text><text x="560" y="278">или высокая температура</text><text x="267" y="500">Применение лекарства</text><text x="267" y="531" font-size="18" font-weight="400">по медицинским показаниям</text><text x="851" y="500">Изучаемый исход</text><text x="851" y="532" font-size="18" font-weight="400">в долгосрочном наблюдении</text></g><g stroke="#4483ac" stroke-width="8" fill="none" stroke-linecap="round"><path d="M419 307 L270 429 l30 -5 M270 429 l4 -30"/><path d="M699 307 L849 429 l-30 -5 M849 429 l-5 -30"/></g><path d="M494 520 H619" fill="none" stroke="#9ab5c7" stroke-width="6" stroke-dasharray="10 12"/><text x="560" y="620" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#58788f">Наблюдаемая связь может оказаться</text><text x="560" y="646" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#58788f">смешением с третьим фактором.</text><rect x="47" y="687" width="1024" height="83" rx="14" fill="#dfedf7"/><text x="74" y="720" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#285a7c">Важно:</text><text x="164" y="720" font-family="Arial,sans-serif" font-size="18" fill="#285a7c">пример не доказывает влияние болезни или лекарства на аутизм.</text><text x="74" y="747" font-family="Arial,sans-serif" font-size="17" fill="#3d6985">Для проверки причинности нужны более строгие исследовательские дизайны.</text></svg>