<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" lang="kk" role="img" aria-labelledby="t d"><title id="t">Зерттеулердің әртүрлі бағалаулары және белгісіздік</title><desc id="d">Ішінара қабаттасатын интервалдары бар екі шартты бағалау: A зерттеуінің интервалы тар, B зерттеуінікі кең. Нақты зерттеулер емес.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1200" height="500" fill="#eff6fa"/><path d="M582 106v332" stroke="#9fbacc" stroke-width="8"/><g stroke="#dca440" stroke-width="12" stroke-linecap="round"><path d="M408 215h290m-78 125h386"/></g><g fill="#2c77a6"><circle cx="553" cy="215" r="24"/><circle cx="813" cy="340" r="24"/></g><text x="80" y="222" font-size="24" text-anchor="start" fill="#225e87">A зерттеуі</text><text x="80" y="347" font-size="24" text-anchor="start" fill="#225e87">B зерттеуі</text><text x="601" y="465" font-size="24" text-anchor="middle" fill="#225e87">Бағалаулар әртүрлі, интервалдар ішінара қабаттасады</text></g></svg>
