<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Зарегистрированные дети и подростки с РАС в Казахстане за 2020-2024 годы</title>
<desc id="chart-desc">Данные электронного регистра в публикации Inbusiness.kz от 16 апреля 2025 года. 2020: 3568, 2021: 4886, 2022: 6558, 2023: 9611, 2024: 12456. Дети 0-17 лет. Это число зарегистрированных детей, не истинная распространённость аутизма.</desc>
