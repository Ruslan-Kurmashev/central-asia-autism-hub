<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">How observed developmental differences lead to a registered autism diagnosis</title>
<desc id="desc">Original explanatory diagram. Left to right: developmental differences noticed, family seeks assessment, professional assessment takes place, confirmed diagnosis enters the official register. None of these steps is automatic. This is not a quantitative dataset.</desc>
<rect width="1200" height="675" fill="#f3f8fb"/>
<rect x="35" y="36" width="1130" height="599" rx="24" fill="#fff" stroke="#cfdfeb" stroke-width="2"/>
<text x="76" y="108" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#123b5b">Why registration counts may rise</text>
<text x="76" y="153" font-family="Arial,sans-serif" font-size="21" fill="#476b83">Several steps lead to a registered diagnosis</text>
<g font-family="Arial,sans-serif">
<rect x="72" y="237" width="240" height="166" rx="18" fill="#e7f1f6" stroke="#9cbfd2" stroke-width="3"/>
<rect x="345" y="237" width="240" height="166" rx="18" fill="#e7f1f6" stroke="#9cbfd2" stroke-width="3"/>
<rect x="618" y="237" width="240" height="166" rx="18" fill="#d5e7f0" stroke="#8fb8cc" stroke-width="3"/>
<rect x="891" y="237" width="237" height="166" rx="18" fill="#286889"/>
<g font-size="21" fill="#143c57" font-weight="700" text-anchor="middle">
<text x="192" y="295">Signs</text><text x="192" y="322">noticed</text>
<text x="465" y="295">Seeking</text><text x="465" y="322">assessment</text>
<text x="738" y="295">Professional</text><text x="738" y="322">assessment</text>
</g>
<g font-size="21" fill="#fff" font-weight="700" text-anchor="middle"><text x="1009" y="295">Diagnosis</text><text x="1009" y="322">registered</text></g>
<g font-size="17" fill="#51738a" text-anchor="middle">
<text x="192" y="369">At home or through</text><text x="192" y="391">early identification</text>
<text x="465" y="369">Access, referral,</text><text x="465" y="391">awareness</text>
<text x="738" y="369">Criteria and</text><text x="738" y="391">specialists</text>
</g>
<g font-size="17" fill="#e9f4f9" text-anchor="middle"><text x="1009" y="369">Under current</text><text x="1009" y="391">reporting rules</text></g>
<g fill="none" stroke="#286889" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M318 319H336"/><path d="M330 310L339 319L330 328"/>
<path d="M591 319H609"/><path d="M603 310L612 319L603 328"/>
<path d="M864 319H882"/><path d="M876 310L885 319L876 328"/>
</g>
<rect x="74" y="465" width="1052" height="108" rx="14" fill="#f5f9fb" stroke="#dceaf0" stroke-width="2"/>
<text x="96" y="505" font-size="22" font-weight="700" fill="#174664">When more children complete these steps, more cases are recorded.</text>
<text x="96" y="545" font-size="19" fill="#456c83">That alone does not show that the true prevalence of autism increased.</text>
<text x="77" y="612" font-size="16" fill="#57788e">Simplified AutismHub diagram, not quantitative data or a clinical assessment.</text>
</g>
</svg>
