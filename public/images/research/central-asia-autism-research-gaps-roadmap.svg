<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title description">
<title id="title">Шесть направлений исследований аутизма, которым требуется больше данных в Центральной Азии</title>
<desc id="description">Оригинальная пояснительная схема AutismHub, не количественная диаграмма и не рейтинг. Шесть направлений: сопоставимая статистика и регистрация; аутичные взрослые и жизненные переходы; диагностика на местных языках; оценка реальных результатов поддержки; опыт самих аутичных людей и семей; сотрудничество между странами и ответственное использование данных. Все направления требуют конкретных исследований с участием местных сообществ.</desc>
<rect width="1200" height="744" rx="24" fill="#f2f8fb"/>
<rect x="30" y="30" width="1140" height="684" rx="24" fill="white" stroke="#d2e2ed" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="66" y="91" fill="#163f59" font-size="31" font-weight="700">Что ещё предстоит изучить в Центральной Азии</text>
<text x="66" y="131" fill="#52768b" font-size="20">Шесть исследовательских задач. Порядок не означает научный рейтинг.</text>
<g fill="#e9f3f8" stroke="#d0e3ec" stroke-width="2">
<rect x="67" y="168" width="523" height="140" rx="15"/><rect x="610" y="168" width="523" height="140" rx="15"/>
<rect x="67" y="326" width="523" height="140" rx="15"/><rect x="610" y="326" width="523" height="140" rx="15"/>
<rect x="67" y="484" width="523" height="140" rx="15"/><rect x="610" y="484" width="523" height="140" rx="15"/>
</g>
<g fill="#286b8d">
<rect x="87" y="189" width="46" height="46" rx="13"/><rect x="630" y="189" width="46" height="46" rx="13"/>
<rect x="87" y="347" width="46" height="46" rx="13"/><rect x="630" y="347" width="46" height="46" rx="13"/>
<rect x="87" y="505" width="46" height="46" rx="13"/><rect x="630" y="505" width="46" height="46" rx="13"/>
</g>
<g fill="white" text-anchor="middle" font-size="20" font-weight="700">
<text x="110" y="219">01</text><text x="653" y="219">02</text>
<text x="110" y="377">03</text><text x="653" y="377">04</text>
<text x="110" y="535">05</text><text x="653" y="535">06</text>
</g>
<g fill="#174762" font-size="23" font-weight="700">
<text x="148" y="217">Сопоставимые данные</text><text x="691" y="217">Взрослая жизнь</text>
<text x="148" y="375">Местные языки</text><text x="691" y="375">Проверка поддержки</text>
<text x="148" y="533">Участие сообщества</text><text x="691" y="533">Сотрудничество</text>
</g>
<g fill="#476d84" font-size="18">
<text x="88" y="264">Единые определения, возраст,</text><text x="88" y="289">регистры и популяционные выборки</text>
<text x="631" y="264">Диагностика взрослых, образование,</text><text x="631" y="289">занятость и доступность услуг</text>
<text x="88" y="422">Культурная адаптация и проверка</text><text x="88" y="447">точности исследовательских инструментов</text>
<text x="631" y="422">Участие, коммуникация и качество</text><text x="631" y="447">жизни за пределами одного занятия</text>
<text x="88" y="580">Мнение аутичных людей и семей</text><text x="88" y="605">при постановке научных вопросов</text>
<text x="631" y="580">Открытые протоколы, этика и</text><text x="631" y="605">совместные исследования стран</text>
</g>
<text x="67" y="669" font-size="17" fill="#54788d">Источник направлений: обзор Zakirova-Engstrand и Yakubova (2024) и исследования 2022-2026 годов.</text>
<text x="67" y="696" font-size="15" fill="#638397">Оригинальная образовательная схема AutismHub. Не количественная оценка и не утверждённая программа финансирования.</text>
</g>
</svg>