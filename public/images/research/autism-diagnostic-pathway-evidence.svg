<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" width="1448" height="1086" lang="ru" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Клиническая оценка при подозрении на аутизм</title>
<desc id="figure-desc">Четыре ориентировочных компонента клинической оценки: обращение и история развития, оценка коммуникации и поведения, медицинский контекст с дополнительными обследованиями по показаниям, клиническое заключение и рекомендации по поддержке. Последовательность может различаться.</desc>
<style>
  .heading {font:700 43px Arial,"DejaVu Sans",sans-serif;fill:#172b47}
  .step-title {font:700 28px Arial,"DejaVu Sans",sans-serif;fill:#172b47}
  .step-text {font:400 24px Arial,"DejaVu Sans",sans-serif;fill:#414e61}
  .number {font:700 37px Arial,"DejaVu Sans",sans-serif;fill:#fff}
  .note-label {font:700 28px Arial,"DejaVu Sans",sans-serif;fill:#172b47}
  .note {font:400 22px Arial,"DejaVu Sans",sans-serif;fill:#36485d}
</style>
<rect width="1448" height="1086" fill="#f7f9fc"/>
<text x="75" y="77" class="heading">Клиническая оценка при подозрении на аутизм</text>
<rect x="67" y="128" width="1314" height="147" rx="17" fill="#fff" stroke="#a0bdd4" stroke-width="2"/>
<circle cx="161" cy="201" r="36" fill="#367da6"/>
<text x="161" y="212" text-anchor="middle" class="number">1</text>
<text x="241" y="183" class="step-title"><tspan x="241" dy="0">Повод для обращения и анамнез развития</tspan></text>
<text x="241" y="227" class="step-text"><tspan x="241" dy="0">Вопросы семьи, история развития ребёнка, повседневное функционирование</tspan><tspan x="241" dy="30">и ранние этапы развития</tspan></text>
<rect x="67" y="328" width="1314" height="147" rx="17" fill="#fff" stroke="#a0bdd4" stroke-width="2"/>
<circle cx="161" cy="401" r="36" fill="#367da6"/>
<text x="161" y="412" text-anchor="middle" class="number">2</text>
<text x="241" y="374" class="step-title"><tspan x="241" dy="0">Коммуникация, социальное взаимодействие, сенсорные особенности</tspan><tspan x="241" dy="35">и поведение</tspan></text>
<text x="241" y="440" class="step-text"><tspan x="241" dy="0">Клиническое наблюдение и оценка по установленным диагностическим критериям</tspan></text>
<rect x="67" y="528" width="1314" height="147" rx="17" fill="#fff" stroke="#a0bdd4" stroke-width="2"/>
<circle cx="161" cy="601" r="36" fill="#367da6"/>
<text x="161" y="612" text-anchor="middle" class="number">3</text>
<text x="241" y="583" class="step-title"><tspan x="241" dy="0">Медицинский контекст и сопутствующие состояния</tspan></text>
<text x="241" y="627" class="step-text"><tspan x="241" dy="0">По индивидуальным показаниям могут рассматриваться генетическое обследование,</tspan><tspan x="241" dy="30">оценка слуха, ЭЭГ, МРТ и другие исследования</tspan></text>
<rect x="67" y="728" width="1314" height="147" rx="17" fill="#fff" stroke="#a0bdd4" stroke-width="2"/>
<circle cx="161" cy="801" r="36" fill="#367da6"/>
<text x="161" y="812" text-anchor="middle" class="number">4</text>
<text x="241" y="783" class="step-title"><tspan x="241" dy="0">Клиническое заключение и рекомендации по поддержке</tspan></text>
<text x="241" y="827" class="step-text"><tspan x="241" dy="0">Обсуждение сильных сторон, потребностей и доступных форм поддержки</tspan></text>
<path d="M724 281 v26 m-12 -12 l12 12 12 -12" fill="none" stroke="#568ba9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M724 481 v26 m-12 -12 l12 12 12 -12" fill="none" stroke="#568ba9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M724 681 v26 m-12 -12 l12 12 12 -12" fill="none" stroke="#568ba9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="52" y="927" width="1344" height="115" rx="20" fill="#e5edf5"/>
<text x="92" y="979" class="note-label">Важно:</text>
<line x1="239" x2="239" y1="952" y2="1016" stroke="#a2bdce" stroke-width="2"/>
<text x="264" y="970" class="note"><tspan x="264">Схема носит ориентировочный характер. Последовательность и набор этапов</tspan><tspan x="264" dy="32">могут различаться. Ни одно исследование не заменяет комплексную клиническую оценку.</tspan></text>
</svg>
