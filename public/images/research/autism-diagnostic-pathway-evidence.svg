<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" role="img" aria-labelledby="t d"><title id="t">Как проводится клиническая оценка аутизма</title><desc id="d">Концептуальная схема: обеспокоенность развитием, сбор истории, наблюдение и оценка общения, рассмотрение сопутствующих состояний, клиническое заключение и план поддержки. Дополнительные генетические исследования, ЭЭГ или МРТ возможны по медицинским показаниям, но сами по себе не являются тестами аутизма.</desc><rect width="1120" height="900" rx="22" fill="#f0f7fc"/><text x="48" y="63" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#19486c">Клинический путь: от вопросов семьи к поддержке</text><g stroke="#a6c8dd" stroke-width="2" fill="#fff"><rect x="91" y="120" width="940" height="117" rx="17"/><rect x="91" y="289" width="940" height="117" rx="17"/><rect x="91" y="458" width="940" height="117" rx="17"/><rect x="91" y="627" width="940" height="117" rx="17"/></g><g fill="#307eac" stroke="#fff" stroke-width="4"><circle cx="158" cy="178" r="27"/><circle cx="158" cy="347" r="27"/><circle cx="158" cy="516" r="27"/><circle cx="158" cy="685" r="27"/></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#fff"><text x="158" y="186">1</text><text x="158" y="355">2</text><text x="158" y="524">3</text><text x="158" y="693">4</text></g><g font-family="Arial,sans-serif" fill="#1e547a" font-weight="700" font-size="22"><text x="223" y="170">Поводы для оценки и история развития</text><text x="223" y="340">Общение, взаимодействие, сенсорика, поведение</text><text x="223" y="509">Медицинский контекст и сопутствующие состояния</text><text x="223" y="678">Совместное клиническое заключение и рекомендации</text></g><g font-family="Arial,sans-serif" fill="#50738b" font-size="17"><text x="223" y="206">Наблюдения семьи, условия и ранние этапы развития</text><text x="223" y="375">Оценка специалиста по установленным диагностическим критериям</text><text x="223" y="545">Генетика, слух, ЭЭГ, МРТ только по индивидуальным показаниям</text><text x="223" y="715">Профиль сильных сторон, потребностей и доступной поддержки</text></g><g stroke="#4b88b1" stroke-width="5" fill="none" stroke-linecap="round"><path d="M552 244 V278 l-10 -12 M552 278 l10 -12"/><path d="M552 413 V447 l-10 -12 M552 447 l10 -12"/><path d="M552 582 V616 l-10 -12 M552 616 l10 -12"/></g><rect x="90" y="785" width="940" height="78" rx="15" fill="#deedf7"/><text x="113" y="820" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2a5b7d">Важно:</text><text x="206" y="820" font-family="Arial,sans-serif" font-size="18" fill="#3c6884">схема ориентировочная, порядок может отличаться.</text><text x="113" y="845" font-family="Arial,sans-serif" font-size="17" fill="#3c6884">Никакое отдельное исследование не заменяет комплексную оценку.</text></svg>