<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Генетика и средовые факторы развития аутизма</title><desc id="d">Оригинальная образовательная векторная композиция: двойная спираль ДНК и пересекающиеся условные линии воздействий и развивающихся нейронных путей. Не количественная причинная модель, изображение плода или клинический биомаркер аутизма.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf7fc"/><stop offset="1" stop-color="#d7eaf7"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><g fill="none" stroke-width="7" stroke-linecap="round"><path d="M671 126 C820 176 664 242 828 305 S681 431 861 513" stroke="#347da9"/><path d="M837 126 C686 176 843 242 684 305 S835 431 661 513" stroke="#8bbad7"/></g><g stroke="#5593bc" stroke-width="5"><path d="M688 141 H818 M720 193 H792 M699 260 H822 M705 341 H823 M726 405 H801 M682 474 H835"/></g><g fill="none" stroke="#7caaca" stroke-width="6" stroke-linecap="round"><path d="M891 162 C983 186 981 255 1092 272"/><path d="M889 294 C980 319 1003 415 1105 432"/><path d="M890 504 C1000 501 974 535 1070 551"/></g><g fill="#2f7faf" stroke="#fff" stroke-width="6"><circle cx="1092" cy="272" r="22"/><circle cx="1105" cy="432" r="26"/><circle cx="1070" cy="551" r="20"/></g><rect x="53" y="39" width="623" height="125" rx="14" fill="#fff" opacity=".94"/><text x="79" y="87" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#194a70">Почему развивается аутизм?</text><text x="79" y="124" font-family="Arial,sans-serif" font-size="19" fill="#4f738d">Генетика, наблюдаемые факторы и доказательства</text><rect x="53" y="509" width="575" height="70" rx="13" fill="#fff" opacity=".87"/><text x="78" y="553" font-family="Arial,sans-serif" font-size="18" fill="#315f7c">Связь не всегда означает причину</text></svg>