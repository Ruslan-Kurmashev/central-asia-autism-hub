<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 870" role="img" aria-labelledby="t d"><title id="t">Уровни работы нервной системы от клетки до поведения</title><desc id="d">Редакционная образовательная схема четырёх уровней: отдельные нейроны, локальные цепи, взаимодействующие большие сети и индивидуальные функции человека. Стрелки показывают уровень организации, а не точную причинную цепочку или диагностическую схему аутизма.</desc><rect width="1160" height="870" rx="20" fill="#f1f8fc"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17446b">От сигналов клеток к сложным функциям мозга</text><text x="50" y="100" font-family="Arial,sans-serif" font-size="18" fill="#58758e">Четыре уровня описания, которые нельзя смешивать</text><g font-family="Arial,sans-serif"><rect x="54" y="145" width="502" height="260" rx="20" fill="#fff" stroke="#9fc3db" stroke-width="2"/><rect x="606" y="145" width="502" height="260" rx="20" fill="#fff" stroke="#9fc3db" stroke-width="2"/><rect x="54" y="448" width="502" height="260" rx="20" fill="#fff" stroke="#9fc3db" stroke-width="2"/><rect x="606" y="448" width="502" height="260" rx="20" fill="#fff" stroke="#9fc3db" stroke-width="2"/><g font-size="25" font-weight="700" fill="#205277"><text x="79" y="196">1. Нейроны</text><text x="631" y="196">2. Локальные цепи</text><text x="79" y="499">3. Большие сети</text><text x="631" y="499">4. Функции человека</text></g><g font-size="18" fill="#4b6981"><text x="79" y="374">Импульсы, рецепторы, синапсы</text><text x="631" y="374">Взаимодействие групп нейронов</text><text x="79" y="677">Согласованность разных областей</text><text x="631" y="677">Восприятие, внимание, общение</text></g></g><g fill="none" stroke="#4784ad" stroke-linecap="round" stroke-width="5"><path d="M160 303 L240 256 L319 302 L410 260"/><path d="M160 303 L253 335 L319 302 M240 256 L253 335"/><path d="M708 296 L772 241 L838 309 L909 240 L1005 298"/><path d="M708 296 L790 345 L838 309 L932 341 L1005 298"/></g><g fill="#307ba8" stroke="#fff" stroke-width="5"><circle cx="160" cy="303" r="18"/><circle cx="240" cy="256" r="18"/><circle cx="319" cy="302" r="18"/><circle cx="410" cy="260" r="18"/><circle cx="253" cy="335" r="18"/><circle cx="708" cy="296" r="16"/><circle cx="772" cy="241" r="16"/><circle cx="838" cy="309" r="18"/><circle cx="909" cy="240" r="16"/><circle cx="1005" cy="298" r="16"/><circle cx="790" cy="345" r="16"/><circle cx="932" cy="341" r="16"/></g><g stroke="#437fa8" stroke-width="5" fill="none"><path d="M144 593 C198 532 242 641 312 583 S423 549 477 606 M144 596 L307 605 L477 574"/><path d="M699 602 h321 M747 573 v59 M855 558 v80 M960 574 v59"/></g><g fill="#327cac"><circle cx="145" cy="593" r="19"/><circle cx="307" cy="605" r="21"/><circle cx="477" cy="574" r="20"/></g><rect x="54" y="753" width="1054" height="77" rx="14" fill="#deedf8"/><text x="77" y="786" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#224e70">Важно:</text><text x="168" y="786" font-family="Arial,sans-serif" font-size="18" fill="#315f7b">уровни взаимодействуют, но наблюдение на одном уровне не объясняет</text><text x="77" y="811" font-family="Arial,sans-serif" font-size="18" fill="#315f7b">автоматически поведение конкретного человека.</text></svg>