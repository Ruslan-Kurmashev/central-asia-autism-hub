<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Как работают гены в развивающемся мозге</title><desc id="d">Оригинальная учебная векторная иллюстрация. Слева схематичная молекула ДНК и её связи, справа условная нервная клетка с ветвящимися отростками. Это художественная научная схема, а не изображение клетки конкретного человека или генетического теста.</desc>
