<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" lang="en" role="img" aria-labelledby="t d"><title id="t">How a scientific study is conducted</title><desc id="d">Question, plan, ethics, data, analysis and conclusion. Educational illustration, not actual data.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1200" height="500" fill="#edf5fa"/><rect x="40" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="121" y="225" font-size="25" text-anchor="middle" fill="#1c5b8a">Question</text><rect x="235" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="316" y="225" font-size="25" text-anchor="middle" fill="#1c5b8a">Plan</text><rect x="430" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="511" y="225" font-size="25" text-anchor="middle" fill="#1c5b8a">Ethics</text><rect x="625" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="706" y="225" font-size="25" text-anchor="middle" fill="#1c5b8a">Data</text><rect x="820" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="901" y="225" font-size="25" text-anchor="middle" fill="#1c5b8a">Analysis</text><rect x="1015" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="1096" y="225" font-size="25" text-anchor="middle" fill="#1c5b8a">Conclusion</text><text x="600" y="366" font-size="23" text-anchor="middle" fill="#275d86">After publication, new studies test the conclusions</text></g></svg>
