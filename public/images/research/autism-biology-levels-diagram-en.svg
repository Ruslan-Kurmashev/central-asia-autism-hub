<g font-family="Georgia, 'Times New Roman', serif" fill="#112238">
<g font-weight="700" font-size="32">
<text x="92" y="267">Genetic features</text>
<text x="496" y="267">Brain cell</text><text x="496" y="306">development</text>
<text x="886" y="267">Neural networks</text>
<text x="1279" y="267">Individual profile</text>
</g>
<g font-size="27" fill="#25323f">
<text x="93" y="380">Rare and common DNA</text><text x="93" y="418">variants, gene regulation</text>
<text x="496" y="380">Formation, maturation</text><text x="496" y="418">and connections</text><text x="496" y="456">between brain cells</text>
<text x="886" y="380">Signal processing, neural</text><text x="886" y="418">connections and</text><text x="886" y="456">development of functions</text>
<text x="1279" y="380">Communication, sensory</text><text x="1279" y="418">experiences, interests,</text><text x="1279" y="456">learning, diversity</text>
</g>
</g>
