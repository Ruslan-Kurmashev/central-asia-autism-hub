<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" lang="en" role="img" aria-labelledby="title description">
<title id="title">How Biology May Be Linked to Autism</title>
<desc id="description">Four research levels: genetic features, brain-cell development, neural networks and individual profiles. Further research examines prenatal development, immune and metabolic processes. Arrows are illustrative, not a proven universal causal pathway.</desc>
<rect width="1672" height="941" fill="#fbfcfd"/>
<rect x="66" y="34" width="14" height="92" fill="#617d93"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="119" y="75" font-size="52" font-weight="700" fill="#102034">How Biology May Be Linked to Autism</text>
<text x="119" y="120" font-size="29" fill="#4d5765">Levels of scientific explanation, not an individual diagnostic pathway</text>
</g>
<line x1="65" y1="159" x2="1607" y2="159" stroke="#92a8b9" stroke-width="2"/>
