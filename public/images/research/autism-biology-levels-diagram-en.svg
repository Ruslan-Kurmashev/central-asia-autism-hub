<g font-family="Georgia, 'Times New Roman', serif">
<text x="135" y="608" font-size="36" font-weight="700" fill="#17283b">What Else Are Researchers Studying?</text>
<g font-size="27" fill="#25323f">
<text x="135" y="657">Factors during pregnancy and early development, immune and metabolic processes, and their</text>
<text x="135" y="694">interactions with genetic characteristics.</text>
</g>
</g>
<rect x="53" y="768" width="1542" height="109" rx="16" fill="#e7edf2"/>
<g font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1c2937">
<text x="94" y="812"><tspan font-weight="700">Important:</tspan><tspan> the arrows show a general research framework, but do not prove that autism develops</tspan></text>
<text x="94" y="851">this way in any particular person.</text>
</g>
