<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Как масштаб оси влияет на впечатление от столбцов</title><desc id="d">Два условных значения 80 и 84 представлены парами столбцов с разными масштабами оси. Числа учебные.</desc><rect width="1200" height="520" fill="#eff6fa"/><g stroke="#5689ab" stroke-width="8" fill="none"><path d="M100 416v-298m0 298h450M669 416V118m0 298h440"/></g><g fill="#a9cedf"><rect x="191" y="176" width="116" height="240"/><rect x="821" y="364" width="116" height="52"/></g><g fill="#438db6"><rect x="356" y="164" width="116" height="252"/><rect x="980" y="162" width="116" height="254"/></g><g fill="#225c83" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" text-anchor="middle"><text x="319" y="81">Ось от нуля</text><text x="896" y="81">Ось начинается с 79</text><text x="248" y="460">80</text><text x="414" y="460">84</text><text x="879" y="460">80</text><text x="1037" y="460">84</text></g><g fill="#597d94" font-family="DejaVu Sans,Arial,sans-serif" font-size="22"><text x="63" y="416">0</text><text x="618" y="416">79</text></g></svg>