<text x="76" y="97" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17466b">Почему аутизм настолько различается?</text>
<text x="76" y="136" font-family="Arial,sans-serif" font-size="19" fill="#50758d">Биология, развитие и индивидуальные потребности</text>
