<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Почему аутизм у разных людей различается</title>
<desc id="d">Оригинальная абстрактная векторная схема нескольких пересекающихся нейронных путей и различных кругов вокруг общего центра. Это концепция разнообразия индивидуальных профилей, а не изображение реальных пациентов, данных обследования или типов аутизма.</desc>
