<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 900" role="img" aria-labelledby="t d"><title id="t">Как передаётся сигнал в химическом синапсе</title><desc id="d">Поэтапная иллюстрация: электрический импульс достигает окончания аксона, пузырьки выделяют нейромедиатор в узкую синаптическую щель, молекулы связываются с рецепторами следующей клетки. Схема не передаёт масштабы и не отражает конкретный механизм аутизма.</desc><rect width="1150" height="900" rx="24" fill="#f1f8fc"/><text x="50" y="66" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17456b">Химический синапс: путь сигнала</text><text x="50" y="102" font-family="Arial,sans-serif" font-size="18" fill="#527087">Схема упрощена: электрический сигнал, химический посредник, ответ клетки</text><rect x="110" y="150" width="920" height="255" rx="38" fill="#d3eafa" stroke="#498cb6" stroke-width="4"/><rect x="110" y="555" width="920" height="180" rx="38" fill="#d3eafa" stroke="#498cb6" stroke-width="4"/><rect x="110" y="408" width="920" height="144" rx="12" fill="#fff" stroke="#d7e8f3" stroke-width="2"/><g fill="#87b9d9" stroke="#387daa" stroke-width="3"><circle cx="326" cy="285" r="44"/><circle cx="465" cy="286" r="44"/><circle cx="603" cy="285" r="44"/><circle cx="741" cy="286" r="44"/></g><g fill="#2b729e"><circle cx="309" cy="274" r="7"/><circle cx="331" cy="294" r="7"/><circle cx="342" cy="270" r="7"/><circle cx="451" cy="269" r="7"/><circle cx="476" cy="300" r="7"/><circle cx="595" cy="288" r="7"/><circle cx="616" cy="269" r="7"/></g><g fill="#276b9b"><circle cx="357" cy="444" r="9"/><circle cx="399" cy="494" r="9"/><circle cx="454" cy="463" r="9"/><circle cx="527" cy="493" r="9"/><circle cx="609" cy="440" r="9"/><circle cx="684" cy="479" r="9"/><circle cx="769" cy="439" r="9"/></g><g fill="#428caf"><path d="M342 547 h22 v38 h-22 z"/><path d="M441 547 h22 v38 h-22 z"/><path d="M540 547 h22 v38 h-22 z"/><path d="M639 547 h22 v38 h-22 z"/><path d="M738 547 h22 v38 h-22 z"/></g><g fill="none" stroke="#246a96" stroke-width="6" stroke-linecap="round"><path d="M164 197 H228 l-17 -12 M228 197 l-17 12"/><path d="M413 352 v54 l-12 -14 M413 406 l12 -14"/><path d="M614 496 v51 l-12 -14 M614 547 l12 -14"/></g><g font-family="Arial,sans-serif" fill="#153f65"><text x="244" y="193" font-size="20" font-weight="700">1. Приходит импульс</text><text x="805" y="275" font-size="20" font-weight="700">Пузырьки</text><text x="805" y="299" font-size="18">с веществом</text><text x="793" y="470" font-size="18">2. Нейромедиатор</text><text x="793" y="494" font-size="18">в щели</text><text x="802" y="635" font-size="19" font-weight="700">3. Рецепторы</text><text x="802" y="659" font-size="18">клетки-получателя</text></g><rect x="110" y="775" width="920" height="77" rx="14" fill="#dfeef8"/><text x="134" y="807" font-family="Arial,sans-serif" font-size="18" fill="#285674">Нейромедиаторы воздействуют на рецепторы: эффект может быть разным</text><text x="134" y="832" font-family="Arial,sans-serif" font-size="18" fill="#285674">в зависимости от вещества, рецептора и состояния нейронной сети.</text></svg>