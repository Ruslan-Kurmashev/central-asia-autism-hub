<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" lang="kk" role="img" aria-labelledby="title description">
<title id="title">Биология аутизммен қалай байланысты болуы мүмкін</title>
<desc id="description">Зерттеудің төрт деңгейі: генетикалық ерекшеліктер, ми жасушаларының дамуы, нейрондық желілер және жеке ерекшеліктер. Жүктілік, иммундық және метаболизмдік үдерістер қосымша зерттеледі. Көрсеткілер баршаға ортақ дәлелденген себептік жолды білдірмейді.</desc>
<rect width="1672" height="941" fill="#fbfcfd"/>
<rect x="66" y="34" width="14" height="92" fill="#617d93"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="119" y="75" font-size="49" font-weight="700" fill="#102034">Биология аутизммен қалай байланысты болуы мүмкін</text>
<text x="119" y="120" font-size="29" fill="#4d5765">Ғылыми түсіндіру деңгейлері, жеке диагностикалық жол емес</text>
</g>
<line x1="65" y1="159" x2="1607" y2="159" stroke="#92a8b9" stroke-width="2"/>
<defs>
<clipPath id="b1"><rect x="59" y="209" width="350" height="290" rx="17"/></clipPath>
<clipPath id="b2"><rect x="461" y="209" width="340" height="290" rx="17"/></clipPath>
<clipPath id="b3"><rect x="852" y="209" width="341" height="290" rx="17"/></clipPath>
<clipPath id="b4"><rect x="1245" y="209" width="361" height="290" rx="17"/></clipPath>
</defs>
<g stroke="#9aaebf" stroke-width="1.6" fill="#fff">
<rect x="59" y="209" width="350" height="290" rx="17"/>
<rect x="461" y="209" width="340" height="290" rx="17"/>
<rect x="852" y="209" width="341" height="290" rx="17"/>
<rect x="1245" y="209" width="361" height="290" rx="17"/>
</g>
<g fill="#e7edf2">
<rect x="59" y="209" width="350" height="124" clip-path="url(#b1)"/>
<rect x="461" y="209" width="340" height="124" clip-path="url(#b2)"/>
<rect x="852" y="209" width="341" height="124" clip-path="url(#b3)"/>
<rect x="1245" y="209" width="361" height="124" clip-path="url(#b4)"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" fill="#112238">
<g font-weight="700" font-size="30">
<text x="92" y="267">Генетикалық</text><text x="92" y="306">ерекшеліктер</text>
<text x="496" y="267">Ми жасушаларының</text><text x="496" y="306">дамуы</text>
<text x="886" y="267">Нейрондық</text><text x="886" y="306">желілер</text>
<text x="1279" y="267">Жеке</text><text x="1279" y="306">ерекшеліктер</text>
</g>
<g font-size="25" fill="#25323f">
<text x="93" y="380">ДНҚ-ның сирек және</text><text x="93" y="418">жиі нұсқалары,</text><text x="93" y="456">гендердің реттелуі</text>
<text x="496" y="380">Жасушалардың</text><text x="496" y="418">қалыптасуы, жетілуі</text><text x="496" y="456">және өзара байланысы</text>
<text x="886" y="380">Сигналдарды өңдеу,</text><text x="886" y="418">байланыстардың жұмысы,</text><text x="886" y="456">қызметтердің дамуы</text>
<text x="1279" y="369">Қарым-қатынас,</text><text x="1279" y="402">сенсорлық ерекшеліктер,</text><text x="1279" y="435">қызығушылықтар, оқу,</text><text x="1279" y="468">әртүрлілік</text>
</g>
</g>
<g stroke="#627f95" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M418 358 H447 M438 347 L449 358 L438 369"/>
<path d="M810 358 H839 M830 347 L841 358 L830 369"/>
<path d="M1203 358 H1232 M1223 347 L1234 358 L1223 369"/>
</g>
<path d="M827 511 V553" fill="none" stroke="#8ca2b3" stroke-width="2" stroke-dasharray="7 9"/>
<rect x="53" y="554" width="1542" height="170" rx="16" fill="#fff" stroke="#a8b9c7" stroke-width="1.7"/>
<rect x="86" y="581" width="8" height="112" fill="#859caf"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="135" y="608" font-size="36" font-weight="700" fill="#17283b">Тағы нені зерттейді?</text>
<g font-size="26" fill="#25323f">
<text x="135" y="657">Жүктілік пен ерте даму факторлары, иммундық және метаболизмдік үдерістер,</text>
<text x="135" y="694">сондай-ақ олардың генетикалық ерекшеліктермен өзара әрекеттесуі.</text>
</g>
</g>
<rect x="53" y="768" width="1542" height="109" rx="16" fill="#e7edf2"/>
<g font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1c2937">
<text x="94" y="812"><tspan font-weight="700">Маңызды:</tspan><tspan> көрсеткілер зерттеудің жалпы логикасын көрсетеді, бірақ әр адамда аутизм</tspan></text>
<text x="94" y="851">дәл осы жолмен дамитынын дәлелдемейді.</text>
</g>
</svg>
