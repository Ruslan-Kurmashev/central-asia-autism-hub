<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Четыре уровня участия ребёнка в инклюзивном образовании</title>
<desc id="desc">Оригинальная концептуальная схема AutismHub. Четыре последовательных вопроса: есть ли доступ к школе, может ли ребёнок присутствовать, участвует ли в школьной жизни, получает ли доступное обучение. Под схемой перечислены условия: подготовка педагогов, адаптации среды, коммуникация, сотрудничество с семьёй и оценка реальных результатов. Это не диагностическая шкала, не обязательный маршрут и не измеренные данные.</desc>
<rect width="1200" height="700" rx="24" fill="#f2f8fb"/>
<rect x="35" y="32" width="1130" height="636" rx="22" fill="white" stroke="#d3e2eb" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="72" y="90" fill="#153f5d" font-size="32" font-weight="700">Инклюзивное образование: от записи в школу к участию</text>
<text x="72" y="128" fill="#4d7087" font-size="20">Образовательная среда должна быть доступной не только на бумаге</text>
<g>
<rect x="72" y="215" width="243" height="160" rx="17" fill="#e7f2f7" stroke="#acc9d9" stroke-width="2"/>
<rect x="342" y="215" width="243" height="160" rx="17" fill="#e7f2f7" stroke="#acc9d9" stroke-width="2"/>
<rect x="612" y="215" width="243" height="160" rx="17" fill="#d9ebf3" stroke="#92b9cc" stroke-width="2"/>
<rect x="882" y="215" width="243" height="160" rx="17" fill="#28698a"/>
</g>
<g text-anchor="middle" font-size="25" font-weight="700" fill="#174563">
<text x="193" y="276">Доступ</text>
<text x="463" y="276">Присутствие</text>
<text x="734" y="276">Участие</text>
</g>
<text x="1004" y="276" text-anchor="middle" font-size="25" font-weight="700" fill="white">Обучение</text>
<g text-anchor="middle" fill="#4d7187" font-size="18">
<text x="193" y="319">Можно поступить</text><text x="193" y="347">и посещать</text>
<text x="463" y="319">Есть условия</text><text x="463" y="347">оставаться в классе</text>
<text x="734" y="319">Есть общение</text><text x="734" y="347">и общие задачи</text>
</g>
<g text-anchor="middle" fill="#eff9ff" font-size="18">
<text x="1004" y="319">Есть доступ</text><text x="1004" y="347">к содержанию урока</text>
</g>
<g fill="none" stroke="#2f6f91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M317 296H338M329 286L339 296L329 306"/>
<path d="M587 296H608M599 286L609 296L599 306"/>
<path d="M857 296H878M869 286L879 296L869 306"/>
</g>
<text x="74" y="448" fill="#184761" font-size="23" font-weight="700">Что поддерживает каждый этап</text>
<rect x="73" y="473" width="1051" height="124" rx="13" fill="#f2f7fa" stroke="#d6e5ed"/>
<g fill="#285b79" font-size="19">
<text x="94" y="512">Подготовка педагогов</text><text x="423" y="512">Доступная среда</text><text x="752" y="512">Коммуникация</text>
<text x="94" y="565">Сотрудничество с семьёй</text><text x="545" y="565">Оценка участия и учебных результатов</text>
</g>
<text x="73" y="636" fill="#57798b" font-size="16">Учебная схема AutismHub, без количественных данных и без оценок конкретных школ.</text>
</g>
</svg>