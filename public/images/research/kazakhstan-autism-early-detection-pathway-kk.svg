<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Аутизмді ерте анықтау: ата-ананың сұрағынан кәсіби бағалауға дейін</title>
<desc id="desc">AutismHub-тың төрт кезеңді түсіндірме схемасы: дамуды бақылау, скрининг, нәтижені нақтылау және қажет болса кәсіби бағалау. Тікелей бағыттау белгісі алаңдаушылық сақталса, скрининг нәтижесіне қарамастан бағалау керегін көрсетеді. Бұл диагностикалық алгоритм де, M-CHAT-R/F көшірмесі де емес.</desc>
<rect width="1200" height="680" fill="#f2f8fb" rx="20"/>
<rect x="36" y="34" width="1128" height="614" rx="24" fill="white" stroke="#cedfe8" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="70" y="92" font-size="31" font-weight="700" fill="#153e5a">Скрининг анықтауға көмектеседі, диагноз қоймайды</text>
<text x="70" y="132" font-size="18" fill="#4d7085">Даму туралы мәлімет кәсіби бағалаудың қажеттігін анықтауға көмектеседі</text>
<g stroke="#9cbdd0" stroke-width="2">
<rect x="67" y="225" width="242" height="181" rx="17" fill="#e7f1f6"/>
<rect x="343" y="225" width="242" height="181" rx="17" fill="#e7f1f6"/>
<rect x="619" y="225" width="242" height="181" rx="17" fill="#dcebf2"/>
<rect x="895" y="225" width="242" height="181" rx="17" fill="#286889" stroke="#286889"/>
</g>
<g fill="#143e5a" text-anchor="middle" font-size="24" font-weight="700">
<text x="188" y="289">Дамуды</text><text x="188" y="322">бақылау</text>
<text x="464" y="289">Скрининг</text><text x="464" y="322">тәуекелі</text>
<text x="740" y="289">Нәтижені</text><text x="740" y="322">нақтылау</text>
</g>
<g fill="#f7fcff" text-anchor="middle" font-size="24" font-weight="700">
<text x="1016" y="289">Кәсіби</text><text x="1016" y="322">бағалау</text>
</g>
<g fill="#516f83" text-anchor="middle" font-size="18">
<text x="188" y="371">Отбасы және маман</text>
<text x="464" y="371">Сауалнама, диагноз емес</text>
<text x="740" y="371">Қажет кезде әңгімелесу</text>
</g>
<text x="1016" y="371" text-anchor="middle" font-size="18" fill="#e9f6fb">Даму мен мінез-құлық</text>
<g fill="none" stroke="#2e6e90" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M317 317h18m-8-9 9 9-9 9"/>
<path d="M593 317h18m-8-9 9 9-9 9"/>
<path d="M869 317h18m-8-9 9 9-9 9"/>
<path d="M189 412V460H1015V416"/>
<path d="M996 434l19-20 19 20"/>
</g>
<rect x="67" y="483" width="1070" height="106" fill="#f2f8fb" stroke="#d6e7f0" stroke-width="2" rx="13"/>
<text x="93" y="523" font-size="18" fill="#174967" font-weight="700">При сохраняющемся беспокойстве бағалау нужна независимо от нақтылау анкеты.</text>
<text x="93" y="556" font-size="16" fill="#4c7086">Положительный скрининг не подтверждает РАС; отрицательный не исключает особенности бақылау.</text>
<text x="71" y="623" font-size="15" fill="#56778c">AutismHub схемасы. Диагностикалық шектер, анкета сұрақтары, пациент деректері жоқ.</text>
</g>
</svg>