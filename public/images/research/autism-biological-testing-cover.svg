<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Можно ли определить аутизм по МРТ, крови или генетике?</title><desc id="d">Абстрактная авторская схема: слева условный контур головы, справа символы ДНК, изображения снимка и капли крови. Все значки соединены с центральным знаком вопроса. Не реальный снимок, медицинский анализ или способ установления диагноза.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#eff8fc"/><stop offset="1" stop-color="#d9ecf7"/></linearGradient></defs><rect width="1200" height="630" fill="url(#g)"/><g stroke="#5694bb" stroke-width="9" fill="none" stroke-linecap="round"><path d="M774 180 C685 180 643 236 643 309 C643 365 673 413 717 436 L717 501 L870 501 L870 455 C933 413 956 359 947 300 C938 222 877 180 774 180Z"/><path d="M757 263 C795 249 828 300 794 322 C754 347 808 370 797 396"/><path d="M688 310 L640 310 M942 308 L985 308"/></g><g fill="#2d7fb0"><circle cx="798" cy="435" r="10"/><circle cx="1046" cy="232" r="19"/><circle cx="1059" cy="428" r="20"/><circle cx="1025" cy="340" r="15"/></g><g stroke="#79abc9" stroke-width="6" fill="none"><path d="M1042 168 Q1100 201 1045 232 Q997 269 1042 300"/><path d="M1082 168 Q1025 201 1082 232 Q1120 269 1082 300"/><path d="M1043 203 H1082 M1045 266 H1082"/></g><rect x="1020" y="384" width="84" height="92" rx="16" fill="#fff" stroke="#5e94b5" stroke-width="5"/><path d="M1044 410 H1082 M1044 437 H1082" stroke="#689fc0" stroke-width="7"/><rect x="43" y="40" width="645" height="131" rx="16" fill="#fff" opacity=".95"/><text x="68" y="88" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#16486c">Можно ли выявить аутизм</text><text x="68" y="128" font-family="Arial,sans-serif" font-size="24" fill="#416e8b">по МРТ, крови или анализу ДНК?</text><rect x="44" y="527" width="685" height="56" rx="12" fill="#fff" opacity=".86"/><text x="66" y="563" font-family="Arial,sans-serif" font-size="18" fill="#2d5a79">Научные возможности и границы клинической диагностики</text></svg>