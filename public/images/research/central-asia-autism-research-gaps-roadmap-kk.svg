<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title description">
<title id="title">Орталық Азиядағы аутизм зерттеулеріне қажет алты бағыт</title>
<desc id="description">AutismHub жасаған түсіндірме сызба. Сандық диаграмма да, рейтинг те емес. Алты бағыт: салыстырмалы деректер, аутизмі бар ересектер, жергілікті тілдегі бағалау, қолдаудың күнделікті нәтижелері, қоғамдастықтың қатысуы және елдердің этикалық ғылыми ынтымақтастығы.</desc>
<rect width="1200" height="744" rx="24" fill="#f2f8fb"/>
<rect x="30" y="30" width="1140" height="684" rx="24" fill="white" stroke="#d2e2ed" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="66" y="91" fill="#163f59" font-size="31" font-weight="700">Орталық Азияда аутизм туралы тағы нені зерттеу керек?</text>
<text x="66" y="131" fill="#52768b" font-size="20">Алты зерттеу бағыты. Бұл маңыздылық рейтингі емес.</text>
<g fill="#e9f3f8" stroke="#d0e3ec" stroke-width="2">
<rect x="67" y="168" width="523" height="140" rx="15"/><rect x="610" y="168" width="523" height="140" rx="15"/>
<rect x="67" y="326" width="523" height="140" rx="15"/><rect x="610" y="326" width="523" height="140" rx="15"/>
<rect x="67" y="484" width="523" height="140" rx="15"/><rect x="610" y="484" width="523" height="140" rx="15"/>
</g>
<g fill="#286b8d">
<rect x="87" y="189" width="46" height="46" rx="13"/><rect x="630" y="189" width="46" height="46" rx="13"/>
<rect x="87" y="347" width="46" height="46" rx="13"/><rect x="630" y="347" width="46" height="46" rx="13"/>
<rect x="87" y="505" width="46" height="46" rx="13"/><rect x="630" y="505" width="46" height="46" rx="13"/>
</g>
<g fill="white" text-anchor="middle" font-size="20" font-weight="700">
<text x="110" y="219">01</text><text x="653" y="219">02</text>
<text x="110" y="377">03</text><text x="653" y="377">04</text>
<text x="110" y="535">05</text><text x="653" y="535">06</text>
</g>
<g fill="#174762" font-size="23" font-weight="700">
<text x="148" y="217">Салыстырмалы деректер</text><text x="691" y="217">Ересек өмір</text>
<text x="148" y="375">Жергілікті тілдер</text><text x="691" y="375">Қолдаудың нәтижесі</text>
<text x="148" y="533">Қоғамдастықтың қатысуы</text><text x="691" y="533">Еларалық зерттеулер</text>
</g>
<g fill="#476d84" font-size="18">
<text x="88" y="264">Ортақ анықтамалар, жас топтары,</text><text x="88" y="289">тіркелімдер мен популяциялық іріктемелер</text>
<text x="631" y="264">Ересектерді бағалау, білім беру,</text><text x="631" y="289">жұмыс пен қызметтерге қолжетімділік</text>
<text x="88" y="422">Мәдени бейімдеу және құралдардың</text><text x="88" y="447">өлшеу дәлдігін тексеру</text>
<text x="631" y="422">Бір сабақтан тыс қатысу,</text><text x="631" y="447">қарым-қатынас пен өмір сапасы</text>
<text x="88" y="580">Аутизмі бар адамдар мен отбасылар</text><text x="88" y="605">зерттеу сұрақтарын таңдауға қатысады</text>
<text x="631" y="580">Ортақ хаттамалар, этика және</text><text x="631" y="605">елдер арасындағы бірлескен зерттеу</text>
</g>
<text x="67" y="669" font-size="17" fill="#54788d">Негізі: Zakirova-Engstrand және Yakubova (2024), 2022-2026 жылдардағы зерттеулер.</text>
<text x="67" y="696" font-size="15" fill="#638397">AutismHub түсіндірме сызбасы. Сандық бағалау да, бекітілген қаржыландыру жоспары да емес.</text>
</g>
</svg>