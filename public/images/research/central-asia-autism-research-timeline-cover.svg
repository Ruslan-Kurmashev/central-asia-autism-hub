<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Выбранные этапы исследований аутизма в Центральной Азии, 2013-2026</title>
<desc id="desc">Оригинальная редакционная хронология, а не полный список научных работ. 2013: качественное исследование родительского движения в Казахстане. 2019: экспериментальные исследования взаимодействия детей с роботом. 2024: региональный обзор, 11 работ опубликовано в 2013-2021 годах, и исследования скрининга и семей. 2025: национальная статистика и опросы семей в Казахстане, статья об опыте матерей в Узбекистане вышла онлайн. 2026: исследования казахстанских регистров и статистики Таджикистана.</desc>
<rect width="1200" height="680" rx="20" fill="#f4f9fc"/>
<rect x="30" y="28" width="1140" height="624" rx="22" fill="#ffffff" stroke="#d0e1ea" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="68" y="86" fill="#163d5b" font-size="31" font-weight="700">Как развивались региональные исследования аутизма</text>
<text x="68" y="124" fill="#52758a" font-size="20">Выбранные публикации, а не полная библиография и не статистика диагнозов</text>
<line x1="118" y1="266" x2="1080" y2="266" stroke="#c0d7e3" stroke-width="8" stroke-linecap="round"/>
<g fill="#276b8c" stroke="#fff" stroke-width="6">
<circle cx="132" cy="266" r="18"/><circle cx="361" cy="266" r="18"/><circle cx="589" cy="266" r="18"/><circle cx="817" cy="266" r="18"/><circle cx="1045" cy="266" r="18"/>
</g>
<g fill="#173f5b" text-anchor="middle" font-size="28" font-weight="700">
<text x="132" y="213">2013</text><text x="361" y="213">2019</text><text x="589" y="213">2024</text><text x="817" y="213">2025</text><text x="1045" y="213">2026</text>
</g>
<g fill="#eaf3f7" stroke="#d2e2eb" stroke-width="2">
<rect x="55" y="310" width="154" height="232" rx="14"/>
<rect x="242" y="310" width="238" height="232" rx="14"/>
<rect x="494" y="310" width="190" height="232" rx="14"/>
<rect x="698" y="310" width="238" height="232" rx="14"/>
<rect x="950" y="310" width="209" height="232" rx="14"/>
</g>
<g fill="#1c4d6a" font-size="19" font-weight="700" text-anchor="middle">
<text x="132" y="358">Родители</text><text x="132" y="387">и инклюзия</text>
<text x="361" y="358">Исследования</text><text x="361" y="387">взаимодействия</text><text x="361" y="416">с роботом</text>
<text x="589" y="358">Обзор науки,</text><text x="589" y="387">скрининг,</text><text x="589" y="416">семьи</text>
<text x="817" y="358">Доступность</text><text x="817" y="387">помощи,</text><text x="817" y="416">региональные</text><text x="817" y="445">тенденции</text>
<text x="1045" y="358">Национальные</text><text x="1045" y="387">регистры,</text><text x="1045" y="416">Таджикистан</text>
</g>
<g fill="#52758a" font-size="16" text-anchor="middle">
<text x="132" y="492">Качественное</text><text x="132" y="515">исследование</text>
<text x="361" y="492">Небольшие выборки,</text><text x="361" y="515">пилотный дизайн</text>
<text x="589" y="492">11 работ</text><text x="589" y="515">в обзоре 2024 г.</text>
<text x="817" y="492">Опросы родителей</text><text x="817" y="515">и реестровые данные</text>
<text x="1045" y="492">Анализ медицинской</text><text x="1045" y="515">регистрации</text>
</g>
<text x="70" y="591" fill="#496c81" font-size="18">Годы относятся к публикациям. Работы различаются по задачам, выборкам и силе доказательств.</text>
<text x="70" y="618" fill="#496c81" font-size="17">Источники и ограничения приведены в тексте. Оригинальная схема AutismHub, 15.10.2026.</text>
</g>
