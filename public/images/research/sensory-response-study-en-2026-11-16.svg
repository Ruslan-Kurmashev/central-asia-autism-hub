<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1494 1282" width="1494" height="1282" lang="en" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">How Sensory Responses Are Studied</title><desc id="figdesc">Illustrative table comparing clinical presentation, observed behaviour, physiology, perception, brain function and structure with research methods and possible results. Hypothetical examples, not diagnostic criteria or a causal progression.</desc>
<rect width="1494" height="1282" fill="#ffffff"/>
<text x="25" y="52" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#173f5b"><tspan x="25" dy="0">How Sensory Responses Are Studied</tspan></text>
<text x="25" y="111" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="25" font-weight="400" fill="#46677d"><tspan x="25" dy="0">A scientific model using heightened response to sound as an example</tspan></text>
<rect x="20" y="176" width="1450" height="72" fill="#173b55"/>
<text x="39" y="223" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#ffffff"><tspan x="39" dy="0">Level of analysis</tspan></text>
<text x="396" y="223" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#ffffff"><tspan x="396" dy="0">Example method</tspan></text>
<text x="906" y="223" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#ffffff"><tspan x="906" dy="0">Example of a possible result</tspan></text>
<rect x="20" y="248" width="1450" height="162" fill="#f4f9fb"/>
<text x="39" y="338" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Clinical presentation</tspan></text>
<text x="396" y="307" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Parent questionnaire or interview about</tspan><tspan x="396" dy="31">how sensory experiences affect everyday</tspan><tspan x="396" dy="31">life</tspan></text>
<text x="906" y="322.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Everyday noise makes it difficult for the child to</tspan><tspan x="906" dy="31">interact with other people</tspan></text>
<rect x="20" y="410" width="1450" height="162" fill="#ffffff"/>
<text x="39" y="500" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Observed response</tspan></text>
<text x="396" y="500" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Observing behavior</tspan></text>
<text x="906" y="484.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">The child covers their ears at ordinary sounds, for</tspan><tspan x="906" dy="31">example, when a blender is running</tspan></text>
<rect x="20" y="572" width="1450" height="162" fill="#f4f9fb"/>
<text x="39" y="662" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Physiological response</tspan></text>
<text x="396" y="646.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Measuring autonomic responses: heart</tspan><tspan x="396" dy="31">rate and skin conductance</tspan></text>
<text x="906" y="646.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Increased heart rate in response to sounds at</tspan><tspan x="906" dy="31">normal volume</tspan></text>
<rect x="20" y="734" width="1450" height="162" fill="#ffffff"/>
<text x="39" y="824" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Perception</tspan></text>
<text x="396" y="808.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Psychophysical test: detecting or</tspan><tspan x="396" dy="31">distinguishing sound signals</tspan></text>
<text x="906" y="824" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Lower threshold for detecting sounds</tspan></text>
<rect x="20" y="896" width="1450" height="162" fill="#f4f9fb"/>
<text x="39" y="986" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Functional brain response</tspan></text>
<text x="396" y="986" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Functional MRI (fMRI)</tspan></text>
<text x="906" y="970.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Stronger response in brain networks involved in</tspan><tspan x="906" dy="31">sound processing</tspan></text>
<rect x="20" y="1058" width="1450" height="162" fill="#ffffff"/>
<text x="39" y="1148" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Brain structure</tspan></text>
<text x="396" y="1132.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Structural MRI: volume and connectivity of</tspan><tspan x="396" dy="31">brain regions</tspan></text>
<text x="906" y="1132.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Greater connectivity between areas involved in</tspan><tspan x="906" dy="31">auditory processing</tspan></text>
