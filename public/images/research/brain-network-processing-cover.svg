<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Нейронные сети и обработка информации в мозге</title><desc id="d">Оригинальная концептуальная диаграмма: группы условных нервных клеток соединены несколькими пересекающимися путями. Не реальные данные МРТ, не схема нейросети конкретного человека и не биомаркер аутизма.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f4fa"/><stop offset="1" stop-color="#d6e9f7"/></linearGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#97b8d0" opacity=".3"/></pattern></defs><rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><g stroke="#4e8bb1" stroke-width="4" opacity=".7" fill="none"><path d="M145 341 Q270 210 375 280 T615 315 T881 235 L1042 304"/><path d="M145 341 L288 445 L507 475 L702 441 L881 235"/><path d="M375 280 L470 166 L724 182 L881 235"/><path d="M375 280 L507 475 M615 315 L702 441 M615 315 L724 182 M702 441 L1042 304 M881 235 L985 431 M288 445 L470 166"/></g><g stroke="#f7fbfd" stroke-width="6" fill="#2473a5"><circle cx="145" cy="341" r="38"/><circle cx="288" cy="445" r="28"/><circle cx="375" cy="280" r="34"/><circle cx="470" cy="166" r="25"/><circle cx="507" cy="475" r="29"/><circle cx="615" cy="315" r="44"/><circle cx="702" cy="441" r="29"/><circle cx="724" cy="182" r="30"/><circle cx="881" cy="235" r="39"/><circle cx="985" cy="431" r="26"/><circle cx="1042" cy="304" r="35"/></g><g fill="#c4e5f4"><circle cx="145" cy="341" r="12"/><circle cx="375" cy="280" r="11"/><circle cx="615" cy="315" r="15"/><circle cx="881" cy="235" r="13"/><circle cx="1042" cy="304" r="11"/></g><rect x="50" y="34" width="652" height="91" rx="14" fill="#fff" opacity=".93"/><text x="77" y="77" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17476b">Как мозг обрабатывает информацию</text><text x="77" y="103" font-fam