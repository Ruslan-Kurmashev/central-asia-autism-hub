<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 875" lang="en" role="img" aria-labelledby="t d">
<title id="t">An individual profile, not a severity scale</title>
<desc id="d">Six areas around a central individual profile: communication, sensory experience, daily living, attention and learning, health and co-occurring conditions, and interests and strengths. Connecting lines indicate interaction, not measured severity or fixed autism subtypes.</desc>
<rect width="1100" height="875" rx="22" fill="#f1f8fc"/>
<text x="44" y="65" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#17476c">Not a line from “mild” to “severe”</text>
<text x="44" y="100" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#53758d">A profile covers different areas, each of which matters</text>
<g fill="none" stroke="#6ca1c1" stroke-width="5" stroke-linecap="round"><path d="M554 423 L258 242 M554 423 L834 242 M554 423 L248 434 M554 423 L849 434 M554 423 L258 626 M554 423 L833 626"/></g>
<g fill="#fff" stroke="#9ac1da" stroke-width="3"><rect x="72" y="170" width="348" height="121" rx="18"/><rect x="688" y="170" width="338" height="121" rx="18"/><rect x="72" y="362" width="348" height="121" rx="18"/><rect x="688" y="362" width="338" height="121" rx="18"/><rect x="72" y="554" width="348" height="121" rx="18"/><rect x="688" y="554" width="338" height="121" rx="18"/></g>
<circle cx="552" cy="423" r="112" fill="#307eae" stroke="#fff" stroke-width="7"/>
<g fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="552" y="414" >Individual</text><text x="552" y="447" >profile</text></g>
<g font-family="Arial,DejaVu Sans,sans-serif" fill="#22577b" text-anchor="middle" font-size="21" font-weight="700"><text x="246" y="222" >Communication</text><text x="857" y="222" >Sensory experience</text><text x="246" y="412" >Daily living</text><text x="857" y="412" >Attention and learning</text><text x="246" y="607" >Health</text><text x="857" y="607" >Interests and strengths</text></g>
<g font-family="Arial,DejaVu Sans,sans-serif" fill="#50778e" text-anchor="middle" font-size="16"><text x="246" y="253" >Speech, gestures, AAC</text><text x="857" y="253" >Responses vary</text><text x="246" y="444" >Independence</text><text x="857" y="444" >Ways of learning</text><text x="246" y="639" >Sleep, anxiety, more</text><text x="857" y="639" >Preferences and skills</text></g>
<rect x="44" y="735" width="1010" height="102" rx="16" fill="#deedf7"/>
<text x="69" y="772" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#204d70">Note:</text>
<text x="190" y="772" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#3b607b">This figure lists areas to consider, not a rating scale.</text>
<text x="69" y="803" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#3b607b">People with the same diagnosis may need very different support.</text>
</svg>