<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Генетика аутизма: схематичная молекула ДНК</title><desc id="desc">Оригинальная учебная векторная иллюстрация двух условных цепей ДНК и поперечных связей на светло-голубом фоне. Не реальные данные генетического обследования и не конкретный вариант аутизма.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6f3fb"/><stop offset="1" stop-color="#f8fbfd"/></linearGradient><pattern id="p" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#a8c6db" opacity=".5"/></pattern></defs><rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#p)"/><g fill="none" stroke-linecap="round"><path d="M180 130 C470 -70 700 750 1034 485" stroke="#1b6495" stroke-width="14"/><path d="M180 485 C470 685 700 -130 1034 130" stroke="#62a4c9" stroke-width="14"/></g><g stroke-width="7" stroke-linecap="round"><path d="M203 122 L203 494" stroke="#8cb9d2"/><path d="M272 126 L272 503" stroke="#72a8c6"/><path d="M342 198 L342 432" stroke="#8cb9d2"/><path d="M412 298 L412 328" stroke="#72a8c6"/><path d="M482 394 L482 240" stroke="#8cb9d2"/><path d="M552 463 L552 171" stroke="#72a8c6"/><path d="M622 487 L622 144" stroke="#8cb9d2"/><path d="M692 463 L692 160" stroke="#72a8c6"/><path d="M762 401 L762 224" stroke="#8cb9d2"/><path d="M832 302 L832 320" stroke="#72a8c6"/><path d="M902 194 L902 429" stroke="#8cb9d2"/><path d="M972 131 L972 485" stroke="#72a8c6"/></g><rect x="62" y="38" width="470" height="86" rx="14" fill="#fff" opacity=".9"/><text x="86" y="83" font-family="Arial,sans-serif" font-weight="700" font-size="30" fill="#164c74">Генетика и аутизм</text><text x="86" y="106" font-family="Arial,sans-serif" font-size="16" fill="#557891">Иллюстрация, а не результат анализа ДНК</text></svg>