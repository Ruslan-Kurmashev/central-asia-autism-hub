<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" lang="kk" role="img" aria-labelledby="t d"><title id="t">Корреляция және үш себептік гипотеза</title><desc id="d">A факторы B-ге, B факторы A-ға немесе ортақ C факторы екеуіне де әсер етуі мүмкін. Байланыстар дәлелденген себептер емес.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1200" height="520" fill="#eff6fa"/><g fill="#fff" stroke="#a0bed4" stroke-width="8"><circle cx="174" cy="240" r="77"/><circle cx="420" cy="240" r="77"/><circle cx="776" cy="240" r="77"/><circle cx="1022" cy="240" r="77"/><circle cx="600" cy="390" r="65"/></g><text x="174" y="253" font-size="40" text-anchor="middle" fill="#245f8d">A</text><text x="420" y="253" font-size="40" text-anchor="middle" fill="#245f8d">B</text><text x="776" y="253" font-size="40" text-anchor="middle" fill="#245f8d">A</text><text x="1022" y="253" font-size="40" text-anchor="middle" fill="#245f8d">B</text><text x="600" y="402" font-size="40" text-anchor="middle" fill="#245f8d">C</text><g stroke="#dda345" stroke-width="9" fill="none"><path d="M253 240h85m608 0h-89M558 365 487 305m156 60 72-60"/></g><text x="297" y="98" font-size="24" text-anchor="middle" fill="#245f8d">A факторы B-ге әсер ете ме?</text><text x="900" y="98" font-size="24" text-anchor="middle" fill="#245f8d">B факторы A-ға әсер ете ме?</text><text x="600" y="490" font-size="24" text-anchor="middle" fill="#245f8d">Ортақ C факторы екеуіне де әсер етуі мүмкін</text></g></svg>
