<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" lang="en" role="img" aria-labelledby="t d"><title id="t">Differences between study designs</title><desc id="d">Four designs: cross-sectional snapshot, cohort, randomised trial and systematic review.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1300" height="500" fill="#edf5fa"/><rect x="60" y="142" width="230" height="190" rx="22" fill="#fff" stroke="#abcadc" stroke-width="7"/><text x="175" y="227" font-size="32" text-anchor="middle" fill="#225c88">Snapshot</text><text x="175" y="278" font-size="19" text-anchor="middle" fill="#496c87">One point in time</text><rect x="355" y="142" width="230" height="190" rx="22" fill="#fff" stroke="#abcadc" stroke-width="7"/><text x="470" y="227" font-size="32" text-anchor="middle" fill="#225c88">Cohort</text><text x="470" y="278" font-size="19" text-anchor="middle" fill="#496c87">Several years</text><rect x="650" y="142" width="230" height="190" rx="22" fill="#fff" stroke="#abcadc" stroke-width="7"/><text x="765" y="227" font-size="32" text-anchor="middle" fill="#225c88">RCT</text><text x="765" y="278" font-size="19" text-anchor="middle" fill="#496c87">Random allocation</text><rect x="945" y="142" width="230" height="190" rx="22" fill="#fff" stroke="#abcadc" stroke-width="7"/><text x="1060" y="227" font-size="32" text-anchor="middle" fill="#225c88">Review</text><text x="1060" y="278" font-size="19" text-anchor="middle" fill="#496c87">Several studies</text><text x="650" y="413" font-size="23" text-anchor="middle" fill="#225c88">The study design depends on the research question</text></g></svg>
