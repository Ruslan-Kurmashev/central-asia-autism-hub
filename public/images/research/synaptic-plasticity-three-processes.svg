<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 735" role="img" aria-labelledby="t d"><title id="t">Как связи между нейронами изменяются в процессе развития</title><desc id="d">Схема трёх нормальных процессов: формирование новых контактов, изменение силы передачи сигнала и удаление некоторых соединений. Отмечено, что это части динамического развития, а не установленный универсальный механизм аутизма.</desc><rect width="1130" height="735" rx="24" fill="#f2f8fc"/><text x="42" y="69" fill="#163f63" font-size="30" font-weight="700" font-family="Arial,sans-serif">Нейронные связи не остаются неизменными</text><text x="42" y="104" fill="#54748e" font-size="18" font-family="Arial,sans-serif">Три разных процесса во время развития, обучения и адаптации</text><g font-family="Arial,sans-serif"><rect x="42" y="150" width="330" height="465" rx="18" fill="#fff" stroke="#aecddd" stroke-width="2"/><rect x="400" y="150" width="330" height="465" rx="18" fill="#fff" stroke="#aecddd" stroke-width="2"/><rect x="758" y="150" width="330" height="465" rx="18" fill="#fff" stroke="#aecddd" stroke-width="2"/><g fill="#195278" font-size="23" font-weight="700"><text x="65" y="195">Образование</text><text x="65" y="223">контактов</text><text x="423" y="195">Изменение силы</text><text x="423" y="223">передачи сигнала</text><text x="781" y="195">Удаление части</text><text x="781" y="223">соединений</text></g><g fill="#436784" font-size="17"><text x="65" y="535">Появляются новые</text><text x="65" y="561">взаимодействия.</text><text x="423" y="535">Сила передачи сигнала</text><text x="423" y="561">может изменяться.</text><text x="781" y="535">Некоторые связи</text><text x="781" y="561">перестраиваются.</text></g></g><g stroke="#558cb4" stroke-width="4" stroke-linecap="round" fill="none"><path d="M92 350 L313 350"/><path d="M92 405 L313 405" stroke-dasharray="8 12"/><path d="M452 350 L670 350" stroke-width="12"/><path d="M452 405 L670 405" stroke-width="4"/><path d="M808 350 L1031 350"/><path d="M808 405 L1031 405" stroke="#bdd4e3" stroke-dasharray="6 12"/></g><g fill="#27739f"><circle cx="92" cy="350" r="18"/><circle cx="313" cy="350" r="18"/><circle cx="92" cy="405" r="18"/><circle cx="313" cy="405" r="18"/><circle cx="452" cy="350" r="18"/><circle cx="670" cy="350" r="18"/><circle cx="452" cy="405" r="18"/><circle cx="670" cy="405" r="18"/><circle cx="808" cy="350" r="18"/><circle cx="1031" cy="350" r="18"/><circle cx="808" cy="405" r="18"/><circle cx="1031" cy="405" r="18"/></g><rect x="42" y="648" width="1046" height="61" rx="12" fill="#dceef8"/><text x="68" y="676" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#224e70">Важно:</text><text x="161" y="676" font-family="Arial,sans-serif" font-size="17" fill="#224e70">это упрощение нормальной пластичности, не модель «избытка связей при аутизме».</text><text x="68" y="698" font-family="Arial,sans-serif" font-size="16" fill="#315f7d">Исследования не доказывают единую направленность изменений для всех аутичных людей.</text></svg>