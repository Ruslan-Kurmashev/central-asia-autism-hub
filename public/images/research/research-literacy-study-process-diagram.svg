<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Как проводится научное исследование</title><desc id="d">Вопрос, план, этика, данные, анализ и вывод. Учебная схема, не реальные данные.</desc><rect width="1200" height="500" fill="#edf5fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="40" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="121" y="225" text-anchor="middle" font-size="25" fill="#1c5b8a">Вопрос</text><rect x="235" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="316" y="225" text-anchor="middle" font-size="25" fill="#1c5b8a">План</text><rect x="430" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="511" y="225" text-anchor="middle" font-size="25" fill="#1c5b8a">Этика</text><rect x="625" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="706" y="225" text-anchor="middle" font-size="25" fill="#1c5b8a">Данные</text><rect x="820" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="901" y="225" text-anchor="middle" font-size="25" fill="#1c5b8a">Анализ</text><rect x="1015" y="160" width="162" height="115" rx="17" fill="white" stroke="#9abdd8" stroke-width="6"/><text x="1096" y="225" text-anchor="middle" font-size="25" fill="#1c5b8a">Вывод</text><text x="600" y="366" font-size="23" text-anchor="middle" fill="#275d86">После публикации выводы проверяют новые исследования</text></g></svg>