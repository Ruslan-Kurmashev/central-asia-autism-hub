<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Корреляция и три причинные гипотезы</title><desc id="d">Связь А с Б может возникать при влиянии А на Б, Б на А, либо при общем факторе В. Стрелки обозначают возможные, а не доказанные отношения.</desc><rect width="1200" height="520" fill="#eff6fa"/><g fill="#fff" stroke="#a0bed4" stroke-width="8"><circle cx="174" cy="240" r="77"/><circle cx="420" cy="240" r="77"/><circle cx="776" cy="240" r="77"/><circle cx="1022" cy="240" r="77"/><circle cx="600" cy="390" r="65"/></g><g fill="#245f8d" font-size="40" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif"><text x="174" y="253">А</text><text x="420" y="253">Б</text><text x="776" y="253">А</text><text x="1022" y="253">Б</text><text x="600" y="402">В</text></g><g stroke="#dda345" stroke-width="9" fill="none"><path d="M253 240h85m608 0h-89M558 365 487 305m156 60 72-60"/></g><g fill="#245f8d" font-size="24" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif"><text x="297" y="98">А влияет на Б?</text><text x="900" y="98">Б влияет на А?</text><text x="600" y="490">Общий фактор В может влиять на оба</text></g></svg>