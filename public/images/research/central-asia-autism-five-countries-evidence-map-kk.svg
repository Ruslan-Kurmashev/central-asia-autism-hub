<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Орталық Азияның бес елі: аутизмді есепке алудың әртүрлі деректері</title>
<desc id="desc">AutismHub жасаған, әртүрлі есеп түрлерін түсіндіретін сызба. Қазақстанда 2026 жылы динамикалық бақылауда 17 196 бала. Қырғызстанда 2024 жылға аутизммен 423 бала тіркелгені хабарланған. Өзбекстан мен Түрікменстан үшін салыстырмалы ұлттық сан расталмаған. Тәжікстанда 2020-2025 жылдары жиыны 170 тіркеу жағдайы. Бұл көрсеткіштерді елдердегі аутизм таралуы ретінде салыстыруға болмайды.</desc>
<rect width="1200" height="720" rx="24" fill="#f3f8fb"/>
<rect x="37" y="35" width="1126" height="650" rx="22" fill="#fff" stroke="#cbdfea" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="75" y="95" fill="#123c59" font-size="34" font-weight="700">Орталық Азиядағы аутизм: қандай деректер бар?</text>
<text x="75" y="135" fill="#4b6e85" font-size="21">Бұл рейтинг емес. Елдерде есептеу әдістері әртүрлі.</text>
<g fill="#eaf3f8"><rect x="72" y="166" width="1055" height="84" rx="14"/><rect x="72" y="261" width="1055" height="84" rx="14"/><rect x="72" y="356" width="1055" height="84" rx="14"/><rect x="72" y="451" width="1055" height="84" rx="14"/><rect x="72" y="546" width="1055" height="84" rx="14"/></g>
<g fill="#236589"><rect x="72" y="166" width="12" height="84" rx="6"/><rect x="72" y="261" width="12" height="84" rx="6"/><rect x="72" y="356" width="12" height="84" rx="6"/><rect x="72" y="451" width="12" height="84" rx="6"/><rect x="72" y="546" width="12" height="84" rx="6"/></g>
<g fill="#173f5c" font-size="25" font-weight="700">
<text x="110" y="202">Қазақстан</text><text x="110" y="297">Қырғызстан</text>
<text x="110" y="392">Өзбекстан</text><text x="110" y="487">Тәжікстан</text><text x="110" y="582">Түрікменстан</text>
</g>
<g fill="#164969" font-size="27" font-weight="700">
<text x="520" y="203">17 196</text><text x="520" y="298">423</text>
<text x="520" y="393">Расталған сан жоқ</text><text x="520" y="488">170</text>
<text x="520" y="583">Расталған сан жоқ</text>
</g>
<g fill="#4c7086" font-size="18">
<text x="520" y="229">Динамикалық бақылауда, 2026</text><text x="520" y="324">Аутизмі бар тіркелген балалар, 2024</text>
<text x="520" y="419">Ұлттық салыстырмалы АСБ саны расталмады</text><text x="520" y="514">2020-2025 жж. тіркелген жағдайлар жиыны</text>
<text x="520" y="609">Ұлттық салыстырмалы АСБ саны расталмады</text>
</g>
<text x="75" y="664" fill="#466d83" font-size="16">Дереккөздер: ҚР ДСМ, Қырғызстан деректері БАҚ арқылы, Тәжікстан зерттеуі, AutismHub (15.10.2026).</text>
</g>
</svg>
