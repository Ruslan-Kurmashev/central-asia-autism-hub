<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1494 1282" width="1494" height="1282" lang="kk" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Сенсорлық реакцияларды қалай зерттейді</title><desc id="figdesc">Сенсорлық реакциялардың алты деңгейін зерттеу әдістерімен және ықтимал нәтижелермен салыстыратын оқу кестесі. Мысалдар диагнозды немесе дәлелденген себептік тізбекті білдірмейді.</desc>
<rect width="1494" height="1282" fill="#ffffff"/>
<text x="25" y="52" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#173f5b"><tspan x="25" dy="0">Сенсорлық реакцияларды қалай зерттейді</tspan></text>
<text x="25" y="111" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="25" font-weight="400" fill="#46677d"><tspan x="25" dy="0">Дыбысқа күшейген реакция мысалындағы ғылыми модель</tspan></text>
<rect x="20" y="176" width="1450" height="72" fill="#173b55"/>
<text x="39" y="223" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#ffffff"><tspan x="39" dy="0">Талдау деңгейі</tspan></text>
<text x="396" y="223" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#ffffff"><tspan x="396" dy="0">Әдіс мысалы</tspan></text>
<text x="906" y="223" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#ffffff"><tspan x="906" dy="0">Ықтимал нәтиже мысалы</tspan></text>
<rect x="20" y="248" width="1450" height="162" fill="#f4f9fb"/>
<text x="39" y="338" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Клиникалық көрініс</tspan></text>
<text x="396" y="307" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Ата-анадан сауалнама алу не сезімдік</tspan><tspan x="396" dy="31">әсерлердің күнделікті өмірге ықпалы</tspan><tspan x="396" dy="31">туралы сұхбат</tspan></text>
<text x="906" y="322.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Әдеттегі шу баланың өзгелермен</tspan><tspan x="906" dy="31">қарым-қатынасын қиындатады</tspan></text>
<rect x="20" y="410" width="1450" height="162" fill="#ffffff"/>
<text x="39" y="500" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Бақыланатын реакция</tspan></text>
<text x="396" y="500" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Мінез-құлқын бақылау</tspan></text>
<text x="906" y="484.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Бала әдеттегі дыбыстардан, мысалы, блендер</tspan><tspan x="906" dy="31">қосылғанда құлағын жабады</tspan></text>
<rect x="20" y="572" width="1450" height="162" fill="#f4f9fb"/>
<text x="39" y="662" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Физиологиялық реакция</tspan></text>
<text x="396" y="631" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Вегетативтік реакцияларды өлшеу:</tspan><tspan x="396" dy="31">жүрек соғу жиілігі мен терінің электр</tspan><tspan x="396" dy="31">өткізгіштігі</tspan></text>
<text x="906" y="646.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Қалыпты қаттылықтағы дыбыс кезінде жүрек</tspan><tspan x="906" dy="31">соғуы жиілейді</tspan></text>
<rect x="20" y="734" width="1450" height="162" fill="#ffffff"/>
<text x="39" y="824" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Қабылдау</tspan></text>
<text x="396" y="808.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Психофизикалық тест: дыбыстық</tspan><tspan x="396" dy="31">сигналдарды анықтау не ажырату</tspan></text>
<text x="906" y="824" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Дыбысты анықтау шегінің төмен болуы</tspan></text>
<rect x="20" y="896" width="1450" height="162" fill="#f4f9fb"/>
<text x="39" y="970.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Мидың функционалдық</tspan><tspan x="39" dy="31">жауабы</tspan></text>
<text x="396" y="986" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Функционалдық МРТ (фМРТ)</tspan></text>
<text x="906" y="970.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Дыбысты өңдейтін ми желілерінде күштірек</tspan><tspan x="906" dy="31">жауап байқалады</tspan></text>
<rect x="20" y="1058" width="1450" height="162" fill="#ffffff"/>
<text x="39" y="1148" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#24475c"><tspan x="39" dy="0">Ми құрылымы</tspan></text>
<text x="396" y="1132.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="396" dy="0">Құрылымдық МРТ: ми аймақтарының</tspan><tspan x="396" dy="31">көлемі мен байланыстары</tspan></text>
<text x="906" y="1132.5" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#24475c"><tspan x="906" dy="0">Есту ақпаратын өңдейтін аймақтар</tspan><tspan x="906" dy="31">арасындағы байланыстылық жоғары</tspan></text>
<rect x="20" y="176" width="1450" height="1044" fill="none" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="377" x2="377" y1="176" y2="1220" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="887" x2="887" y1="176" y2="1220" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="20" x2="1470" y1="248" y2="248" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="20" x2="1470" y1="410" y2="410" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="20" x2="1470" y1="572" y2="572" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="20" x2="1470" y1="734" y2="734" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="20" x2="1470" y1="896" y2="896" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="20" x2="1470" y1="1058" y2="1058" stroke="#cbd9e1" stroke-width="1.5"/>
<line x1="20" x2="1470" y1="1220" y2="1220" stroke="#cbd9e1" stroke-width="1.5"/>
<text x="22" y="1260" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#4f6b7c"><tspan x="22" dy="0">1-сурет бойынша бейімделген: Schauder және Bennetto (2016) · CC BY 4.0</tspan></text></svg>
