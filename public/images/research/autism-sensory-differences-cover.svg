<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Сенсорное восприятие: звуки, свет и прикосновения</title><desc id="d">Оригинальная концептуальная векторная обложка: условные звуковые волны слева, лучи света в центре и линии прикосновения справа. Изображение не показывает реальные нейронные сигналы или универсальный аутистический профиль.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#edf7fc"/><stop offset="1" stop-color="#d6ebf7"/></linearGradient></defs><rect width="1200" height="630" fill="url(#g)"/><g fill="none" stroke-linecap="round" stroke-width="9"><g stroke="#357aa8"><path d="M155 239 C110 284 110 366 155 408"/><path d="M199 199 C129 266 129 378 199 447"/><path d="M241 162 C147 253 147 394 241 485"/></g><g stroke="#77a8c9"><circle cx="541" cy="324" r="43"/><path d="M541 242 V175 M541 405 V476 M459 324 H391 M623 324 H692 M483 264 L433 215 M597 264 L647 215 M483 383 L433 433 M597 383 L647 433"/></g><g stroke="#3f87af"><path d="M879 458 Q821 384 869 302 Q904 253 940 292 Q973 326 953 365 Q933 392 956 419"/><path d="M919 455 Q890 397 925 358 Q943 337 965 356"/><path d="M843 468 Q771 376 830 277 Q893 201 964 257"/></g></g><g fill="#2c78a5" opacity=".8"><circle cx="288" cy="322" r="17"/><circle cx="741" cy="324" r="16"/><circle cx="1006" cy="410" r="13"/></g><rect x="55" y="39" width="805" height="101" rx="16" fill="#fff" opacity=".96"/><g font-family="Arial,sans-serif" fill="#16476d"><text x="81" y="83" font-size="31" font-weight="700">Почему ощущения могут отличаться?</text><text x="81" y="118" font-size="19" fill="#4c738e">Звуки, освещение, прикосновения и работа мозга</text></g><rect x="87" y="522" width="1026" height="51" rx="13" fill="#ffffff" opacity=".78"/><text x="110" y="554" font-family="Arial,sans-serif" font-size="18" fill="#295b7d">Схематичное изображение, не диагностическая модель аутизма</text></svg>