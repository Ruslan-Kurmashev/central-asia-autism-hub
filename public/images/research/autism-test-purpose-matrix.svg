<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" role="img" aria-labelledby="figure-title figure-desc" lang="ru">
<title id="figure-title">Назначение дополнительных медицинских исследований</title>
<desc id="figure-desc">Таблица из четырёх разделов: МРТ при отдельных неврологических симптомах, ЭЭГ при подозрении на приступы и других неврологических показаниях, генетические исследования для уточнения возможного генетического состояния, лабораторные анализы для оценки сопутствующих заболеваний и дефицитов. Ни один из методов сам по себе не подтверждает диагноз аутизма.</desc>
<style>
  .head { font: 700 27px Georgia, "DejaVu Serif", serif; fill: #153955; }
  .body { font: 23px Georgia, "DejaVu Serif", serif; fill: #203f58; }
</style>
<rect width="1120" height="840" fill="#f2f7fb"/>
<g fill="#ffffff" stroke="#97b7cc" stroke-width="2">
  <rect x="40" y="48" width="503" height="354"/>
  <rect x="577" y="48" width="503" height="354"/>
  <rect x="40" y="438" width="503" height="354"/>
  <rect x="577" y="438" width="503" height="354"/>
</g>
<g fill="#dae7f0">
  <path d="M41 49 H542 V116 H41Z"/>
  <path d="M578 49 H1079 V116 H578Z"/>
  <path d="M41 439 H542 V506 H41Z"/>
  <path d="M578 439 H1079 V506 H578Z"/>
</g>
<g class="head">
  <text x="74" y="92">МРТ</text>
  <text x="611" y="92">ЭЭГ</text>
  <text x="74" y="482" font-size="26">Генетические исследования</text>
  <text x="611" y="482" font-size="26">Лабораторные анализы</text>
</g>
<g class="body">
  <text x="74" y="164">
    <tspan x="74">При отдельных неврологических</tspan>
    <tspan x="74" dy="39">симптомах или подозрении</tspan>
    <tspan x="74" dy="39">на структурную патологию.</tspan>
  </text>
  <text x="611" y="164">
    <tspan x="611">При подозрении на</tspan>
    <tspan x="611" dy="39">эпилептические приступы,</tspan>
    <tspan x="611" dy="39">регресс или другие</tspan>
    <tspan x="611" dy="39">неврологические показания.</tspan>
  </text>
  <text x="74" y="553">
    <tspan x="74">Для уточнения возможной</tspan>
    <tspan x="74" dy="39">генетической причины</tspan>
    <tspan x="74" dy="39">состояния, не как</tspan>
    <tspan x="74" dy="39">самостоятельный тест</tspan>
    <tspan x="74" dy="39">на аутизм.</tspan>
  </text>
  <text x="611" y="553">
    <tspan x="611">Для оценки сопутствующих</tspan>
    <tspan x="611" dy="39">состояний, дефицитов или</tspan>
    <tspan x="611" dy="39">иных медицинских причин</tspan>
    <tspan x="611" dy="39">симптомов.</tspan>
  </text>
</g>
</svg>
