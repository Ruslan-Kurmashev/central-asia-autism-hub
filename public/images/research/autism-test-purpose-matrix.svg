<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 930" role="img" aria-labelledby="t d"><title id="t">Разные исследования отвечают на разные медицинские вопросы</title><desc id="d">Учебные карточки для МРТ, ЭЭГ, генетического исследования и анализа крови: каждое исследование может иметь показания в отдельных ситуациях, но ни одно не является универсальным подтверждением или исключением аутизма.</desc><rect width="1120" height="930" rx="20" fill="#f2f8fc"/><text x="44" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#19496f">Один диагноз - разные вопросы к исследованиям</text><text x="44" y="103" font-family="Arial,sans-serif" font-size="18" fill="#53738c">Назначение определяется клинической задачей, а не только аутизмом</text><g stroke="#a4c7dc" stroke-width="2" fill="#fff"><rect x="49" y="148" width="489" height="305" rx="18"/><rect x="582" y="148" width="489" height="305" rx="18"/><rect x="49" y="486" width="489" height="305" rx="18"/><rect x="582" y="486" width="489" height="305" rx="18"/></g><g fill="#2f7ca9"><circle cx="107" cy="217" r="33"/><circle cx="640" cy="217" r="33"/><circle cx="107" cy="556" r="33"/><circle cx="640" cy="556" r="33"/></g><g fill="#fff" font-family="Arial,sans-serif" text-anchor="middle" font-size="21" font-weight="700"><text x="107" y="224">М</text><text x="640" y="224">Э</text><text x="107" y="563">Д</text><text x="640" y="563">К</text></g><g font-family="Arial,sans-serif" fill="#225778" font-size="24" font-weight="700"><text x="160" y="224">МРТ</text><text x="694" y="224">ЭЭГ</text><text x="160" y="563">Анализы ДНК</text><text x="694" y="563">Анализы крови</text></g><g font-family="Arial,sans-serif" fill="#52748c" font-size="19"><text x="80" y="295">При отдельных неврологических</text><text x="80" y="328">симптомах или подозрении</text><text x="80" y="361">на структурную патологию.</text><text x="613" y="295">При подозрении на</text><text x="613" y="328">эпилептические приступы</text><text x="613" y="361">или особые регрессы.</text><text x="80" y="630">Для уточнения возможного</text><text x="80" y="663">генетического состояния,</text><text x="80" y="696">не как теста аутизма.</text><text x="613" y="630">Для проверки конкретных</text><text x="613" y="663">сопутствующих заболеваний</text><text x="613" y="696">или дефицитов.</text></g><rect x="49" y="827" width="1022" height="74" rx="15" fill="#deedf7"/><text x="79" y="871" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2c5b7c">Ни один метод не даёт универсального «положительно/отрицательно» на аутизм.</text></svg>