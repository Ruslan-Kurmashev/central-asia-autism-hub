<text x="520" y="203">17,196</text><text x="520" y="298">423</text>
<text x="520" y="393">No verified figure</text><text x="520" y="488">170</text>
<text x="520" y="583">No verified figure</text>
</g>
<g fill="#4c7086" font-size="18">
<text x="520" y="229">Under medical monitoring, 2026</text><text x="520" y="324">Registered autistic children, 2024</text>
<text x="520" y="419">Comparable national ASD count not verified</text><text x="520" y="514">Registered cases in total, 2020-2025</text>
<text x="520" y="609">Comparable national ASD count not verified</text>
</g>
