<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Central Asia: five countries and incompatible autism registration data</title>
<desc id="desc">Original AutismHub comparison of incompatible administrative measures. Kazakhstan: 17,196 monitored children in 2026. Kyrgyzstan: 423 children reported with autism in 2024. No comparable verified national values for Uzbekistan or Turkmenistan. Tajikistan: 170 registered cases in total for 2020-2025. These cannot be compared as national prevalence.</desc>
<rect width="1200" height="720" rx="24" fill="#f3f8fb"/>
<rect x="37" y="35" width="1126" height="650" rx="22" fill="#fff" stroke="#cbdfea" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="75" y="95" fill="#123c59" font-size="34" font-weight="700">Autism in Central Asia: what data are available?</text>
<text x="75" y="135" fill="#4b6e85" font-size="21">Not a ranking. Countries report different types of figures.</text>
<g fill="#eaf3f8"><rect x="72" y="166" width="1055" height="84" rx="14"/><rect x="72" y="261" width="1055" height="84" rx="14"/><rect x="72" y="356" width="1055" height="84" rx="14"/><rect x="72" y="451" width="1055" height="84" rx="14"/><rect x="72" y="546" width="1055" height="84" rx="14"/></g>
<g fill="#236589"><rect x="72" y="166" width="12" height="84" rx="6"/><rect x="72" y="261" width="12" height="84" rx="6"/><rect x="72" y="356" width="12" height="84" rx="6"/><rect x="72" y="451" width="12" height="84" rx="6"/><rect x="72" y="546" width="12" height="84" rx="6"/></g>
<g fill="#173f5c" font-size="25" font-weight="700">
<text x="110" y="202">Kazakhstan</text><text x="110" y="297">Kyrgyzstan</text>
<text x="110" y="392">Uzbekistan</text><text x="110" y="487">Tajikistan</text><text x="110" y="582">Turkmenistan</text>
</g>
