</g>
<rect x="67" y="483" width="1070" height="106" fill="#f2f8fb" stroke="#d6e7f0" stroke-width="2" rx="13"/>
<text x="93" y="523" font-size="21" fill="#174967" font-weight="700">При сохраняющемся беспокойстве оценка нужна независимо от результата анкеты.</text>
<text x="93" y="556" font-size="18" fill="#4c7086">Положительный скрининг не подтверждает РАС; отрицательный не исключает особенности развития.</text>
<text x="71" y="623" font-size="15" fill="#56778c">Оригинальная схема AutismHub. Без диагностических порогов, анкетных заданий и данных пациентов.</text>
</g>
