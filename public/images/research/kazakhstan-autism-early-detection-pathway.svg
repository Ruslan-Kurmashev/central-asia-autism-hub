<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Раннее выявление аутизма: от вопросов родителей к профессиональной оценке</title>
<desc id="desc">Оригинальная пояснительная схема AutismHub из четырёх этапов: наблюдение развития ребёнка, скрининговая анкета, уточнение результата и профессиональная оценка при наличии оснований. Стрелка от наблюдения к профессиональной оценке напоминает, что выраженное беспокойство требует оценки независимо от результата скрининга. Это не диагностический алгоритм и не воспроизведение M-CHAT-R/F.</desc>
<rect width="1200" height="680" fill="#f2f8fb" rx="20"/>
<rect x="36" y="34" width="1128" height="614" rx="24" fill="white" stroke="#cedfe8" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="70" y="92" font-size="33" font-weight="700" fill="#153e5a">Скрининг - это этап выявления, а не диагноз</text>
<text x="70" y="132" font-size="20" fill="#4d7085">Как данные о развитии помогают определить необходимость профессиональной оценки</text>
<g stroke="#9cbdd0" stroke-width="2">
<rect x="67" y="225" width="242" height="181" rx="17" fill="#e7f1f6"/>
<rect x="343" y="225" width="242" height="181" rx="17" fill="#e7f1f6"/>
<rect x="619" y="225" width="242" height="181" rx="17" fill="#dcebf2"/>
<rect x="895" y="225" width="242" height="181" rx="17" fill="#286889" stroke="#286889"/>
</g>
<g fill="#143e5a" text-anchor="middle" font-size="24" font-weight="700">
<text x="188" y="289">Наблюдение</text><text x="188" y="322">развития</text>
<text x="464" y="289">Скрининг</text><text x="464" y="322">риска</text>
<text x="740" y="289">Уточнение</text><text x="740" y="322">результата</text>
</g>
<g fill="#f7fcff" text-anchor="middle" font-size="24" font-weight="700">
<text x="1016" y="289">Профессиональная</text><text x="1016" y="322">оценка</text>
</g>
<g fill="#516f83" text-anchor="middle" font-size="18">
<text x="188" y="371">Семья и специалист</text>
<text x="464" y="371">Анкета, не диагноз</text>
<text x="740" y="371">Беседа при показаниях</text>
</g>
<text x="1016" y="371" text-anchor="middle" font-size="18" fill="#e9f6fb">Развитие и поведение</text>
