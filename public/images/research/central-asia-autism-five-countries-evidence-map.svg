<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Пять стран Центральной Азии: разные виды данных о регистрации аутизма</title>
<desc id="desc">Редакционная информационная схема AutismHub. Казахстан: 17 196 детей с РАС на динамическом наблюдении в 2026 году. Кыргызстан: 423 ребёнка с аутизмом по данным медицинского круглого стола о 2024 годе. Узбекистан: национальный сопоставимый показатель РАС не найден. Таджикистан: 170 зарегистрированных случаев суммарно за 2020-2025 годы. Туркменистан: национальный сопоставимый показатель РАС не найден. Все числа различаются по методу и периоду, их нельзя сравнивать как распространённость.</desc>
<rect width="1200" height="720" rx="24" fill="#f3f8fb"/>
<rect x="37" y="35" width="1126" height="650" rx="22" fill="#fff" stroke="#cbdfea" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="75" y="95" fill="#123c59" font-size="34" font-weight="700">Аутизм в Центральной Азии: какие данные доступны?</text>
<text x="75" y="135" fill="#4b6e85" font-size="21">Не рейтинг стран. Показатели относятся к разным системам учёта.</text>
<g fill="#eaf3f8"><rect x="72" y="166" width="1055" height="84" rx="14"/><rect x="72" y="261" width="1055" height="84" rx="14"/><rect x="72" y="356" width="1055" height="84" rx="14"/><rect x="72" y="451" width="1055" height="84" rx="14"/><rect x="72" y="546" width="1055" height="84" rx="14"/></g>
<g fill="#236589"><rect x="72" y="166" width="12" height="84" rx="6"/><rect x="72" y="261" width="12" height="84" rx="6"/><rect x="72" y="356" width="12" height="84" rx="6"/><rect x="72" y="451" width="12" height="84" rx="6"/><rect x="72" y="546" width="12" height="84" rx="6"/></g>
<g fill="#173f5c" font-size="25" font-weight="700">
<text x="110" y="202">Казахстан</text><text x="110" y="297">Кыргызстан</text>
<text x="110" y="392">Узбекистан</text><text x="110" y="487">Таджикистан</text><text x="110" y="582">Туркменистан</text>
</g>
