<text x="520" y="203">17 196</text><text x="520" y="298">423</text>
<text x="520" y="393">Нет проверенного числа</text><text x="520" y="488">170</text>
<text x="520" y="583">Нет проверенного числа</text>
</g>
<g fill="#4c7086" font-size="18">
<text x="520" y="229">На учёте, 2026</text><text x="520" y="324">Зарегистрированные дети с аутизмом, 2024</text>
<text x="520" y="419">Общенациональные данные РАС не подтверждены</text><text x="520" y="514">Случаи регистрации суммарно за 2020-2025</text>
<text x="520" y="609">Общенациональные данные РАС не подтверждены</text>
</g>
<text x="75" y="664" fill="#466d83" font-size="16">Источник: Минздрав РК, ЦЭЗ Кыргызстана (через сообщения СМИ), исследование Таджикистана, поиск AutismHub на 15.10.2026.</text>
