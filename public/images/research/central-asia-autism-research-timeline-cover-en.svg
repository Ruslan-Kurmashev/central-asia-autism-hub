<title id="title">Selected milestones in Central Asian autism research, 2013-2026</title>
<desc id="desc">An illustrative AutismHub timeline, not a complete list of research. Highlights parent advocacy in 2013, robot interaction design in 2019, a regional review in 2024, family and registry studies in 2025, and registries in Kazakhstan and Tajikistan in 2026.</desc>
