<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Различные виды генетических факторов аутизма</title><desc id="d">Авторская учебная схема: множество распространённых генетических вариантов небольшого эффекта, редкие варианты относительно большого эффекта, новые de novo и наследованные варианты. Категории не исключают друг друга; схема не показывает медицинские риски в процентах.</desc><rect width="1200" height="720" rx="18" fill="#f1f7fb"/><text x="55" y="73" fill="#153b62" font-family="Arial,sans-serif" font-size="31" font-weight="700">Генетические варианты бывают разными</text><text x="55" y="106" fill="#516d82" font-family="Arial,sans-serif" font-size="19">Схема объясняет принципы, а не вероятность аутизма у отдельного человека</text><rect x="55" y="155" width="520" height="327" rx="18" fill="#fff" stroke="#aac7d9" stroke-width="2"/><rect x="625" y="155" width="520" height="327" rx="18" fill="#fff" stroke="#aac7d9" stroke-width="2"/><text x="83" y="207" fill="#17496d" font-family="Arial,sans-serif" font-size="24" font-weight="700">Распространённые варианты</text><text x="83" y="241" fill="#4a6780" font-family="Arial,sans-serif" font-size="19">Каждый обычно вносит небольшой</text><text x="83" y="267" fill="#4a6780" font-family="Arial,sans-serif" font-size="19">статистический вклад</text><g fill="#83b4d1"><circle cx="119" cy="340" r="12"/><circle cx="168" cy="356" r="12"/><circle cx="217" cy="330" r="12"/><circle cx="266" cy="353" r="12"/><circle cx="315" cy="333" r="12"/><circle cx="364" cy="352" r="12"/><circle cx="413" cy="332" r="12"/><circle cx="462" cy="356" r="12"/><circle cx="511" cy="337" r="12"/><circle cx="143" cy="404" r="12"/><circle cx="192" cy="425" r="12"/><circle cx="241" cy="393" r="12"/><circle cx="290" cy="415" r="12"/><circle cx="339" cy="397" r="12"/><circle cx="388" cy="420" r="12"/><circle cx="437" cy="399" r="12"/></g><text x="656" y="207" fill="#17496d" font-family="Arial,sans-serif" font-size="24" font-weight="700">Редкие варианты</text><text x="656" y="241" fill="#4a6780" font-family="Arial,sans-serif" font-size="19">Иногда оказывают более сильное</text><text x="656" y="267" fill="#4a6780" font-family="Arial,sans-serif" font-size="19">воздействие на работу гена</text><circle cx="881" cy="369" r="69" fill="#2d78aa" opacity=".17" stroke="#2d78aa" stroke-width="4"/><circle cx="881" cy="369" r="22" fill="#2d78aa"/><text x="881" y="460" text-anchor="middle" fill="#43627b" font-family="Arial,sans-serif" font-size="17">Не каждый такой вариант</text><rect x="55" y="527" width="1090" height="141" rx="18" fill="#e1eef8" stroke="#accadb" stroke-width="2"/><text x="87" y="575" fill="#17496d" font-family="Arial,sans-serif" font-size="23" font-weight="700">Как вариант появляется в семье?</text><text x="87" y="612" fill="#395d78" font-family="Arial,sans-serif" font-size="19">Он может быть унаследован или впервые возникнуть (de novo).</text><text x="87" y="640" fill="#395d78" font-family="Arial,sans-serif" font-size="19">Это другой признак классификации: он не заменяет деление на редкие и частые.</text></svg>