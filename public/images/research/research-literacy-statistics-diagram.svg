<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Точечная оценка и доверительный интервал</title><desc id="d">Две учебные точечные оценки с разными ширинами интервалов. Числа вымышленные и не относятся к реальному вмешательству.</desc><rect width="1200" height="500" fill="#edf5fa"/><path d="M150 410h900" stroke="#658da8" stroke-width="8"/><g fill="none" stroke="#d9a343" stroke-width="12" stroke-linecap="round"><path d="M310 211h575"/><path d="M480 333h246"/></g><g stroke="#3b83ae" stroke-width="10"><path d="M310 191v40m575-40v40M480 313v40m246-40v40"/></g><g fill="#2b75a8"><circle cx="580" cy="211" r="22"/><circle cx="604" cy="333" r="22"/></g><g fill="#255e83" font-family="DejaVu Sans,Arial,sans-serif" font-size="24"><text x="152" y="215">Шире</text><text x="152" y="337">Уже</text><text x="600" y="467" text-anchor="middle">Похожие оценки могут иметь разную точность</text></g></svg>