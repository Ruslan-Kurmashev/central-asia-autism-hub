<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title description">
<title id="title">Six areas where Central Asian autism research needs more evidence</title>
<desc id="description">Original AutismHub educational diagram, not a quantitative chart or ranking. Six topics: comparable data, autistic adulthood, local-language assessment, real-world support outcomes, community participation, and ethical research collaboration across countries.</desc>
