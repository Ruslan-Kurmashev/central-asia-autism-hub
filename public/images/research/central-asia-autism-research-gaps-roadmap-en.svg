<text x="88" y="422">Cultural adaptation and validation</text><text x="88" y="447">of assessment and research tools</text>
<text x="631" y="422">Participation and communication</text><text x="631" y="447">beyond a single session</text>
<text x="88" y="580">Autistic people and families</text><text x="88" y="605">help choose research questions</text>
