<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Какие виды технологий изучают для поддержки аутичных детей</title>
<desc id="desc">Авторская схема AutismHub без ранжирования эффективности. Четыре типа технологий: альтернативная коммуникация для выражения мыслей, вспомогательные технологии для участия в школьной жизни, социальные роботы для изучения взаимодействия, приложения и VR для отдельных учебных задач. Выбор должен начинаться с потребностей ребёнка, сопровождаться оценкой доступности и реальной пользы.</desc>
<rect width="1200" height="720" rx="24" fill="#f2f8fb"/><rect x="30" y="30" width="1140" height="660" rx="23" fill="#fff" stroke="#d2e3eb" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="67" y="94" font-size="32" font-weight="700" fill="#123e5d">Технологии поддержки: сначала цель, потом устройство</text>
<text x="67" y="137" font-size="20" fill="#52758a">Четыре направления исследований и практической разработки</text>
<g stroke-width="2" stroke="#bbd6e3" fill="#eaf4f8">
<rect x="65" y="182" width="512" height="169" rx="18"/><rect x="622" y="182" width="512" height="169" rx="18"/>
<rect x="65" y="369" width="512" height="169" rx="18"/><rect x="622" y="369" width="512" height="169" rx="18"/>
</g>
<g fill="#28698a"><circle cx="112" cy="229" r="25"/><circle cx="669" cy="229" r="25"/><circle cx="112" cy="415" r="25"/><circle cx="669" cy="415" r="25"/></g>
<g font-size="23" font-weight="700" text-anchor="middle" fill="#fff"><text x="112" y="237">01</text><text x="669" y="237">02</text><text x="112" y="423">03</text><text x="669" y="423">04</text></g>
<g font-size="24" fill="#174762" font-weight="700">
<text x="152" y="232">АДК и речевые устройства</text><text x="710" y="232">Технологии доступности</text>
<text x="152" y="417">Социальные роботы</text><text x="710" y="417">Приложения и VR</text>
</g>
<g font-size="19" fill="#416982">
<text x="94" y="277">Выражать просьбы, выбор,</text><text x="94" y="306">мысли и отказ.</text>
<text x="651" y="277">Получать доступ к заданиям</text><text x="651" y="306">и школьной жизни.</text>
<text x="94" y="462">Изучать игровые сценарии,</text><text x="94" y="491">вовлечённость, предпочтения.</text>
<text x="651" y="462">Поддерживать отдельные навыки,</text><text x="651" y="491">проверяя перенос в жизнь.</text>
</g>
<rect x="66" y="565" width="1068" height="90" rx="15" fill="#e0edf4"/>
<text x="90" y="600" font-size="23" font-weight="700" fill="#174864">Потребность ребёнка → подбор → доступность → проверка результата</text>
<text x="90" y="632" font-size="18" fill="#486e85">Схема не сравнивает эффективность технологий и не заменяет оценку специалиста.</text>
<text x="67" y="681" fill="#597c91" font-size="15">Оригинальная иллюстрация AutismHub. Научные источники и ограничения указаны в статье.</text>
</g></svg>