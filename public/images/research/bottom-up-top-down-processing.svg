<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="t d"><title id="t">Восходящая и нисходящая обработка сигналов</title><desc id="d">Объясняющая схема: сенсорные сигналы поступают к системам восприятия, далее участвуют в более сложной интерпретации. Обратные влияния внимания, опыта и контекста могут изменять обработку. Стрелки обозначают взаимодействия, не жёсткую последовательность для всех функций и не клиническую характеристику аутизма.</desc><rect width="1120" height="700" rx="20" fill="#f2f8fc"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#174467">Восприятие - не движение сигнала только в одну сторону</text><text x="50" y="101" font-family="Arial,sans-serif" font-size="18" fill="#4f6e86">Условная схема взаимного влияния данных и контекста</text><g font-family="Arial,sans-serif"><rect x="59" y="235" width="264" height="202" rx="18" fill="#e2edf8" stroke="#97b9d4" stroke-width="3"/><rect x="427" y="235" width="264" height="202" rx="18" fill="#fff" stroke="#97b9d4" stroke-width="3"/><rect x="795" y="235" width="264" height="202" rx="18" fill="#e1f2f6" stroke="#9bc7d3" stroke-width="3"/><g fill="#19476b" font-size="24" font-weight="700"><text x="84" y="284">Сигналы органов</text><text x="84" y="314">чувств</text><text x="452" y="284">Нервные системы</text><text x="452" y="314">обработки</text><text x="820" y="284">Контекст, опыт,</text><text x="820" y="314">внимание</text></g><g fill="#476b83" font-size="19"><text x="84" y="361">Звук, свет,</text><text x="84" y="388">прикосновение</text><text x="452" y="361">Сопоставление,</text><text x="452" y="388">интеграция сигналов</text><text x="820" y="361">Ожидания и</text><text x="820" y="388">текущие задачи</text></g></g><g stroke="#307ea9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M330 304 H415 l-17 -13 M415 304 l-17 13"/><path d="M787 304 H705 l17 -13 M705 304 l17 13"/><path d="M704 366 H788 l-17 -13 M788 366 l-17 13"/></g><text x="365" y="259" fill="#285a7c" font-family="Arial,sans-serif" font-size="18">восходящий</text><text x="710" y="258" fill="#285a7c" font-family="Arial,sans-serif" font-size="18">обратное влияние</text><rect x="59" y="488" width="1000" height="144" rx="16" fill="#dfeefa"/><text x="86" y="530" fill="#19466a" font-size="23" font-family="Arial,sans-serif" font-weight="700">Что важно помнить</text><text x="86" y="565" fill="#335d7b" font-size="19" font-family="Arial,sans-serif">Мозг обрабатывает сигналы параллельно в нескольких системах.</text><text x="86" y="595" fill="#335d7b" font-size="19" font-family="Arial,sans-serif">Схема не доказывает «дефицит предсказаний» у каждого аутичного человека.</text></svg>