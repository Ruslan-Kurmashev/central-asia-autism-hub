<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Как особенности развития становятся зарегистрированным диагнозом аутизма</title>
<desc id="desc">Объяснительная оригинальная схема. Слева направо четыре последовательных этапа: особенности развития замечены, семья обращается, проводится профессиональная оценка, установленный диагноз попадает в государственный реестр. Ни один этап не гарантирован автоматически. Схема не представляет реальных количественных данных.</desc>
<rect width="1200" height="675" fill="#f3f8fb"/>
<rect x="35" y="36" width="1130" height="599" rx="24" fill="#fff" stroke="#cfdfeb" stroke-width="2"/>
<text x="76" y="108" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#123b5b">Почему количество записей может расти</text>
<text x="76" y="153" font-family="Arial,sans-serif" font-size="21" fill="#476b83">Путь к зарегистрированному диагнозу включает несколько этапов</text>
<g font-family="Arial,sans-serif">
<rect x="72" y="237" width="240" height="166" rx="18" fill="#e7f1f6" stroke="#9cbfd2" stroke-width="3"/>
<rect x="345" y="237" width="240" height="166" rx="18" fill="#e7f1f6" stroke="#9cbfd2" stroke-width="3"/>
<rect x="618" y="237" width="240" height="166" rx="18" fill="#d5e7f0" stroke="#8fb8cc" stroke-width="3"/>
<rect x="891" y="237" width="237" height="166" rx="18" fill="#286889"/>
<g font-size="21" fill="#143c57" font-weight="700" text-anchor="middle">
<text x="192" y="295">Особенности</text><text x="192" y="322">замечены</text>
<text x="465" y="295">Обращение</text><text x="465" y="322">за оценкой</text>
<text x="738" y="295">Профессиональная</text><text x="738" y="322">диагностика</text>
</g>
<g font-size="21" fill="#fff" font-weight="700" text-anchor="middle"><text x="1009" y="295">Диагноз</text><text x="1009" y="322">зарегистрирован</text></g>
<g font-size="17" fill="#51738a" text-anchor="middle">
<text x="192" y="369">В семье или системе</text><text x="192" y="391">раннего выявления</text>
<text x="465" y="369">Доступ, направление,</text><text x="465" y="391">осведомлённость</text>
<text x="738" y="369">Критерии и</text><text x="738" y="391">специалисты</text>
</g>
<g font-size="17" fill="#e9f4f9" text-anchor="middle"><text x="1009" y="369">Учёт по действующим</text><text x="1009" y="391">правилам</text></g>
<g fill="none" stroke="#286889" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M318 319H336"/><path d="M330 310L339 319L330 328"/>
<path d="M591 319H609"/><path d="M603 310L612 319L603 328"/>
<path d="M864 319H882"/><path d="M876 310L885 319L876 328"/>
</g>
<rect x="74" y="465" width="1052" height="108" rx="14" fill="#f5f9fb" stroke="#dceaf0" stroke-width="2"/>
<text x="96" y="505" font-size="22" font-weight="700" fill="#174664">Если больше детей проходят эти этапы, записей становится больше.</text>
<text x="96" y="545" font-size="19" fill="#456c83">Это само по себе не доказывает рост истинной распространённости аутизма.</text>
<text x="77" y="612" font-size="16" fill="#57788e">Упрощённая учебная схема AutismHub, без числовой модели и клинической оценки.</text>
</g>
</svg>
