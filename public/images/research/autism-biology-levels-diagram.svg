<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title description">
<title id="title">Как биология может быть связана с аутизмом</title>
<desc id="description">Схема четырёх уровней научного объяснения: генетические особенности, развитие клеток мозга, нейронные сети, индивидуальный профиль. Факторы беременности и раннего развития, иммунные и метаболические процессы изучают дополнительно. Стрелки не доказывают единую причинную цепочку.</desc>
<rect width="1672" height="941" fill="#fbfcfd"/>
<rect x="66" y="34" width="14" height="92" fill="#617d93"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="119" y="75" font-size="52" font-weight="700" fill="#102034">Как биология может быть связана с аутизмом</text>
<text x="119" y="120" font-size="29" fill="#4d5765">Уровни научного объяснения, а не индивидуальный диагностический путь</text>
</g>
<line x1="65" y1="159" x2="1607" y2="159" stroke="#92a8b9" stroke-width="2"/>
<defs>
<clipPath id="b1"><rect x="59" y="209" width="350" height="290" rx="17"/></clipPath>
<clipPath id="b2"><rect x="461" y="209" width="340" height="290" rx="17"/></clipPath>
<clipPath id="b3"><rect x="852" y="209" width="341" height="290" rx="17"/></clipPath>
<clipPath id="b4"><rect x="1245" y="209" width="361" height="290" rx="17"/></clipPath>
</defs>
<g stroke="#9aaebf" stroke-width="1.6" fill="#fff">
<rect x="59" y="209" width="350" height="290" rx="17"/>
<rect x="461" y="209" width="340" height="290" rx="17"/>
<rect x="852" y="209" width="341" height="290" rx="17"/>
<rect x="1245" y="209" width="361" height="290" rx="17"/>
</g>
<g fill="#e7edf2">
<rect x="59" y="209" width="350" height="124" clip-path="url(#b1)"/>
<rect x="461" y="209" width="340" height="124" clip-path="url(#b2)"/>
<rect x="852" y="209" width="341" height="124" clip-path="url(#b3)"/>
<rect x="1245" y="209" width="361" height="124" clip-path="url(#b4)"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" fill="#112238">
<g font-weight="700" font-size="33">
<text x="92" y="267">Генетические</text><text x="92" y="306">особенности</text>
<text x="496" y="267">Развитие</text><text x="496" y="306">клеток мозга</text>
<text x="886" y="267">Нейронные</text><text x="886" y="306">сети</text>
<text x="1279" y="267">Индивидуальный</text><text x="1279" y="306">профиль</text>
</g>
<g font-size="28" fill="#25323f">
<text x="93" y="380">Редкие и частые</text><text x="93" y="418">варианты ДНК,</text><text x="93" y="456">регуляция генов</text>
<text x="496" y="380">Образование,</text><text x="496" y="418">созревание и связи</text><text x="496" y="456">между клетками</text>
<text x="886" y="380">Обработка сигналов,</text><text x="886" y="418">работа связей,</text><text x="886" y="456">развитие функций</text>
<text x="1279" y="380">Общение, сенсорика,</text><text x="1279" y="418">интересы, обучение,</text><text x="1279" y="456">разнообразие</text>
</g>
</g>
<g stroke="#627f95" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M418 358 H447 M438 347 L449 358 L438 369"/>
<path d="M810 358 H839 M830 347 L841 358 L830 369"/>
<path d="M1203 358 H1232 M1223 347 L1234 358 L1223 369"/>
</g>
<path d="M827 511 V553" fill="none" stroke="#8ca2b3" stroke-width="2" stroke-dasharray="7 9"/>
<rect x="53" y="554" width="1542" height="170" rx="16" fill="#fff" stroke="#a8b9c7" stroke-width="1.7"/>
<rect x="86" y="581" width="8" height="112" fill="#859caf"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="135" y="608" font-size="36" font-weight="700" fill="#17283b">Что ещё изучают</text>
<g font-size="28" fill="#25323f">
<text x="135" y="657">Факторы беременности и раннего развития, иммунные и метаболические процессы,</text>
<text x="135" y="694">а также их взаимодействие с генетическими особенностями.</text>
</g>
</g>
<rect x="53" y="768" width="1542" height="109" rx="16" fill="#e7edf2"/>
<g font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#1c2937">
<text x="94" y="812"><tspan font-weight="700">Важно:</tspan><tspan> стрелки показывают общую исследовательскую логику, но не доказывают,</tspan></text>
<text x="94" y="851">что у любого конкретного человека аутизм возникает по этой схеме.</text>
</g>
</svg>
