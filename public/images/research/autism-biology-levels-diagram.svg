<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title description">
<title id="title">От биологических факторов к наблюдаемым особенностям</title>
<desc id="description">Образовательная карта уровней: генетические варианты и их регуляция, развитие нервных клеток, нейронные сети, индивидуальные особенности. Средовые факторы изучаются отдельно; стрелки не означают доказанную цепь для каждого человека.</desc>
<rect width="1200" height="710" rx="20" fill="#f2f8fc"/>
<text x="64" y="73" fill="#0b315f" font-family="Arial,sans-serif" font-size="32" font-weight="700">Как биология может быть связана с аутизмом</text>
<text x="64" y="112" fill="#50708b" font-family="Arial,sans-serif" font-size="19">Уровни научного объяснения, а не индивидуальный диагностический путь</text>
<g font-family="Arial,sans-serif">
 <rect x="54" y="176" width="256" height="222" rx="18" fill="#e1ecf8" stroke="#85afd3" stroke-width="2"/>
 <rect x="342" y="176" width="256" height="222" rx="18" fill="#e7f3f5" stroke="#9cbfc7" stroke-width="2"/>
 <rect x="630" y="176" width="256" height="222" rx="18" fill="#e9f0fb" stroke="#9bb1d3" stroke-width="2"/>
 <rect x="918" y="176" width="226" height="222" rx="18" fill="#f6f3e8" stroke="#d1c4a0" stroke-width="2"/>
 <g font-size="21" font-weight="700" fill="#153d65">
  <text x="77" y="229">Генетические</text><text x="77" y="260">особенности</text>
  <text x="365" y="229">Развитие</text><text x="365" y="260">клеток мозга</text>
  <text x="653" y="229">Нейронные</text><text x="653" y="260">сети</text>
  <text x="941" y="229">Индивидуальный</text><text x="941" y="260">профиль</text>
 </g>
 <g font-size="16" fill="#405b72">
  <text x="77" y="303">Редкие и частые</text><text x="77" y="329">варианты ДНК;</text><text x="77" y="355">регуляция генов</text>
  <text x="365" y="303">Образование,</text><text x="365" y="329">созревание и связи</text><text x="365" y="355">между клетками</text>
  <text x="653" y="303">Обработка сигналов,</text><text x="653" y="329">работа связей,</text><text x="653" y="355">развитие функций</text>
  <text x="941" y="303">Общение, сенсорика,</text><text x="941" y="329">интересы, обучение;</text><text x="941" y="355">разнообразие</text>
 </g>
</g>
<g stroke="#3578ab" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
 <path d="M314 287 H331 l-9 -8 M331 287 l-9 8"/>
 <path d="M602 287 H619 l-9 -8 M619 287 l-9 8"/>
 <path d="M890 287 H907 l-9 -8 M907 287 l-9 8"/>
</g>
<rect x="54" y="443" width="1090" height="118" rx="16" fill="#fff" stroke="#cbdde9" stroke-width="2"/>
<rect x="76" y="466" width="5" height="71" rx="2" fill="#75a6c5"/>
<text x="105" y="484" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#194d73">Что ещё изучают</text>
<text x="105" y="518" font-family="Arial,sans-serif" font-size="18" fill="#395c77">Факторы беременности и раннего развития, иммунные и метаболические процессы,</text>
<text x="105" y="543" font-family="Arial,sans-serif" font-size="18" fill="#395c77">а также их взаимодействие с генетическими особенностями.</text>
<path d="M607 442 V412" stroke="#81abc8" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="54" y="599" width="1090" height="67" rx="12" fill="#dcecf7"/>
<text x="76" y="627" fill="#174c75" font-family="Arial,sans-serif" font-size="17" font-weight="700">Важно:</text>
<text x="163" y="627" fill="#174c75" font-family="Arial,sans-serif" font-size="17">стрелки показывают общую исследовательскую логику, но не доказывают,</text>
<text x="76" y="650" fill="#174c75" font-family="Arial,sans-serif" font-size="17">что у любого конкретного человека аутизм возникает по этой схеме.</text>
</svg>