<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Иммунная система мозга и микроглия</title><desc id="d">Авторская условная иллюстрация синей клетки микроглии с разветвлёнными отростками, соседствующей с нейронными связями. Это не микроскопический препарат, не данные исследования и не универсальное изменение при аутизме.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eaf5fb"/><stop offset="1" stop-color="#d4e9f6"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><g fill="none" stroke="#6d9fbe" stroke-width="7" opacity=".75" stroke-linecap="round"><path d="M672 161 L774 240 L901 182 L1082 270 M774 240 L831 401 L1040 464 M901 182 L946 342 L1082 270 M831 401 L693 492 M946 342 L1040 464"/></g><g fill="#79aed1" stroke="#fff" stroke-width="5"><circle cx="672" cy="161" r="23"/><circle cx="774" cy="240" r="24"/><circle cx="901" cy="182" r="24"/><circle cx="1082" cy="270" r="23"/><circle cx="831" cy="401" r="25"/><circle cx="1040" cy="464" r="22"/><circle cx="946" cy="342" r="22"/><circle cx="693" cy="492" r="21"/></g><g fill="none" stroke="#2d7baa" stroke-width="12" stroke-linecap="round"><path d="M850 314 L752 326 L690 283 M750 326 L700 390 L660 401 M850 314 L894 235 L867 176 M894 235 L951 220 L996 173 M850 314 L932 376 L1039 358 M932 376 L946 442 L1007 492 M850 314 L830 445 L791 514"/></g><circle cx="850" cy="314" r="55" fill="#287baa" stroke="#fff" stroke-width="8"/><circle cx="850" cy="314" r="20" fill="#bfe0f1"/><rect x="47" y="42" width="659" height="126" rx="17" fill="#fff" opacity=".94"/><text x="72" y="88" fill="#174b71" font-family="Arial,sans-serif" font-size="31" font-weight="700">Микроглия и развитие мозга</text><text x="72" y="126" fill="#55758e" font-family="Arial,sans-serif" font-size="19">Иммунная защита, синапсы и границы научных выводов</text><rect x="47" y="508" width="611" height="63" rx="14" fill="#fff" opacity=".84"/><text x="69" y="548" fill="#2d