<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Нейроны и синапсы: схема связи нервных клеток</title><desc id="d">Авторская векторная научная иллюстрация: два условных нейрона, связанные отростками, и увеличенный участок между ними с круглыми частицами, обозначающими нейромедиаторы. Не микрофотография, не результат изучения мозга аутичного человека и не диагностическая модель.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf5fb"/><stop offset="1" stop-color="#d7ebf8"/></linearGradient></defs><rect width="1200" height="630" fill="url(#b)"/><g stroke="#2a729f" stroke-width="7" stroke-linecap="round" fill="none"><path d="M224 345 L307 297 L378 295 L462 325 M224 345 L286 391 L343 467 M224 345 L179 268 L115 249 M224 345 L144 387 L83 437"/><path d="M957 329 L1012 275 L1078 241 M957 329 L1046 335 L1124 379 M957 329 L1008 410 L1052 462 M957 329 L889 327 L815 328"/></g><path d="M479 327 Q545 315 604 327" stroke="#2a729f" stroke-width="17" stroke-linecap="round" fill="none"/><path d="M725 327 H812" stroke="#2a729f" stroke-width="17" stroke-linecap="round"/><g fill="#2b7aaf" stroke="#fff" stroke-width="8"><circle cx="224" cy="345" r="58"/><circle cx="957" cy="329" r="65"/></g><g fill="#b4def4"><circle cx="224" cy="345" r="20"/><circle cx="957" cy="329" r="23"/></g><path d="M603 295 L634 295 L634 360 L603 360" fill="#418ebd" opacity=".48"/><path d="M727 295 L698 295 L698 360 L727 360" fill="#418ebd" opacity=".48"/><g fill="#337fae"><circle cx="652" cy="311" r="7"/><circle cx="670" cy="343" r="8"/><circle cx="684" cy="316" r="7"/><circle cx="658" cy="356" r="6"/></g><path d="M612 408 Q665 455 721 407" stroke="#618bad" stroke-width="2" stroke-dasharray="8 8" fill="none"/><g font-family="Arial,sans-serif"><rect x="56" y="35" width="658" height="86" rx="12" fill="#fff" opacity=".93"/><text x="78" y="77" font-size="31" font-weight="700" fill="#1c4c71">Как взаимодействуют нервные клетки</text><text x="78" y="103" font-size="17" fill="#54728b">Нейроны, сигнал и синапс: учебная схема</text><text x="668" y="484" font-size="21" text-anchor="middle" fill="#235875">Синапс</text></g></svg>