<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Микробиом кишечника и аутизм: что известно науке</title><desc id="d">Оригинальная концептуальная векторная иллюстрация кишечника с условными точками микроорганизмов и соединёнными окружностями, обозначающими исследуемую коммуникацию организма. Не медицинский снимок, не конкретные микробы, не причинная модель и не диагностический признак аутизма.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8fc"/><stop offset="1" stop-color="#d9ebf7"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><path d="M860 131 C785 111 741 153 741 235 L741 389 C741 455 784 503 865 507 C951 508 997 461 997 390 L997 244 C997 183 951 158 898 179 L897 411 C897 461 853 460 849 420 L849 239 C849 211 873 209 882 226" fill="none" stroke="#508fb9" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><path d="M808 234 L808 396 C810 441 848 473 900 463 L927 450" stroke="#8ebfdc" stroke-width="14" fill="none" stroke-linecap="round"/><g fill="#2d7da9"><circle cx="779" cy="218" r="11"/><circle cx="954" cy="258" r="9"/><circle cx="805" cy="340" r="10"/><circle cx="945" cy="391" r="10"/><circle cx="841" cy="485" r="9"/><circle cx="887" cy="278" r="7"/><circle cx="889" cy="366" r="9"/></g><g fill="none" stroke="#9cbcd0" stroke-width="5" stroke-dasharray="12 12"><path d="M996 231 Q1090 196 1088 128"/><path d="M997 370 Q1111 389 1091 485"/></g><g fill="#2c7da9"><circle cx="1088" cy="128" r="27"/><circle cx="1091" cy="485" r="27"/></g><rect x="46" y="42" width="689" height="128" rx="14" fill="#fff" opacity=".94"/><text x="72" y="90" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#1b4b70">Микробиом кишечника и аутизм</text><text x="72" y="127" font-family="Arial,sans-serif" font-size="19" fill="#57778f">Находки, причинность и ограничения лечения</text><rect x="46" y="512" width="679" height="65" rx="14" fill="#fff" opacity=".86"/><text x="72" y="553" font-family="Arial,sans-serif" font-size="18" fill="#2e6181">Схема носит образовательный, не диагностический характер</text></svg>