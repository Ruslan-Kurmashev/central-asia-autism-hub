<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1535" width="1800" height="1535" lang="ru" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Как изучают сенсорные реакции</title>
<desc id="figure-desc">Научная модель на примере повышенной реакции на звук. Примеры не являются диагнозом или универсальными результатами.. Адаптация Figure 1: Schauder и Bennetto (2016) · CC BY 4.0</desc>
<rect width="1800" height="1535" fill="#FFFFFF"/>
<text x="55" y="91" fill="#103553" font-family="Arial, DejaVu Sans, sans-serif" font-size="53" font-weight="700"><tspan x="55" dy="0">Как изучают сенсорные реакции</tspan></text>
<text x="55" y="155" fill="#3F596B" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400"><tspan x="55" dy="0">Научная модель на примере повышенной реакции на звук</tspan></text>
<rect x="50" y="230" width="1700" height="1226" fill="none" stroke="#B8C7D0" stroke-width="2"/>
<rect x="50" y="230" width="1700" height="86" fill="#133956"/>
<text x="74" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="74" dy="0">Уровень анализа</tspan></text>
<text x="494" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="494" dy="0">Пример метода</tspan></text>
<text x="1094" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="1094" dy="0">Пример возможного результата</tspan></text>
<rect x="51" y="316" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="316" x2="1750" y2="316" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="419" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Клиническое проявление</tspan></text>
<text x="494" y="380" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Анкета родителей или интервью</tspan><tspan x="494" dy="39">о влиянии ощущений</tspan><tspan x="494" dy="39">на повседневную жизнь</tspan></text>
<text x="1094" y="380" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Обычный шум мешает ребёнку</tspan><tspan x="1094" dy="39">взаимодействовать</tspan><tspan x="1094" dy="39">с другими людьми</tspan></text>
<rect x="51" y="506" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="506" x2="1750" y2="506" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="609" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Наблюдаемая реакция</tspan></text>
<text x="494" y="609" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Наблюдение за поведением</tspan></text>
<text x="1094" y="570" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Ребёнок закрывает уши</tspan><tspan x="1094" dy="39">при обычных звуках,</tspan><tspan x="1094" dy="39">например при работе блендера</tspan></text>
<rect x="51" y="696" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="696" x2="1750" y2="696" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="799" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Физиологическая реакция</tspan></text>
<text x="494" y="779.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Измерение вегетативных реакций:</tspan><tspan x="494" dy="39">пульс и проводимость кожи</tspan></text>
<text x="1094" y="779.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Учащение пульса</tspan><tspan x="1094" dy="39">при звуке обычной громкости</tspan></text>
<rect x="51" y="886" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="886" x2="1750" y2="886" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="989" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Восприятие</tspan></text>
<text x="494" y="950" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Психофизический тест:</tspan><tspan x="494" dy="39">обнаружение или различение</tspan><tspan x="494" dy="39">звуковых сигналов</tspan></text>
<text x="1094" y="969.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Более низкий порог</tspan><tspan x="1094" dy="39">обнаружения звука</tspan></text>
<rect x="51" y="1076" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="1076" x2="1750" y2="1076" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="1160" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Функциональный ответ</tspan><tspan x="74" dy="39">мозга</tspan></text>
<text x="494" y="1179" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Функциональная МРТ (фМРТ)</tspan></text>
<text x="1094" y="1140" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Более выраженный ответ</tspan><tspan x="1094" dy="39">в мозговых сетях</tspan><tspan x="1094" dy="39">обработки звука</tspan></text>
<rect x="51" y="1266" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="1266" x2="1750" y2="1266" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="1369" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Структура мозга</tspan></text>
<text x="494" y="1349.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Структурная МРТ:</tspan><tspan x="494" dy="39">объём и связи областей мозга</tspan></text>
<text x="1094" y="1330" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Более высокая связность</tspan><tspan x="1094" dy="39">между областями</tspan><tspan x="1094" dy="39">слуховой обработки</tspan></text>
<line x1="470" y1="230" x2="470" y2="1456" stroke="#BCCBD4" stroke-width="2"/>
<line x1="1070" y1="230" x2="1070" y2="1456" stroke="#BCCBD4" stroke-width="2"/>
<text x="54" y="1495" fill="#475D6A" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400"><tspan x="54" dy="0">Адаптация Figure 1: Schauder и Bennetto (2016) · CC BY 4.0</tspan></text>
</svg>
