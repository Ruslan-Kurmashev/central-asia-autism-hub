<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1535" width="1800" height="1535" lang="kk" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Сенсорлық реакцияларды зерттеу</title>
<desc id="figure-desc">Дыбысқа жоғары жауап беру мысалындағы ғылыми модель. Мысалдар диагнозды немесе барлығына ортақ нәтижені білдірмейді.. Figure 1 негізіндегі аударма: Schauder және Bennetto (2016) · CC BY 4.0</desc>
<rect width="1800" height="1535" fill="#FFFFFF"/>
<text x="55" y="91" fill="#103553" font-family="Arial, DejaVu Sans, sans-serif" font-size="53" font-weight="700"><tspan x="55" dy="0">Сенсорлық реакцияларды зерттеу</tspan></text>
<text x="55" y="155" fill="#3F596B" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400"><tspan x="55" dy="0">Дыбысқа жоғары жауап беру мысалындағы ғылыми модель</tspan></text>
<rect x="50" y="230" width="1700" height="1226" fill="none" stroke="#B8C7D0" stroke-width="2"/>
<rect x="50" y="230" width="1700" height="86" fill="#133956"/>
<text x="74" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="74" dy="0">Талдау деңгейі</tspan></text>
<text x="494" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="494" dy="0">Зерттеу әдісінің мысалы</tspan></text>
<text x="1094" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="1094" dy="0">Ықтимал нәтиженің мысалы</tspan></text>
<rect x="51" y="316" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="316" x2="1750" y2="316" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="419" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Клиникалық көрініс</tspan></text>
<text x="494" y="380" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Ата-ана сауалнамасы</tspan><tspan x="494" dy="39">немесе сенсорлық әсердің</tspan><tspan x="494" dy="39">күнделікті өмірге ықпалы туралы сұхбат</tspan></text>
<text x="1094" y="380" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Күнделікті шу баланың</tspan><tspan x="1094" dy="39">басқалармен қарым-қатынас</tspan><tspan x="1094" dy="39">жасауына кедергі келтіреді</tspan></text>
<rect x="51" y="506" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="506" x2="1750" y2="506" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="609" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Бақыланатын реакция</tspan></text>
<text x="494" y="609" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Мінез-құлықты бақылау</tspan></text>
<text x="1094" y="570" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Бала блендер сияқты</tspan><tspan x="1094" dy="39">әдеттегі дыбыстарды естігенде</tspan><tspan x="1094" dy="39">құлағын жабады</tspan></text>
<rect x="51" y="696" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="696" x2="1750" y2="696" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="799" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Физиологиялық жауап</tspan></text>
<text x="494" y="779.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Вегетативтік реакцияларды өлшеу:</tspan><tspan x="494" dy="39">жүрек соғуы, тері өткізгіштігі</tspan></text>
<text x="1094" y="779.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Әдеттегі дыбыс деңгейінде</tspan><tspan x="1094" dy="39">жүрек соғу жиілігі артады</tspan></text>
<rect x="51" y="886" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="886" x2="1750" y2="886" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="989" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Қабылдау</tspan></text>
<text x="494" y="969.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Психофизикалық тапсырма:</tspan><tspan x="494" dy="39">дыбысты анықтау немесе ажырату</tspan></text>
<text x="1094" y="969.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Дыбысты анықтау шегі</tspan><tspan x="1094" dy="39">төменірек болуы мүмкін</tspan></text>
<rect x="51" y="1076" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="1076" x2="1750" y2="1076" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="1179" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Мидың функционалдық жауабы</tspan></text>
<text x="494" y="1179" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Функционалдық МРТ (фМРТ)</tspan></text>
<text x="1094" y="1140" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Есту ақпаратын өңдейтін</tspan><tspan x="1094" dy="39">ми желілерінің жауабы</tspan><tspan x="1094" dy="39">күштірек болуы мүмкін</tspan></text>
<rect x="51" y="1266" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="1266" x2="1750" y2="1266" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="1369" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Ми құрылымы</tspan></text>
<text x="494" y="1349.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Құрылымдық МРТ:</tspan><tspan x="494" dy="39">ми аймақтарының көлемі мен байланысы</tspan></text>
<text x="1094" y="1330" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Есту аймақтары арасындағы</tspan><tspan x="1094" dy="39">байланыстылық жоғарырақ</tspan><tspan x="1094" dy="39">болуы мүмкін</tspan></text>
<line x1="470" y1="230" x2="470" y2="1456" stroke="#BCCBD4" stroke-width="2"/>
<line x1="1070" y1="230" x2="1070" y2="1456" stroke="#BCCBD4" stroke-width="2"/>
<text x="54" y="1495" fill="#475D6A" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400"><tspan x="54" dy="0">Figure 1 негізіндегі аударма: Schauder және Bennetto (2016) · CC BY 4.0</tspan></text>
</svg>
