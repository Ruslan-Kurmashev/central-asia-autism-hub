<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1535" width="1800" height="1535" lang="en" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">How sensory responses are studied</title>
<desc id="figure-desc">A scientific model using auditory hyper-responsiveness. Illustrative findings, not diagnostic criteria or universal results.. Adapted and translated from Figure 1: Schauder &amp; Bennetto (2016) · CC BY 4.0</desc>
<rect width="1800" height="1535" fill="#FFFFFF"/>
<text x="55" y="91" fill="#103553" font-family="Arial, DejaVu Sans, sans-serif" font-size="53" font-weight="700"><tspan x="55" dy="0">How sensory responses are studied</tspan></text>
<text x="55" y="155" fill="#3F596B" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400"><tspan x="55" dy="0">A scientific model using auditory hyper-responsiveness</tspan></text>
<rect x="50" y="230" width="1700" height="1226" fill="none" stroke="#B8C7D0" stroke-width="2"/>
<rect x="50" y="230" width="1700" height="86" fill="#133956"/>
<text x="74" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="74" dy="0">Level of analysis</tspan></text>
<text x="494" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="494" dy="0">Example research method</tspan></text>
<text x="1094" y="285" fill="#FFFFFF" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700"><tspan x="1094" dy="0">Example possible finding</tspan></text>
<rect x="51" y="316" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="316" x2="1750" y2="316" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="419" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Clinical symptom</tspan></text>
<text x="494" y="380" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Parent report or interview</tspan><tspan x="494" dy="39">on interference with</tspan><tspan x="494" dy="39">everyday functioning</tspan></text>
<text x="1094" y="380" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Everyday noise interferes</tspan><tspan x="1094" dy="39">with a child's ability</tspan><tspan x="1094" dy="39">to interact socially</tspan></text>
<rect x="51" y="506" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="506" x2="1750" y2="506" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="609" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Observable reaction</tspan></text>
<text x="494" y="609" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Behavioural observation</tspan></text>
<text x="1094" y="570" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Child covers their ears</tspan><tspan x="1094" dy="39">during everyday noise,</tspan><tspan x="1094" dy="39">such as a blender</tspan></text>
<rect x="51" y="696" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="696" x2="1750" y2="696" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="799" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Physiological response</tspan></text>
<text x="494" y="779.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Autonomic measures:</tspan><tspan x="494" dy="39">heart rate and skin conductance</tspan></text>
<text x="1094" y="779.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Increased heart rate</tspan><tspan x="1094" dy="39">at ordinary sound volume</tspan></text>
<rect x="51" y="886" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="886" x2="1750" y2="886" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="989" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Perception</tspan></text>
<text x="494" y="969.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Psychophysical detection</tspan><tspan x="494" dy="39">or discrimination task</tspan></text>
<text x="1094" y="969.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Lower auditory</tspan><tspan x="1094" dy="39">detection threshold</tspan></text>
<rect x="51" y="1076" width="1698" height="190" fill="#F5F9FB"/>
<line x1="50" y1="1076" x2="1750" y2="1076" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="1179" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Functional brain response</tspan></text>
<text x="494" y="1179" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Functional MRI (fMRI)</tspan></text>
<text x="1094" y="1159.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Greater neural response</tspan><tspan x="1094" dy="39">in auditory processing networks</tspan></text>
<rect x="51" y="1266" width="1698" height="190" fill="#FFFFFF"/>
<line x1="50" y1="1266" x2="1750" y2="1266" stroke="#C6D2DB" stroke-width="2"/>
<text x="74" y="1369" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700"><tspan x="74" dy="0">Brain structure</tspan></text>
<text x="494" y="1349.5" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="494" dy="0">Structural MRI:</tspan><tspan x="494" dy="39">regional volume and connectivity</tspan></text>
<text x="1094" y="1330" fill="#1F394A" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400"><tspan x="1094" dy="0">Greater connectivity</tspan><tspan x="1094" dy="39">between auditory</tspan><tspan x="1094" dy="39">processing regions</tspan></text>
<line x1="470" y1="230" x2="470" y2="1456" stroke="#BCCBD4" stroke-width="2"/>
<line x1="1070" y1="230" x2="1070" y2="1456" stroke="#BCCBD4" stroke-width="2"/>
<text x="54" y="1495" fill="#475D6A" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400"><tspan x="54" dy="0">Adapted and translated from Figure 1: Schauder &amp; Bennetto (2016) · CC BY 4.0</tspan></text>
</svg>
