<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 3200" width="720" height="3200" lang="en" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">How sensory responses are studied</title>
<desc id="figure-desc">A scientific model using auditory hyper-responsiveness. Illustrative findings, not diagnostic criteria or universal results.. Adapted and translated from Figure 1: Schauder &amp; Bennetto (2016) · CC BY 4.0</desc>
<rect width="720" height="3200" fill="#FFFFFF"/>
<text x="28" y="67" fill="#103553" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700"><tspan x="28" dy="0">How sensory responses are</tspan><tspan x="28" dy="43">studied</tspan></text>
<text x="28" y="156" fill="#3F596B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400"><tspan x="28" dy="0">A scientific model using auditory</tspan><tspan x="28" dy="32">hyper-responsiveness</tspan></text>
<rect x="18" y="202" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="257" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Clinical symptom</tspan></text>
<text x="38" y="338" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">RESEARCH METHOD</tspan></text>
<text x="38" y="381" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Parent report or interview</tspan><tspan x="38" dy="35">on interference with</tspan><tspan x="38" dy="35">everyday functioning</tspan></text>
<text x="38" y="510" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">POSSIBLE FINDING</tspan></text>
<text x="38" y="553" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Everyday noise interferes</tspan><tspan x="38" dy="35">with a child's ability</tspan><tspan x="38" dy="35">to interact socially</tspan></text>
<rect x="18" y="678" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="733" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Observable reaction</tspan></text>
<text x="38" y="814" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">RESEARCH METHOD</tspan></text>
<text x="38" y="857" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Behavioural observation</tspan></text>
<text x="38" y="986" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">POSSIBLE FINDING</tspan></text>
<text x="38" y="1029" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Child covers their ears</tspan><tspan x="38" dy="35">during everyday noise,</tspan><tspan x="38" dy="35">such as a blender</tspan></text>
<rect x="18" y="1154" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="1209" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Physiological response</tspan></text>
<text x="38" y="1290" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">RESEARCH METHOD</tspan></text>
<text x="38" y="1333" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Autonomic measures:</tspan><tspan x="38" dy="35">heart rate and skin conductance</tspan></text>
<text x="38" y="1462" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">POSSIBLE FINDING</tspan></text>
<text x="38" y="1505" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Increased heart rate</tspan><tspan x="38" dy="35">at ordinary sound volume</tspan></text>
<rect x="18" y="1630" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="1685" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Perception</tspan></text>
<text x="38" y="1766" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">RESEARCH METHOD</tspan></text>
<text x="38" y="1809" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Psychophysical detection</tspan><tspan x="38" dy="35">or discrimination task</tspan></text>
<text x="38" y="1938" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">POSSIBLE FINDING</tspan></text>
<text x="38" y="1981" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Lower auditory</tspan><tspan x="38" dy="35">detection threshold</tspan></text>
<rect x="18" y="2106" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="2161" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Functional brain response</tspan></text>
<text x="38" y="2242" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">RESEARCH METHOD</tspan></text>
<text x="38" y="2285" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Functional MRI (fMRI)</tspan></text>
<text x="38" y="2414" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">POSSIBLE FINDING</tspan></text>
<text x="38" y="2457" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Greater neural response</tspan><tspan x="38" dy="35">in auditory processing networks</tspan></text>
<rect x="18" y="2582" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="2637" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Brain structure</tspan></text>
<text x="38" y="2718" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">RESEARCH METHOD</tspan></text>
<text x="38" y="2761" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Structural MRI:</tspan><tspan x="38" dy="35">regional volume and connectivity</tspan></text>
<text x="38" y="2890" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">POSSIBLE FINDING</tspan></text>
<text x="38" y="2933" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Greater connectivity</tspan><tspan x="38" dy="35">between auditory</tspan><tspan x="38" dy="35">processing regions</tspan></text>
<text x="24" y="3110" fill="#455E6F" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400"><tspan x="24" dy="0">Adapted and translated from Figure 1: Schauder</tspan><tspan x="24" dy="30">&amp; Bennetto (2016) · CC BY 4.0</tspan></text>
</svg>
