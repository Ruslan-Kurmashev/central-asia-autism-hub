<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 3200" width="720" height="3200" lang="kk" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Сенсорлық реакцияларды зерттеу</title>
<desc id="figure-desc">Дыбысқа жоғары жауап беру мысалындағы ғылыми модель. Мысалдар диагнозды немесе барлығына ортақ нәтижені білдірмейді.. Figure 1 негізіндегі аударма: Schauder және Bennetto (2016) · CC BY 4.0</desc>
<rect width="720" height="3200" fill="#FFFFFF"/>
<text x="28" y="67" fill="#103553" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700"><tspan x="28" dy="0">Сенсорлық реакцияларды зерттеу</tspan></text>
<text x="28" y="121" fill="#3F596B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400"><tspan x="28" dy="0">Дыбысқа жоғары жауап беру мысалындағы ғылыми</tspan><tspan x="28" dy="32">модель</tspan></text>
<rect x="18" y="202" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="257" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Клиникалық көрініс</tspan></text>
<text x="38" y="338" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЗЕРТТЕУ ӘДІСІ</tspan></text>
<text x="38" y="381" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Ата-ана сауалнамасы</tspan><tspan x="38" dy="35">немесе сенсорлық әсердің</tspan><tspan x="38" dy="35">күнделікті өмірге ықпалы туралы сұхбат</tspan></text>
<text x="38" y="510" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЫҚТИМАЛ НӘТИЖЕ</tspan></text>
<text x="38" y="553" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Күнделікті шу баланың</tspan><tspan x="38" dy="35">басқалармен қарым-қатынас</tspan><tspan x="38" dy="35">жасауына кедергі келтіреді</tspan></text>
<rect x="18" y="678" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="733" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Бақыланатын реакция</tspan></text>
<text x="38" y="814" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЗЕРТТЕУ ӘДІСІ</tspan></text>
<text x="38" y="857" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Мінез-құлықты бақылау</tspan></text>
<text x="38" y="986" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЫҚТИМАЛ НӘТИЖЕ</tspan></text>
<text x="38" y="1029" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Бала блендер сияқты</tspan><tspan x="38" dy="35">әдеттегі дыбыстарды естігенде</tspan><tspan x="38" dy="35">құлағын жабады</tspan></text>
<rect x="18" y="1154" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="1209" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Физиологиялық жауап</tspan></text>
<text x="38" y="1290" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЗЕРТТЕУ ӘДІСІ</tspan></text>
<text x="38" y="1333" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Вегетативтік реакцияларды өлшеу:</tspan><tspan x="38" dy="35">жүрек соғуы, тері өткізгіштігі</tspan></text>
<text x="38" y="1462" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЫҚТИМАЛ НӘТИЖЕ</tspan></text>
<text x="38" y="1505" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Әдеттегі дыбыс деңгейінде</tspan><tspan x="38" dy="35">жүрек соғу жиілігі артады</tspan></text>
<rect x="18" y="1630" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="1685" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Қабылдау</tspan></text>
<text x="38" y="1766" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЗЕРТТЕУ ӘДІСІ</tspan></text>
<text x="38" y="1809" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Психофизикалық тапсырма:</tspan><tspan x="38" dy="35">дыбысты анықтау немесе ажырату</tspan></text>
<text x="38" y="1938" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЫҚТИМАЛ НӘТИЖЕ</tspan></text>
<text x="38" y="1981" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Дыбысты анықтау шегі</tspan><tspan x="38" dy="35">төменірек болуы мүмкін</tspan></text>
<rect x="18" y="2106" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="2161" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Мидың функционалдық жауабы</tspan></text>
<text x="38" y="2242" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЗЕРТТЕУ ӘДІСІ</tspan></text>
<text x="38" y="2285" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Функционалдық МРТ (фМРТ)</tspan></text>
<text x="38" y="2414" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЫҚТИМАЛ НӘТИЖЕ</tspan></text>
<text x="38" y="2457" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Есту ақпаратын өңдейтін</tspan><tspan x="38" dy="35">ми желілерінің жауабы</tspan><tspan x="38" dy="35">күштірек болуы мүмкін</tspan></text>
<rect x="18" y="2582" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="2637" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Ми құрылымы</tspan></text>
<text x="38" y="2718" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЗЕРТТЕУ ӘДІСІ</tspan></text>
<text x="38" y="2761" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Құрылымдық МРТ:</tspan><tspan x="38" dy="35">ми аймақтарының көлемі мен байланысы</tspan></text>
<text x="38" y="2890" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ЫҚТИМАЛ НӘТИЖЕ</tspan></text>
<text x="38" y="2933" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Есту аймақтары арасындағы</tspan><tspan x="38" dy="35">байланыстылық жоғарырақ</tspan><tspan x="38" dy="35">болуы мүмкін</tspan></text>
<text x="24" y="3110" fill="#455E6F" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400"><tspan x="24" dy="0">Figure 1 негізіндегі аударма: Schauder және</tspan><tspan x="24" dy="30">Bennetto (2016) · CC BY 4.0</tspan></text>
</svg>
