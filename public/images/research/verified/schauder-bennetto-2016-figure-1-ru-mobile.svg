<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 3200" width="720" height="3200" lang="ru" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Как изучают сенсорные реакции</title>
<desc id="figure-desc">Научная модель на примере повышенной реакции на звук. Примеры не являются диагнозом или универсальными результатами.. Адаптация Figure 1: Schauder и Bennetto (2016) · CC BY 4.0</desc>
<rect width="720" height="3200" fill="#FFFFFF"/>
<text x="28" y="67" fill="#103553" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700"><tspan x="28" dy="0">Как изучают сенсорные реакции</tspan></text>
<text x="28" y="121" fill="#3F596B" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400"><tspan x="28" dy="0">Научная модель на примере повышенной реакции на</tspan><tspan x="28" dy="32">звук</tspan></text>
<rect x="18" y="202" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="257" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Клиническое проявление</tspan></text>
<text x="38" y="338" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">МЕТОД ИССЛЕДОВАНИЯ</tspan></text>
<text x="38" y="381" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Анкета родителей или интервью</tspan><tspan x="38" dy="35">о влиянии ощущений</tspan><tspan x="38" dy="35">на повседневную жизнь</tspan></text>
<text x="38" y="510" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ВОЗМОЖНЫЙ РЕЗУЛЬТАТ</tspan></text>
<text x="38" y="553" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Обычный шум мешает ребёнку</tspan><tspan x="38" dy="35">взаимодействовать</tspan><tspan x="38" dy="35">с другими людьми</tspan></text>
<rect x="18" y="678" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="733" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Наблюдаемая реакция</tspan></text>
<text x="38" y="814" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">МЕТОД ИССЛЕДОВАНИЯ</tspan></text>
<text x="38" y="857" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Наблюдение за поведением</tspan></text>
<text x="38" y="986" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ВОЗМОЖНЫЙ РЕЗУЛЬТАТ</tspan></text>
<text x="38" y="1029" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Ребёнок закрывает уши</tspan><tspan x="38" dy="35">при обычных звуках,</tspan><tspan x="38" dy="35">например при работе блендера</tspan></text>
<rect x="18" y="1154" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="1209" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Физиологическая реакция</tspan></text>
<text x="38" y="1290" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">МЕТОД ИССЛЕДОВАНИЯ</tspan></text>
<text x="38" y="1333" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Измерение вегетативных реакций:</tspan><tspan x="38" dy="35">пульс и проводимость кожи</tspan></text>
<text x="38" y="1462" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ВОЗМОЖНЫЙ РЕЗУЛЬТАТ</tspan></text>
<text x="38" y="1505" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Учащение пульса</tspan><tspan x="38" dy="35">при звуке обычной громкости</tspan></text>
<rect x="18" y="1630" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="1685" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Восприятие</tspan></text>
<text x="38" y="1766" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">МЕТОД ИССЛЕДОВАНИЯ</tspan></text>
<text x="38" y="1809" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Психофизический тест:</tspan><tspan x="38" dy="35">обнаружение или различение</tspan><tspan x="38" dy="35">звуковых сигналов</tspan></text>
<text x="38" y="1938" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ВОЗМОЖНЫЙ РЕЗУЛЬТАТ</tspan></text>
<text x="38" y="1981" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Более низкий порог</tspan><tspan x="38" dy="35">обнаружения звука</tspan></text>
<rect x="18" y="2106" width="684" height="464" fill="#F4F8FB" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="2161" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Функциональный ответ мозга</tspan></text>
<text x="38" y="2242" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">МЕТОД ИССЛЕДОВАНИЯ</tspan></text>
<text x="38" y="2285" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Функциональная МРТ (фМРТ)</tspan></text>
<text x="38" y="2414" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ВОЗМОЖНЫЙ РЕЗУЛЬТАТ</tspan></text>
<text x="38" y="2457" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Более выраженный ответ</tspan><tspan x="38" dy="35">в мозговых сетях</tspan><tspan x="38" dy="35">обработки звука</tspan></text>
<rect x="18" y="2582" width="684" height="464" fill="#FFFFFF" stroke="#ACBECA" stroke-width="2"/>
<text x="38" y="2637" fill="#123956" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700"><tspan x="38" dy="0">Структура мозга</tspan></text>
<text x="38" y="2718" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">МЕТОД ИССЛЕДОВАНИЯ</tspan></text>
<text x="38" y="2761" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Структурная МРТ:</tspan><tspan x="38" dy="35">объём и связи областей мозга</tspan></text>
<text x="38" y="2890" fill="#52718A" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700"><tspan x="38" dy="0">ВОЗМОЖНЫЙ РЕЗУЛЬТАТ</tspan></text>
<text x="38" y="2933" fill="#203A4B" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400"><tspan x="38" dy="0">Более высокая связность</tspan><tspan x="38" dy="35">между областями</tspan><tspan x="38" dy="35">слуховой обработки</tspan></text>
<text x="24" y="3110" fill="#455E6F" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400"><tspan x="24" dy="0">Адаптация Figure 1: Schauder и Bennetto (2016)</tspan><tspan x="24" dy="30">· CC BY 4.0</tspan></text>
</svg>
