<g fill="#2c7eae" stroke="#f6fbff" stroke-width="6"><circle cx="576" cy="662" r="30"/><circle cx="579" cy="548" r="23"/><circle cx="582" cy="420" r="25"/><circle cx="589" cy="321" r="27"/><circle cx="733" cy="270" r="24"/><circle cx="720" cy="466" r="24"/></g>
<g stroke="#2e719d" stroke-width="4" stroke-linecap="round"><path d="M589 321 L557 296 M589 321 L632 296 M733 270 L700 244 M733 270 L765 238 M720 466 L688 437 M720 466 L751 438"/></g>
<g fill="#4e93be" stroke="#f6fbff" stroke-width="4"><circle cx="388" cy="238" r="20"/><circle cx="420" cy="340" r="18"/><circle cx="383" cy="444" r="17"/></g>
<g fill="none" stroke="#2e719d" stroke-width="4" stroke-dasharray="9 12"><path d="M394 613 Q409 545 389 478 Q361 411 412 362"/></g>
<rect x="61" y="743" width="915" height="32" rx="8" fill="#e5f1f9"/>
<text x="77" y="766" font-family="Arial,sans-serif" font-size="17" fill="#2b5778">Реальная миграция неоднородна: разные нейроны используют разные маршруты и механизмы.</text>
</svg>