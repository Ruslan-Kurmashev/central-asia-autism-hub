<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 790" role="img" aria-labelledby="t d">
<title id="t">Нейрональные предшественники, миграция и слои коры</title>
<desc id="d">Концептуальная схема клеточного развития: в области образования клеток условная радиальная глиальная клетка и её отросток; молодые нейроны перемещаются к будущей коре, где происходит специализация и образование связей. Это иллюстрация одного механизма миграции, не реальная ткань и не картина патологии аутизма.</desc>
<rect width="1040" height="790" rx="20" fill="#f2f8fc"/>
<text x="48" y="70" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#153e64">Как клетки занимают своё место</text>
<text x="48" y="104" font-family="Arial,sans-serif" font-size="19" fill="#53718b">Условный пример: кора больших полушарий</text>
<rect x="60" y="157" width="920" height="122" rx="18" fill="#d3e4f3"/>
<rect x="60" y="281" width="920" height="108" rx="18" fill="#e4f0f8"/>
<rect x="60" y="392" width="920" height="112" rx="18" fill="#d2e9f5"/>
<rect x="60" y="506" width="920" height="124" rx="18" fill="#dbeef7"/>
<rect x="60" y="634" width="920" height="96" rx="18" fill="#b9d8ea"/>
<g fill="#234f73" font-family="Arial,sans-serif" font-size="18"><text x="75" y="200">Формирующаяся кора</text><text x="75" y="671">Область клеток-предшественников</text></g>
