<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" role="img" aria-labelledby="t d"><title id="t">Различия дизайнов исследований</title><desc id="d">Четыре вида: поперечный срез, когорта, рандомизированное испытание и систематический обзор.</desc><rect width="1300" height="500" fill="#edf5fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="60" y="142" width="230" height="190" rx="22" fill="#fff" stroke="#abcadc" stroke-width="7"/><text x="175" y="227" font-size="32" text-anchor="middle" fill="#225c88">Срез</text><text x="175" y="278" font-size="19" text-anchor="middle" fill="#496c87">один момент</text><rect x="355" y="142" width="230" height="190" rx="22" fill="#fff" stroke="#abcadc" stroke-width="7"/><text x="470" y="227" font-size="32" text-anchor="middle" fill="#225c88">Когорта</text><text x="470" y="278" font-size="19" text-anchor="middle" fill="#496c87">несколько лет</text><rect x="650" y="142" width="230" height="190" rx="22" fill="#fff" stroke="#abcadc" stroke-width="7"/><text x="765" y="227" font-size="32" text-anchor="middle" fill="#225c88">RCT</text><text x="765" y="278" font-size="19" text-anchor="middle" fill="#496c87">случайные группы</text><rect x="945" y="142" width="230" height="190" rx="22" fill="#fff" stroke="#abcadc" stroke-width="7"/><text x="1060" y="227" font-size="32" text-anchor="middle" fill="#225c88">Обзор</text><text x="1060" y="278" font-size="19" text-anchor="middle" fill="#496c87">несколько работ</text><text x="650" y="413" font-size="23" text-anchor="middle" fill="#225c88">Тип исследования зависит от научного вопроса</text></g></svg>