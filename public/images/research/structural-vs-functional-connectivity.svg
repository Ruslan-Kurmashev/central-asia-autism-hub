<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" role="img" aria-labelledby="t d"><title id="t">Структурные и функциональные связи мозга</title><desc id="d">Слева условная структурная сеть с показанными постоянными путями связей; справа функциональная сеть с совместными изменениями активности, включая связь, которая не обязательно является прямым анатомическим соединением. Рисунок иллюстрирует различие измерений, не данные аутичных людей.</desc><rect width="1100" height="730" rx="18" fill="#f1f7fc"/><text x="53" y="65" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17466e">«Связаны» может означать разное</text><text x="53" y="103" font-family="Arial,sans-serif" font-size="18" fill="#4f6d85">Анатомические пути и совместная активность - не одно и то же</text><rect x="52" y="151" width="475" height="495" rx="20" fill="#fff" stroke="#bed6e7" stroke-width="2"/><rect x="573" y="151" width="475" height="495" rx="20" fill="#fff" stroke="#bed6e7" stroke-width="2"/><g fill="#16476f" font-family="Arial,sans-serif" font-size="24" font-weight="700"><text x="79" y="199">Структурная сеть</text><text x="600" y="199">Функциональная сеть</text></g><g fill="#42657e" font-family="Arial,sans-serif" font-size="18"><text x="79" y="230">Пути, связанные с анатомией</text><text x="600" y="230">Корреляции изменений сигналов</text></g><g fill="none" stroke="#3a85b1" stroke-width="7" stroke-linecap="round"><path d="M151 355 L292 311 L422 383 L310 508 L151 355 M292 311 L310 508"/><path d="M656 355 L797 311 L927 383 L817 508 L656 355"/></g><path d="M656 355 Q790 267 927 383 M797 311 L817 508" stroke="#5f99ba" stroke-dasharray="11 12" stroke-width="6" fill="none" stroke-linecap="round"/><g fill="#236f9d" stroke="#fff" stroke-width="6"><circle cx="151" cy="355" r="27"/><circle cx="292" cy="311" r="27"/><circle cx="422" cy="383" r="27"/><circle cx="310" cy="508" r="27"/><circle cx="656" cy="355" r="27"/><circle cx="797" cy="311" r="27"/><circle cx="927" cy="383" r="27"/><circle cx="817" cy="508" r="27"/></g><g font-family="Arial,sans-serif" font-size="17" fill="#446581"><text x="79" y="580">Путь не показывает сам по себе,</text><text x="79" y="605">как часто передаётся сигнал.</text><text x="600" y="580">Совместная активность не доказывает</text><text x="600" y="605">прямую связь или причинность.</text></g><text x="60" y="696" fill="#365f7c" font-size="18" font-family="Arial,sans-serif">Обе сети изменяются с возрастом, состоянием и способом измерения.</text></svg>