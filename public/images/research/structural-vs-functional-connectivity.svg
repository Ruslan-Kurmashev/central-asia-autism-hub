<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" role="img" aria-labelledby="t d"><title id="t">Чем структурная связанность отличается от функциональной</title><desc id="d">Оригинальная концептуальная схема слева показывает физический путь как непрерывные линии между четырьмя условными областями; справа похожие колебания двух сигналов на графике показывают корреляцию функциональной МРТ. Это не реальные фМРТ-данные и не оценка аутизма.</desc><rect width="1160" height="820" rx="22" fill="#f1f8fc"/><text x="48" y="69" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17446b">Связанность мозга: два разных понятия</text><rect x="48" y="127" width="520" height="530" rx="18" fill="#fff" stroke="#a6cadd" stroke-width="2"/><rect x="594" y="127" width="520" height="530" rx="18" fill="#fff" stroke="#a6cadd" stroke-width="2"/><text x="74" y="181" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#164a70">Структурная</text><text x="620" y="181" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#164a70">Функциональная</text><g fill="#496b83" font-family="Arial,sans-serif" font-size="18"><text x="74" y="215">Какие анатомические пути</text><text x="74" y="240">соединяют области?</text><text x="620" y="215">Насколько похоже изменяются</text><text x="620" y="240">сигналы разных областей?</text></g><g stroke="#558cb2" stroke-width="9" stroke-linecap="round" fill="none"><path d="M160 341 L277 404 L431 336 M277 404 L317 550"/></g><g fill="#317ba8" stroke="#fff" stroke-width="7"><circle cx="160" cy="341" r="37"/><circle cx="277" cy="404" r="39"/><circle cx="431" cy="336" r="37"/><circle cx="317" cy="550" r="35"/></g><path d="M657 570 H1045 M657 570 V324" stroke="#8db4d1" stroke-width="3" fill="none"/><g fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><path d="M674 500 L732 417 L790 454 L849 370 L913 410 L971 340 L1032 390" stroke="#2b76a5"/><path d="M674 539 L732 456 L790 493 L849 409 L913 448 L971 379 L1032 430" stroke="#85b5d2"/></g><g fill="#416680" font-family="Arial,sans-serif" font-size="17"><text x="667" y="621">Два условных похожих сигнала</text><text x="657" y="304">Сигнал</text><text x="983" y="597">Время</text></g><rect x="48" y="694" width="1066" height="93" rx="13" fill="#deedf8"/><text x="74" y="730" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#234e70">Важно:</text><text x="165" y="730" font-family="Arial,sans-serif" font-size="18" fill="#345e79">корреляция двух сигналов не подтверждает прямой анатомический</text><text x="74" y="755" font-family="Arial,sans-serif" font-size="18" fill="#345e79">контакт, направление передачи информации или причинную связь.</text></svg>