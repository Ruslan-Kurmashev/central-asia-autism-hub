<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Инклюзивті мектепте қолжетімділік пен қатысудың төрт деңгейі</title>
<desc id="desc">AutismHub әзірлеген тұжырымдамалық сызба. Төрт сұрақ: мектепке қолжетімділік, онда болу, қатысу және қолжетімді оқу. Қажетті жағдайлар: мұғалім даярлығы, орта, коммуникация, отбасымен ынтымақтастық және нәтижелерді бағалау. Диагностикалық шкала, міндетті тәртіп немесе өлшенген дерек емес.</desc>
<rect width="1200" height="700" rx="24" fill="#f2f8fb"/>
<rect x="35" y="32" width="1130" height="636" rx="22" fill="white" stroke="#d3e2eb" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<text x="72" y="90" fill="#153f5d" font-size="32" font-weight="700">Инклюзивті білім: қабылдаудан қатысуға дейін</text>
<text x="72" y="128" fill="#4d7087" font-size="20">Қолжетімді мектеп ортасы қағаздағы есеппен шектелмейді</text>
<g>
<rect x="72" y="215" width="243" height="160" rx="17" fill="#e7f2f7" stroke="#acc9d9" stroke-width="2"/>
<rect x="342" y="215" width="243" height="160" rx="17" fill="#e7f2f7" stroke="#acc9d9" stroke-width="2"/>
<rect x="612" y="215" width="243" height="160" rx="17" fill="#d9ebf3" stroke="#92b9cc" stroke-width="2"/>
<rect x="882" y="215" width="243" height="160" rx="17" fill="#28698a"/>
</g>
<g text-anchor="middle" font-size="25" font-weight="700" fill="#174563">
<text x="193" y="276">Қолжетімділік</text>
<text x="463" y="276">Мектепте болу</text>
<text x="734" y="276">Қатысу</text>
</g>
<text x="1004" y="276" text-anchor="middle" font-size="25" font-weight="700" fill="white">Оқу</text>
<g text-anchor="middle" fill="#4d7187" font-size="18">
<text x="193" y="319">Қабылдау</text><text x="193" y="347">және келу</text>
<text x="463" y="319">Сыныпта қалуға</text><text x="463" y="347">жағдай бар</text>
<text x="734" y="319">Қарым-қатынас</text><text x="734" y="347">ортақ тапсырмалар</text>
</g>
<g text-anchor="middle" fill="#eff9ff" font-size="18">
<text x="1004" y="319">Сабақ мазмұны</text><text x="1004" y="347">қолжетімді</text>
</g>
<g fill="none" stroke="#2f6f91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M317 296H338M329 286L339 296L329 306"/>
<path d="M587 296H608M599 286L609 296L599 306"/>
<path d="M857 296H878M869 286L879 296L869 306"/>
</g>
<text x="74" y="448" fill="#184761" font-size="23" font-weight="700">Әр кезеңге қажет қолдау</text>
<rect x="73" y="473" width="1051" height="124" rx="13" fill="#f2f7fa" stroke="#d6e5ed"/>
<g fill="#285b79" font-size="19">
<text x="94" y="512">Мұғалім даярлығы</text><text x="423" y="512">Қолжетімді орта</text><text x="752" y="512">Коммуникация</text>
<text x="94" y="565">Отбасымен ынтымақтастық</text><text x="545" y="565">Қатысу мен оқу нәтижесін бағалау</text>
</g>
<text x="73" y="636" fill="#57798b" font-size="16">AutismHub оқу сызбасы. Мұнда сандық дерек не мектеп рейтингі жоқ.</text>
</g>
</svg>