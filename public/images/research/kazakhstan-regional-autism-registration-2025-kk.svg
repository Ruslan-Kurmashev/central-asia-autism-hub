<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Қазақстанның үш өңірінде 100 000 балаға шаққандағы РАС тіркеу көрсеткіштері, 2025 жыл</title>
<desc id="description">2026 жылғы 23 сәуірде Factcheck.kz жариялаған Денсаулық сақтау министрлігінің деректеріне сәйкес, 2025 жылғы 100 000 балаға шаққандағы тіркеу көрсеткіштері Астанада 712,9, Қостанай облысында 492,8, Шығыс Қазақстан облысында 450,0 болды. Бұл аутизмнің халық арасындағы нақты таралуы емес.</desc>
<rect width="1200" height="675" fill="#f4f9fc"/>
<rect x="38" y="36" width="1124" height="602" rx="25" fill="#ffffff" stroke="#d4e4ed" stroke-width="2"/>
<text x="85" y="100" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#153957">2025 жылы РАС қай өңірлерде жиірек тіркелді?</text>
<text x="85" y="143" font-family="Arial,sans-serif" font-size="21" fill="#456679">РАС диагнозымен тіркелгендер, 100 000 балаға шаққанда</text>
<line x1="382" y1="210" x2="382" y2="502" stroke="#c0d7e3" stroke-width="2"/>
<g font-family="Arial,sans-serif" font-size="23" fill="#153957">
<text x="356" y="264" text-anchor="end">Астана</text>
<text x="356" y="365" text-anchor="end">Қостанай облысы</text>
<text x="356" y="453" text-anchor="end">Шығыс Қазақстан</text><text x="356" y="480" text-anchor="end">облысы</text>
</g>
<rect x="384" y="225" width="659.4" height="54" rx="9" fill="#24698a"/>
<rect x="384" y="326" width="455.8" height="54" rx="9" fill="#4787a9"/>
<rect x="384" y="427" width="416.3" height="54" rx="9" fill="#669bb4"/>
<g font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#153957">
<text x="1055" y="261">712,9</text>
<text x="851" y="362">492,8</text>
<text x="812" y="463">450,0</text>
</g>
<text x="85" y="563" font-family="Arial,sans-serif" font-size="18" fill="#456679">Бұл аутизмнің нақты таралуы емес. Барлық өңірдің салыстырмалы кестесі жарияланбаған.</text>
<text x="85" y="597" font-family="Arial,sans-serif" font-size="18" fill="#456679">Дереккөз: ҚР Денсаулық сақтау министрлігінің Factcheck.kz арқылы жауабы, 23.04.2026.</text>
</svg>
