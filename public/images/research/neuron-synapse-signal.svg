<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="diagramTitle diagramDescription">
<title id="diagramTitle">Как нейроны передают сигнал</title>
<desc id="diagramDescription">Четыре шага передачи сигнала в типичном химическом синапсе: дендриты получают сигналы, электрический импульс проходит по аксону, окончание аксона выделяет нейромедиаторы, рецепторы следующей клетки воспринимают химическое сообщение. Схема условная, не отражает особенности аутизма.</desc>
<rect width="1000" height="1240" rx="30" fill="#eaf5fb"/>
<g font-family="Arial,DejaVu Sans,sans-serif">
<text x="52" y="78" font-size="44" font-weight="700" fill="#173d5d">Как нейроны передают сигнал</text>
<text x="54" y="117" font-size="23" fill="#4d718a">Один из основных способов связи нервных клеток</text>
</g>
