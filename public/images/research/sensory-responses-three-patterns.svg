<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" role="img" aria-labelledby="t d"><title id="t">Три описания сенсорной реакции, которые могут сочетаться</title><desc id="d">Три отдельные карточки: повышенная чувствительность, пониженная заметность стимула и поиск ощущений. Условные значки не обозначают медицинский риск, частоту проявления или точный нейронный механизм. У одного человека может сочетаться несколько реакций для разных стимулов.</desc><rect width="1100" height="790" rx="22" fill="#f1f8fc"/><text x="47" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#19476e">Сенсорные реакции могут быть разными</text><text x="47" y="103" font-family="Arial,sans-serif" font-size="19" fill="#53728d">Описания поведения, а не три постоянных типа людей</text><g stroke="#a9c8dc" stroke-width="2" fill="#fff"><rect x="45" y="156" width="322" height="469" rx="18"/><rect x="389" y="156" width="322" height="469" rx="18"/><rect x="733" y="156" width="322" height="469" rx="18"/></g><g font-family="Arial,sans-serif" fill="#184e75" font-size="22" font-weight="700"><text x="68" y="213">Гиперреактивность</text><text x="412" y="213">Гипореактивность</text><text x="755" y="213">Поиск ощущений</text></g><g fill="none" stroke="#3f85b0" stroke-linecap="round" stroke-width="6"><path d="M116 305 Q166 249 218 305 Q268 359 316 305"/><path d="M458 305 Q508 286 558 305 Q608 326 657 305"/><path d="M796 305 Q834 255 874 305 Q912 354 954 305 Q991 261 1026 305"/></g><g font-family="Arial,sans-serif" fill="#3c627e" font-size="19"><text x="68" y="381">Ощущение может быть</text><text x="68" y="410">слишком интенсивным</text><text x="68" y="439">или неприятным.</text><text x="412" y="381">Сигнал может не</text><text x="412" y="410">привлекать внимания</text><text x="412" y="439">сразу.</text><text x="755" y="381">Человек может</text><text x="755" y="410">активно искать</text><text x="755" y="439">приятные ощущения.</text></g><g font-family="Arial,sans-serif" font-size="17" fill="#54758c"><text x="68" y="553">Пример: резкий шум</text><text x="412" y="553">Пример: слабый</text><text x="412" y="577">тактильный сигнал</text><text x="755" y="553">Пример: ритмичное</text><text x="755" y="577">движение</text></g><rect x="45" y="660" width="1010" height="92" rx="15" fill="#deedf7"/><text x="69" y="695" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#235377">Важно:</text><text x="171" y="695" font-family="Arial,sans-serif" font-size="19" fill="#376481">один и тот же человек может испытывать все три вида реакций</text><text x="69" y="726" font-family="Arial,sans-serif" font-size="19" fill="#376481">в зависимости от стимула, ситуации и состояния.</text></svg>