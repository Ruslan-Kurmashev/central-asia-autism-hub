<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="t d"><title id="t">Почему различия микробиома могут отражать питание, а не причину аутизма</title><desc id="d">Схема альтернативных объяснений статистической связи. Индивидуальные сенсорные предпочтения связаны с выбором продуктов; питание влияет на микробиом. Семейные условия, возраст, лекарства и проблемы пищеварения также могут влиять на микробиом. В конце указано, что по одной пробе кала нельзя установить причинность или поставить диагноз аутизма.</desc><rect width="1100" height="880" rx="20" fill="#f1f8fc"/><text x="49" y="66" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19496d">Почему наблюдаемая связь может вводить в заблуждение</text><text x="49" y="102" font-family="Arial,sans-serif" font-size="18" fill="#56778c">Схема одного возможного направления, а не единственная модель</text><g stroke="#a0c4d9" stroke-width="3" fill="#fff"><rect x="65" y="164" width="415" height="136" rx="17"/><rect x="619" y="164" width="415" height="136" rx="17"/><rect x="342" y="403" width="415" height="143" rx="17"/><rect x="342" y="641" width="415" height="120" rx="17"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#235779"><text x="272" y="212" font-size="22" font-weight="700">Сенсорные предпочтения</text><text x="272" y="246" font-size="18">и выбор ограниченного рациона</text><text x="827" y="212" font-size="22" font-weight="700">Возраст, лекарства, семья</text><text x="827" y="246" font-size="18">и симптомы пищеварения</text><text x="549" y="453" font-size="25" font-weight="700">Состав и функции микробиома</text><text x="549" y="491" font-size="18">могут различаться между группами</text><text x="549" y="690" font-size="22" font-weight="700">Найденная ассоциация</text><text x="549" y="725" font-size="18">не устанавливает причинный путь</text></g><g fill="none" stroke="#4586af" stroke-width="7" stroke-linecap="round"><path d="M274 307 L418 397 l-3 -18 M418 397 l-20 -2"/><path d="M827 307 L680 398 l23 -2 M680 398 l4 -20"/><path d="M549 556 V633 l-12 -16 M549 633 l12 -16"/></g><rect x="65" y="790" width="969" height="61" rx="13" fill="#deedf7"/><text x="90" y="829" font-family="Arial,sans-serif" font-size="18" fill="#2d5978">Это объяснение смешения факторов, а не доказательство «направления аутизма».</text></svg>