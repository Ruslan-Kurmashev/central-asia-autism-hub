<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" lang="kk" role="img" aria-labelledby="t d"><title id="t">2019 жылғы зерттеудегі бағалау интервалы</title><desc id="d">Нүктелік бағалау 0,93, интервал 0,85-тен 1,02-ге дейін. Айырмашылықтың жоқтығын білдіретін мән 1. Сызықтық шкала.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1200" height="500" fill="#eef5fb"/><path d="M180 342h900" stroke="#6693b2" stroke-width="8"/><path d="M900 105v295" stroke="#7d9daf" stroke-width="8"/><path d="M360 236h612" stroke="#dca642" stroke-width="15"/><circle cx="648" cy="236" r="24" fill="#2d76a6"/><text x="360" y="287" font-size="24" text-anchor="middle" fill="#225d83">0,85</text><text x="648" y="183" font-size="24" text-anchor="middle" fill="#225d83">0,93</text><text x="972" y="287" font-size="24" text-anchor="middle" fill="#225d83">1,02</text><text x="900" y="81" font-size="24" text-anchor="middle" fill="#225d83">1,00</text><text x="600" y="431" font-size="24" text-anchor="middle" fill="#225d83">Сенімділік интервалы 1 мәнін қамтиды</text></g></svg>
