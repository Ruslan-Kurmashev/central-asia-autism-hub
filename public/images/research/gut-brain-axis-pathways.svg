<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 920" role="img" aria-labelledby="t d"><title id="t">Кишечник и мозг: возможные двусторонние пути взаимодействия</title><desc id="d">Условная схема с кишечником слева и нервной системой справа, между ними расположены четыре подписанных пути: нервная связь, иммунные сигналы, обмен веществ и гормоны стресса и пищеварения. Двусторонние стрелки показывают общую взаимосвязь процессов, но не доказывают причинность микробиома в развитии аутизма.</desc><rect width="1120" height="920" rx="20" fill="#f1f8fc"/><text x="46" y="70" font-size="30" font-weight="700" font-family="Arial,sans-serif" fill="#17496e">Ось «кишечник - мозг»: четыре пути</text><text x="46" y="106" font-family="Arial,sans-serif" font-size="18" fill="#57748d">Взаимодействие возможно в обе стороны, но это не доказательство причины аутизма</text><g fill="#fff" stroke="#9fc3d9" stroke-width="3"><rect x="47" y="165" width="276" height="550" rx="21"/><rect x="797" y="165" width="276" height="550" rx="21"/></g><g fill="#245879" font-family="Arial,sans-serif" text-anchor="middle" font-size="25" font-weight="700"><text x="185" y="220">Кишечник</text><text x="935" y="220">Мозг и нервы</text></g><g stroke="#478ab3" stroke-width="10" fill="none" stroke-linecap="round"><path d="M135 301 C264 269 105 457 229 497 Q271 523 211 594"/><path d="M889 323 Q935 267 981 323 Q1004 380 951 423 Q900 446 868 406 Q843 358 889 323"/></g><g fill="#a1cce4" stroke="#fff" stroke-width="5"><circle cx="129" cy="407" r="17"/><circle cx="218" cy="372" r="17"/><circle cx="207" cy="531" r="17"/></g><g font-family="Arial,sans-serif"><rect x="370" y="245" width="380" height="94" rx="16" fill="#dcecf6"/><text x="560" y="281" text-anchor="middle" font-size="21" font-weight="700" fill="#1b527a">Нервные пути</text><text x="560" y="310" text-anchor="middle" font-size="17" fill="#4c728d">включая блуждающий нерв</text><rect x="370" y="365" width="380" height="94" rx="16" fill="#dcecf6"/><text x="560" y="401" text-anchor="middle" font-size="21" font-weight="700" fill="#1b527a">Иммунная сигнализация</text><text x="560" y="430" text-anchor="middle" font-size="17" fill="#4c728d">обмен сигналами между клетками</text><rect x="370" y="485" width="380" height="94" rx="16" fill="#dcecf6"/><text x="560" y="521" text-anchor="middle" font-size="21" font-weight="700" fill="#1b527a">Продукты обмена веществ</text><text x="560" y="550" text-anchor="middle" font-size="17" fill="#4c728d">например короткоцепочечные кислоты</text><rect x="370" y="605" width="380" height="94" rx="16" fill="#dcecf6"/><text x="560" y="641" text-anchor="middle" font-size="21" font-weight="700" fill="#1b527a">Гормональные сигналы</text><text x="560" y="670" text-anchor="middle" font-size="17" fill="#4c728d">стресс и процессы пищеварения</text></g><g stroke="#4186af" stroke-width="5" fill="none" stroke-linecap="round"><path d="M326 291 H360 l-10 -10 M360 291 l-10 10 M760 291 H794 l-10 -10 M794 291 l-10 10"/><path d="M794 412 H760 l11 -10 M760 412 l11 10 M360 412 H326 l10 -10 M326 412 l10 10"/><path d="M326 532 H360 l-10 -10 M360 532 l-10 10 M760 532 H794 l-10 -10 M794 532 l-10 10"/><path d="M794 652 H760 l11 -10 M760 652 l11 10 M360 652 H326 l10 -10 M326 652 l10 10"/></g><rect x="47" y="757" width="1026" height="121" rx="15" fill="#dfedf7"/><text x="76" y="797" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d5878">Важно:</text><text x="169" y="797" font-family="Arial,sans-serif" font-size="18" fill="#456a85">наличие биологического пути не означает, что изменение</text><text x="76" y="826" font-family="Arial,sans-serif" font-size="18" fill="#456a85">микробиома обязательно вызывает аутизм или что его коррекция лечит аутизм.</text></svg>