name: "Public website correction / Исправление сайта"
description: "Report a public factual, translation, accessibility or technical problem. Do not submit personal or medical information."
title: "[Site correction] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **This GitHub issue will be publicly visible. / Это обращение будет публичным. / Бұл өтініш ашық жарияланады.**

        Please report **only** public content and website problems. Do not include names, images, medical records, diagnoses, contact details or other information about children or families.

        Сообщайте только об ошибках в общедоступных материалах и работе сайта. Не указывайте имена, фотографии, диагнозы, медицинские документы, контакты или другую информацию о детях и семьях.

        Тек сайт жұмысы мен жарияланған материалдардың қателерін хабарлаңыз. Балалардың немесе отбасылардың жеке және медициналық деректерін қоспаңыз.

        AutismHub does not provide an individual medical consultation through GitHub.
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public-data safety / Безопасность данных"
      options:
        - label: "I understand this issue is public and I have NOT included personal or medical information about any person. / Я понимаю, что обращение публичное, и не указал(а) персональные или медицинские сведения."
          required: true
  - type: dropdown
    id: category
    attributes:
      label: "Issue category / Категория"
      options:
        - "Factual or medical-content inaccuracy / Неточность содержания"
        - "Outdated Kazakhstan legal or service information / Устаревшие сведения"
        - "Broken external source or download / Не работает ссылка"
        - "Translation or language issue / Проблема перевода"
        - "Accessibility or display problem / Доступность или оформление"
        - "Other public website problem / Другая публичная проблема"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: "Public page URL / Ссылка на страницу"
      description: "Link to the public AutismHub page, not private documents."
      placeholder: "https://ruslan-kurmashev.github.io/central-asia-autism-hub/..."
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: "What should be corrected? / Что исправить?"
      description: "State the publicly verifiable problem without describing an individual person or clinical case."
      placeholder: "Page section, error, expected correction..."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Public supporting source (optional) / Открытый источник"
      description: "A public research paper, guideline or official page (no private files)."
      placeholder: "https://..."
    validations:
      required: false
