name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Import approved AutismHub illustration and commit to repository
        env:
          IMAGE_URL: "https://oaisdmntprukwest.blob.core.windows.net/files/00000000-9474-8243-aed6-2830d90f9c06/raw?se=2026-10-25T23%3A09%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=5de64281-6b16-4d06-ab67-c0a922c6c288&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-25T05%3A24%3A12Z&ske=2026-10-26T05%3A24%3A12Z&sks=b&skv=2026-02-06&sig=ERir6ejAaQ7vpC03n1WMMjVXvQw1domQZX%2B1yi/aSlg%3D"
        run: |
          set -euo pipefail
          mkdir -p public/images/editorial
          curl --fail --location --silent --show-error --retry 3 "$IMAGE_URL" --output public/images/editorial/emotion-three-moments-reference.png
          python -c "import struct; p='public/images/editorial/emotion-three-moments-reference.png'; d=open(p,'rb').read(); assert d[:8] == bytes.fromhex('89504e470d0a1a0a') and len(d)>100000; print('Valid generated illustration:',len(d),'bytes')"
          git config user.name "autismhub-pages-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial/emotion-three-moments-reference.png
          git commit -m "Add approved emotion-support infographic as repository image"
          git push origin HEAD:main
      - name: Install Python for printable practice resources
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate PDF, DOCX and XLSX assessment downloads
        run: |
          python -m pip install --disable-pip-version-check "reportlab>=4.2,<5" "python-docx>=1.1,<2" "pypdf>=5,<7" "lxml>=5,<7" "cssselect2>=0.7,<1" "tinycss2>=1.2,<2" "pymupdf>=1.24,<2"
          python -m pip install --no-deps "svglib==1.6.0"
          python scripts/build-professional-assessment-downloads.py
          python scripts/build-professional-assessment-toolkit-v2.py
          python scripts/validate-assessment-toolkit.py
          python scripts/build-professional-evidence-claim-form.py
          python scripts/validate-professional-evidence-claim-form.py
          python scripts/build-professional-practice-tools.py
          python scripts/validate-professional-practice-tools.py
          python scripts/build-child-development-diary.py
          python scripts/build-parent-motor-activity-pdfs.py
          python scripts/build-parent-emotion-resources.py
          python scripts/build-parent-daily-independence-pdfs.py
          python scripts/build-parent-skill-loss-observation-pdf.py
          python scripts/build-parent-bilingual-language-pdfs.py
          python scripts/build-parent-home-preschool-context-pdfs.py
          python scripts/build-parent-development-translated-pdfs.py
          python scripts/rebuild-parent-printables.py
          python scripts/qa-parent-printables.py
          python scripts/audit-child-development-external-sources.py
          python scripts/build-research-reading-worksheet.py
          python scripts/validate-research-reading-worksheet.py
      - name: Upload 15-PDF preview and external citation QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autismhub-parent-development-qa
          path: |
            docs/audit-results/pdf-preview/
            docs/audit-results/child-development-external-sources.md
            docs/audit-results/child-development-external-sources.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate, build, and upload site
        uses: withastro/action@v6
        env:
          BASE_COMMIT: ${{ github.event.before }}
        with:
          node-version: 24
          cache: 'false'
          build-cmd: npm run validate
      - name: Final regional research article browser and external URL audit
        run: node scripts/check-regional-research-final.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
