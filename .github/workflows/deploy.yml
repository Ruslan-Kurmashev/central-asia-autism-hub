name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Python for printable practice resources
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate PDF, DOCX and XLSX assessment downloads
        run: |
          python -m pip install --disable-pip-version-check "reportlab>=4.2,<5" "python-docx>=1.1,<2" "pypdf>=5,<7"
          python scripts/build-professional-assessment-downloads.py
          python scripts/build-professional-assessment-toolkit-v2.py
          python scripts/validate-assessment-toolkit.py
          python scripts/build-professional-evidence-claim-form.py
          python scripts/validate-professional-evidence-claim-form.py
      - name: Validate, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run validate

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
