name: Move milestone export section

on:
  push:
    branches:
      - feature/milestone-downloads-final

permissions:
  contents: write

jobs:
  move-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/milestone-downloads-final
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Move export block directly below next steps
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/MilestoneSheet.astro')
          s = p.read_text()
          source = '''  <section class="milestone-source" aria-labelledby="milestone-source-title">\n    <h2 id="milestone-source-title">{copy.sourceTitle}</h2>\n    <p>{copy.sourceText}</p>\n    <p><a href={age.sourceUrl} rel="external">{formatAge(ui.sourceLinkTemplate)}</a></p>\n  </section>\n\n'''
          export = '''  <section class="milestone-export" aria-labelledby="milestone-export-title">\n    <h2 id="milestone-export-title">{exportUi.exportTitle}</h2>\n    <p>{exportUi.exportHint}</p>\n    <div class="milestone-export__buttons">\n      <button type="button" data-export-pdf>{exportUi.pdfButton}</button>\n      <button type="button" class="milestone-export__word" data-export-word>\n        {exportUi.wordButton}\n      </button>\n    </div>\n    <p class="milestone-export__pdf-hint">{exportUi.pdfHint}</p>\n  </section>\n\n'''
          old = source + export
          new = export + source
          if old not in s:
              raise SystemExit('Expected source/export sequence not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run validate
      - name: Verify visual order in source
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/components/MilestoneSheet.astro').read_text()
          assert s.index('class="milestone-next"') < s.index('class="milestone-export"') < s.index('class="milestone-source"')
          PY
      - name: Commit validated change and remove temporary workflow
        run: |
          rm .github/workflows/tmp-move-milestone-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MilestoneSheet.astro .github/workflows/tmp-move-milestone-export.yml
          git commit -m "Move milestone export below next steps"
          git push origin HEAD:feature/milestone-downloads-final
