name: Fix articles 16-20 QA residue rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-qa-residue-16-20-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Narrow residue checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/qa-clean-articles-16-20-temp.yml')
          text = path.read_text(encoding='utf-8')
          pairs = [
              ("'communication breakdown)'", "'коммуникацию breakdown'"),
              ("'wait time'", "'- wait time'"),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'Expected residue rule not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "AutismHub QA"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/qa-clean-articles-16-20-temp.yml
          git commit -m "Narrow articles 16-20 residue checks"
          git push origin HEAD:main
