name: Final language pass articles 16-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-clean-articles-16-20-final-temp.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply final language fixes and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          fixes = {
            'src/content/pages/kz/ru/aided-language-modelling.md': [
              ('## Aided моделирование не должно ограничиваться занятиями', '## Моделирование AAC не должно ограничиваться занятиями'),
              ('- самостоятельная коммуникация\n- количество и тип подсказок', '- самостоятельную коммуникацию\n- количество и тип подсказок'),
            ],
            'src/content/pages/kz/ru/communication-partner-training.md': [
              ('- подсказок\n- реакция на отказ', '- подсказки\n- реакцию на отказ'),
            ],
            'src/content/pages/kz/ru/pecs.md': [
              ('- доска выбора;', '- доску выбора;'),
              ('PECS обычно не относится к физически рискованным вмешательства.', 'PECS обычно не относится к физически рискованным вмешательствам.'),
            ],
          }

          for path_str, pairs in fixes.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path_str}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          for path_str in fixes:
              if chr(0x2014) in Path(path_str).read_text(encoding='utf-8'):
                  raise SystemExit(f'Forbidden long dash in {path_str}')
          PY

          npm install
          npm run validate

          git config user.name "AutismHub QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/pages/kz/ru/aided-language-modelling.md \
                  src/content/pages/kz/ru/communication-partner-training.md \
                  src/content/pages/kz/ru/pecs.md
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Finish language cleanup articles 16-20"
          git push origin HEAD:main
