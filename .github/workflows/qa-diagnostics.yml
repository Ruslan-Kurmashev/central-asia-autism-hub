name: External URLs and dependency health

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'

permissions:
  contents: read

jobs:
  qa-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static pages for URL inspection
        run: npm run build

      - name: Check external URLs (report, do not fail on remote blocking)
        run: npm run check:external-links

      - name: Audit installed dependencies including production-only exposure
        if: always()
        run: npm run audit:dependencies
