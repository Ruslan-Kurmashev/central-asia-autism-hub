name: Publish auditory integration article temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-auditory-integration-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Update article
        env:
          SCRIPT_ZB64: 
        run: |
          python - <<'PY'
          import os, base64, zlib
          code = zlib.decompress(base64.b64decode(os.environ['SCRIPT_ZB64'])).decode('utf-8')
          exec(compile(code, '/tmp/update_auditory.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm install
      - name: Validate site
        run: npm run validate
      - name: Commit article
        run: |
          git config user.name "Ruslan Kurmashev"
          git config user.email "tigrrustik0@gmail.com"
          git add src/content/pages/kz/ru/auditory-integration-listening-programs.md
          git commit -m "Update auditory integration article with current evidence"
          git push origin main
