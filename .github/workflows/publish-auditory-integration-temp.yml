name: Publish auditory integration article temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-auditory-integration-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update article
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          path = Path('src/content/pages/kz/ru/auditory-integration-listening-programs.md')
          text = path.read_text(encoding='utf-8')
          original = text

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'title: "Слуховые программы и слуховая интеграционная тренировка: что известно об эффективности"',
              'title: "Слуховая интеграция и listening-программы: что известно об эффективности"',
              'title'
          )
          replace_once(
              'summary: "Что такое слуховая интеграционная тренировка (Auditory Integration Training, AIT), чем слуховые программы отличаются от обычной защиты от шума и что показывают исследования и клинические рекомендации."',
              'summary: "Что такое слуховая интеграционная тренировка (Auditory Integration Training, AIT), чем она отличается от защиты от шума и современных listening-программ и что показывают исследования и рекомендации."',
              'summary'
          )
          replace_once(
              'description: "Практическое руководство для родителей о слуховой интеграционной тренировке, методе Томатиса и других слуховых программах при аутизме: доказательства, ограничения, адаптация среды и вопросы специалисту."',
              'description: "Практическое руководство для родителей об AIT, методе Томатиса и современных listening-программах при аутизме: доказательства, ограничения, проверка слуха, адаптация среды и вопросы специалисту."',
              'description'
          )

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          text, n = re.subn(r'publishedAt: "[^"]+"', f'publishedAt: "{now}"', text, count=1)
          if n != 1:
              raise SystemExit('publishedAt replacement failed')
          text, n = re.subn(r'reviewDueAt: 2027-03-19', 'reviewDueAt: 2027-03-26', text, count=1)
          if n != 1:
              raise SystemExit('reviewDueAt replacement failed')

          fm_tail = '''keyPoints:
  - "Слуховая чувствительность может серьёзно мешать ребёнку, но это не означает, что ему нужна слуховая интеграционная тренировка или коммерческая listening-программа."
  - "AIT отличается от обычной защиты от шума, адаптации среды и более новых sound-based interventions; данные одного подхода нельзя переносить на другой."
  - "Cochrane не нашёл достаточных доказательств эффективности AIT, NICE не рекомендует её для речевых и языковых трудностей, а ASHA не одобряет AIT как клиническую практику."
  - "Для современных listening-программ есть предварительные положительные данные, но исследования малочисленны и неоднородны, поэтому каждую программу нужно оценивать отдельно."
evidenceLimitations: "Классические исследования AIT в основном небольшие, старые и неоднородные. Поиск для актуальной версии Cochrane завершён в сентябре 2010 года, поэтому обзор не охватывает все современные listening-программы. Более новый систематический обзор 2025 года нашёл только восемь публикаций по шести разным sound-based interventions и назвал результаты предварительными. Положительный китайский метаанализ AIT 2018 года расходится с Cochrane, NICE и ASHA. Исследования одной звуковой программы нельзя автоматически переносить на AIT, Tomatis или другие коммерческие программы."
sources:
  - title: "Auditory integration therapy for autism spectrum disorders"
    url: "https://www.cochrane.org/evidence/CD003681_auditory-integration-therapy-autism-spectrum-disorders"
    organisation: "Cochrane"
    publicationYear: 2022
    note: "7 исследований, 182 участника; поиск для обновления завершён в сентябре 2010 года. Использовано для вывода об отсутствии достаточных доказательств в пользу AIT и похожих ранних звуковых терапий."
    accessedAt: 2026-09-26
  - title: "Autism spectrum disorder in under 19s: support and management - Recommendations"
    url: "https://www.nice.org.uk/guidance/cg170/chapter/recommendations"
    organisation: "National Institute for Health and Care Excellence"
    publicationYear: 2013
    note: "Использовано для рекомендации не применять AIT для коррекции речевых и языковых трудностей у аутичных детей и подростков."
    accessedAt: 2026-09-26
  - title: "Autism and Autism Spectrum Disorder"
    url: "https://www.asha.org/practice-portal/clinical-topics/autism/"
    organisation: "American Speech-Language-Hearing Association"
    note: "Актуальный Practice Portal относит AIT к подходам, которые ASHA не одобряет, поскольку метод не достиг научных стандартов эффективности для практического применения."
    accessedAt: 2026-09-26
  - title: "The association of auditory integration training in children with autism spectrum disorders among Chinese: a meta-analysis"
    url: "https://pubmed.ncbi.nlm.nih.gov/30429234/"
    organisation: "PubMed"
    publicationYear: 2018
    note: "13 рандомизированных исследований, 976 детей; использовано для отражения положительных выводов, которые расходятся с Cochrane, NICE и ASHA."
    accessedAt: 2026-09-26
  - title: "Effectiveness of Sound-Based Interventions for Improving Functional Outcomes in Children: A Systematic Review of the Evidence"
    url: "https://pubmed.ncbi.nlm.nih.gov/40519630/"
    organisation: "Occupational Therapy International"
    publicationYear: 2025
    note: "8 публикаций по 6 sound-based interventions; результаты предварительные, исследования сильно неоднородны, необходимы более качественные RCT."
    accessedAt: 2026-09-26
  - title: "Effect of hyperbaric oxygen therapy and Tomatis sound therapy in children with autism spectrum disorder"
    url: "https://pubmed.ncbi.nlm.nih.gov/34662695/"
    organisation: "Progress in Neuro-Psychopharmacology and Biological Psychiatry"
    publicationYear: 2022
    note: "Открытое рандомизированное исследование 146 детей; использовано как пример более нового положительного исследования Tomatis с существенными ограничениями дизайна."
    accessedAt: 2026-09-26
  - title: "Autism and central and peripheral hearing loss: A systematic review"
    url: "https://pubmed.ncbi.nlm.nih.gov/40449032/"
    organisation: "Medicina Clinica"
    publicationYear: 2025
    note: "21 исследование; 17 сообщили о предрасположенности к центральным или периферическим нарушениям слуха. Авторы рекомендуют проверку слуха, чтобы избежать задержки диагностики."
    accessedAt: 2026-09-26
  - title: "Auditory Sensitivity in Autism: A Systematic Review of Mismatch Negativity and Mismatch Field Responses"
    url: "https://pubmed.ncbi.nlm.nih.gov/42144892/"
    organisation: "Autism Research"
    publicationYear: 2026
    note: "Систематический обзор нейрофизиологических исследований использован для пояснения, что различия слуховой обработки при аутизме не доказывают эффективность конкретной listening-программы."
    accessedAt: 2026-09-26
'''

          pattern = re.compile(r'keyPoints:\n.*?\nsources:\n.*?\n---\n', re.S)
          text, n = pattern.subn(fm_tail + '---\n', text, count=1)
          if n != 1:
              raise SystemExit('frontmatter evidence block replacement failed')

          replace_once(
              '[← Сенсорные особенности и адаптация среды](/kz/ru/parents/sensornye-osobennosti-i-adaptatsiya-sredy/)',
              '[← Утяжелённые одеяла, жилеты и другие утяжелённые средства](/kz/ru/parents/weighted-items/)',
              'top previous navigation'
          )

          replace_once(
              '''## Важно понимать ограничения этих данных

Обзор Cochrane опубликован в актуальной версии в 2022 году, но значительная часть включённых исследований была проведена намного раньше.

Это не означает, что старые исследования автоматически неправильные.

Но для широко рекламируемого метода качественная современная доказательная база остаётся ограниченной.''',
              '''## Важно понимать ограничения этих данных

Текущая страница Cochrane указывает публикацию обзора в 2022 году.

Но поиск исследований для этого обновления проводился до **сентября 2010 года**.

Поэтому обзор важен для оценки классической AIT, но он не отражает всю литературу по более новым listening-программам.

Это не означает, что старые исследования автоматически неправильные. Это означает, что современные программы должны подтверждать свою эффективность собственными исследованиями, а не ссылаться только на данные по AIT.''',
              'Cochrane limitations'
          )

          replace_once(
              '''То есть AIT не следует предлагать ребёнку как доказанный способ улучшить речь или язык.

## Есть ли исследования с положительными результатами''',
              '''То есть AIT не следует предлагать ребёнку как доказанный способ улучшить речь или язык.

## Что говорит ASHA

American Speech-Language-Hearing Association, ASHA - Американская ассоциация речи, языка и слуха - также не одобряет AIT как обычную клиническую практику.

В актуальном Practice Portal по аутизму ASHA указывает, что AIT не достигла научных стандартов эффективности, которые позволяли бы оправдать её применение аудиологами и специалистами по речи и языку.

Это особенно важно, если программу предлагают именно для:

- запуска речи
- улучшения понимания речи
- развития языка
- слуховой обработки.

## Есть ли исследования с положительными результатами''',
              'ASHA section'
          )

          replace_once(
              'Но этот вывод расходится с Cochrane и клиническими рекомендациями NICE.',
              'Но этот вывод расходится с Cochrane, клиническими рекомендациями NICE и позицией ASHA.',
              'meta-analysis contrast'
          )

          replace_once(
              '''В обзоре Cochrane было одно исследование метода Томатиса.

Оно не показало различий в развитии языка между группой вмешательства и контрольной группой.

## А другие слуховые программы

На рынке существует много программ с различными названиями.

Они могут использовать:

- фильтрованную музыку
- специальную частотную обработку
- костную проводимость
- особые наушники
- индивидуальные аудиозаписи.

Само наличие современной аппаратуры не является доказательством эффективности.

Для каждой программы отдельно нужно спрашивать:

> **Какое исследование подтверждает именно эту программу и именно заявленный результат?**''',
              '''В обзоре Cochrane было одно исследование метода Томатиса.

Оно не показало различий в развитии языка между группой вмешательства и контрольной группой.

В 2022 году было опубликовано более новое открытое рандомизированное исследование с **146 аутичными детьми**. Дети были распределены в четыре группы: Tomatis, гипербарическая оксигенация, сочетание двух методов и отсутствие вмешательства. Авторы сообщили улучшения по шкале CARS в группах вмешательства.

Но исследование имело важные ограничения:

- оно было открытым
- не использовало активное плацебо-условие
- участники и исследователи не были ослеплены
- набор исходов был ограничен.

Сами авторы указали, что доказательная база остаётся спорной и нужны исследования с более строгим дизайном.

Поэтому одно положительное исследование не делает Tomatis доказанным методом при аутизме.

## Что известно о современных listening-программах

На рынке существуют разные программы, например:

- Safe and Sound Protocol
- Listening Project Protocol
- Integrated Listening Systems
- The Listening Program
- Therapeutic Listening
- другие программы с обработанной или фильтрованной музыкой.

Они не являются одной терапией и не должны автоматически объединяться с классической AIT или методом Томатиса.

В 2025 году был опубликован систематический обзор современных sound-based interventions - вмешательств на основе специально обработанного звука.

Он нашёл только **8 публикаций по 6 разным программам**.

Авторы сообщили предварительные положительные результаты для некоторых показателей слуховой чувствительности, поведения, языка и эмоциональной регуляции.

Но исследования сильно различались по:

- размеру выборки
- диагнозам участников
- дизайну
- программе
- измеряемым результатам.

Авторы прямо указали, что необходимы более качественные рандомизированные исследования и более единые показатели результатов.

Поэтому наиболее точный вывод:

> **Для отдельных современных listening-программ есть предварительные положительные сигналы, но доказательств пока недостаточно, чтобы считать их класс доказанным вмешательством.**

Само наличие современной аппаратуры, приложения или сертификата производителя не является доказательством эффективности.

Для каждой программы отдельно нужно спрашивать:

> **Какое независимое исследование подтверждает именно эту программу и именно заявленный результат?**''',
              'Tomatis and modern programs'
          )

          replace_once(
              '''Нужно показать, что после программы ребёнку действительно стало легче:

- переносить нужные звуки
- участвовать в школе
- общаться
- выполнять важные для него действия.

## Слуховая чувствительность не всегда связана только с аутизмом''',
              '''Нужно показать, что после программы ребёнку действительно стало легче:

- переносить нужные звуки
- участвовать в школе
- общаться
- выполнять важные для него действия.

В 2026 году систематический обзор нейрофизиологических исследований подтвердил, что слуховая обработка у многих аутичных людей действительно может отличаться.

Но наличие нейрофизиологического различия не доказывает эффективность AIT, Tomatis, SSP или любой другой listening-программы.

Механизм и клиническая эффективность конкретного вмешательства - разные вопросы.

## Слуховая чувствительность не всегда связана только с аутизмом''',
              'neurophysiology section'
          )

          replace_once(
              '''Если ребёнок стал резко реагировать на звуки, важно не объяснять это автоматически сенсорными особенностями.

Возможны:

- боль в ухе
- воспаление
- снижение слуха
- шум в ушах
- головная боль
- другие медицинские причины.

Особенно важна медицинская оценка, если реакция:

- появилась внезапно
- выражена только с одной стороны
- сопровождается болью
- появилась вместе с изменением слуха
- сопровождается головокружением или другими новыми симптомами.''',
              '''Если ребёнок плохо реагирует на речь, часто переспрашивает или стал резко реагировать на звуки, важно не объяснять это автоматически сенсорными особенностями.

Систематический обзор 2025 года включил **21 исследование** связи аутизма с центральными и периферическими нарушениями слуха. В 17 исследованиях были найдены данные о повышенной предрасположенности к одному из этих нарушений. Авторы также отметили риск задержки диагностики из-за перекрывающихся проявлений и рекомендовали проверку слуха.

Возможны:

- боль в ухе
- воспаление или частые отиты
- снижение слуха
- трудности понимания речи в шуме
- шум в ушах
- другие медицинские причины.

Проверку слуха особенно важно обсудить, если ребёнок:

- перестал реагировать на звуки, на которые раньше реагировал
- часто переспрашивает
- кажется, что одним ухом слышит хуже
- значительно увеличивает громкость
- имеет частые инфекции уха
- испытывает боль или имеет выделения из уха
- внезапно изменил реакцию на звук.

Listening-программа не должна заменять аудиологическую или медицинскую оценку возможного нарушения слуха.''',
              'hearing assessment section'
          )

          replace_once(
              '''Cochrane не нашёл достаточных доказательств для поддержки AIT и похожих звуковых терапий.

NICE отдельно не рекомендует AIT для коррекции речевых и языковых трудностей у аутичных детей и подростков.

Поэтому главный вопрос:

> **Есть ли доказательства, что именно эта слуховая программа улучшает ту конкретную проблему, которая мешает ребёнку в обычной жизни?**''',
              '''Для классической AIT Cochrane не нашёл достаточных доказательств эффективности. NICE не рекомендует AIT для речевых и языковых трудностей, а ASHA не одобряет её как клиническую практику.

При этом существуют отдельные положительные исследования и метаанализы, а для более современных sound-based interventions обзор 2025 года обнаружил предварительные положительные сигналы.

Поэтому наиболее корректная позиция:

> **Доказательства различаются между программами и в целом остаются ограниченными. Ни AIT, ни listening-программы как класс нельзя считать доказанным универсальным методом помощи при аутизме.**

При выраженной слуховой чувствительности сначала полезно определить конкретную проблему, проверить слух при наличии показаний и рассмотреть более прямую адаптацию звуковой среды.

Главный вопрос:

> **Есть ли независимые доказательства, что именно эта программа улучшает ту конкретную проблему, которая мешает ребёнку в обычной жизни?**''',
              'summary conclusion'
          )

          replace_once(
              '[← Сенсорные особенности и адаптация среды](/kz/ru/parents/sensornye-osobennosti-i-adaptatsiya-sredy/)',
              '[← Утяжелённые одеяла, жилеты и другие утяжелённые средства](/kz/ru/parents/weighted-items/)',
              'bottom previous navigation'
          )

          if text == original:
              raise SystemExit('No changes made')
          if '\u2014' in text:
              raise SystemExit('U+2014 em dash found in article')

          path.write_text(text, encoding='utf-8')
          print(f'publishedAt={now}')
          PY

      - name: Install dependencies
        run: npm install

      - name: Validate site
        run: npm run validate

      - name: Commit article
        shell: bash
        run: |
          git config user.name "Ruslan Kurmashev"
          git config user.email "tigrrustik0@gmail.com"
          git add src/content/pages/kz/ru/auditory-integration-listening-programs.md
          git commit -m "Update auditory integration article with current evidence"
          git push origin main
