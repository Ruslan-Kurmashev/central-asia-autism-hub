name: Restore registered Kazakhstan prepayment cover
on:
  push:
    branches:
      - audit/check-service-before-payment-kz-20261109
    paths:
      - .github/workflows/restore-kz-prepayment-cover.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target branch
        uses: actions/checkout@v4
        with:
          ref: audit/check-service-before-payment-kz-20261109
          persist-credentials: true
      - name: Restore original stock photograph and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/editorial/photos
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            'https://images.pexels.com/photos/8815849/pexels-photo-8815849.jpeg?auto=compress&cs=tinysrgb&w=1200' \
            --output public/images/editorial/photos/kz-help-008.jpg
          test "$(file --brief --mime-type public/images/editorial/photos/kz-help-008.jpg)" = 'image/jpeg'
          test "$(stat -c %s public/images/editorial/photos/kz-help-008.jpg)" -gt 30000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/images/editorial/photos/kz-help-008.jpg
          git rm .github/workflows/restore-kz-prepayment-cover.yml
          git commit -m 'Restore original Pexels stock cover for Kazakhstan service checklist'
          git push origin HEAD:audit/check-service-before-payment-kz-20261109
