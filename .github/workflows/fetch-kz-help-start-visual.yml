name: Fetch KZ help article visual

on:
  push:
    branches: [content/help-kazakhstan-start-final]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: content/help-kazakhstan-start-final

      - name: Download optimized Pexels photograph
        run: |
          mkdir -p public/images/editorial
          curl -fL 'https://images.pexels.com/photos/18168574/pexels-photo-18168574.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/kz-help-start-astana-arrow.jpg
          file public/images/editorial/kz-help-start-astana-arrow.jpg
          du -h public/images/editorial/kz-help-start-astana-arrow.jpg

      - name: Commit photograph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial/kz-help-start-astana-arrow.jpg
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add Kazakhstan navigation article visual"
          git push origin HEAD:content/help-kazakhstan-start-final
