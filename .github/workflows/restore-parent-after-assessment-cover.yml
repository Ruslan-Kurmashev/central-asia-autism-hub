name: Restore registered stock image for assessment guide
on:
  push:
    branches:
      - publish/assessment-kk-en-final-four-20261112
    paths:
      - .github/workflows/restore-parent-after-assessment-cover.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/assessment-kk-en-final-four-20261112
          persist-credentials: true
      - name: Restore registered Pexels photo and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/editorial/photos
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            'https://images.pexels.com/photos/8413085/pexels-photo-8413085.jpeg?auto=compress&cs=tinysrgb&w=1200' \
            --output public/images/editorial/photos/parent-after-assessment-clinician-notes.jpg
          test "$(file --brief --mime-type public/images/editorial/photos/parent-after-assessment-clinician-notes.jpg)" = 'image/jpeg'
          test "$(stat -c %s public/images/editorial/photos/parent-after-assessment-clinician-notes.jpg)" -gt 30000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/images/editorial/photos/parent-after-assessment-clinician-notes.jpg
          git rm .github/workflows/restore-parent-after-assessment-cover.yml
          git commit -m 'Restore approved Pexels assessment results cover'
          git push origin HEAD:publish/assessment-kk-en-final-four-20261112
