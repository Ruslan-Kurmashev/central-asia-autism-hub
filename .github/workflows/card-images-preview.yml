name: Build card-image support

on:
  push:
    branches: [feature/homepage-card-images]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate and build
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run validate
