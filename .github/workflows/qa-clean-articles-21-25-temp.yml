              ('  - title: "Non-speech oral motor treatment for children with developmental speech sound disorders"\n    url: "https://pubmed.ncbi.nlm.nih.gov/25805060/"\n    organisation: "Cochrane / PubMed"\n    publicationYear: 2015\n    note: "Использовано для ограничения утверждений об эффективности неречевой орально-моторной терапии при нарушениях звукопроизношения у детей."\n    accessedAt: 2026-09-18\n---', '  - title: "Non-speech oral motor treatment for children with developmental speech sound disorders"\n    url: "https://pubmed.ncbi.nlm.nih.gov/25805060/"\n    organisation: "Cochrane / PubMed"\n    publicationYear: 2015\n    note: "Использовано для ограничения утверждений об эффективности неречевой орально-моторной терапии при нарушениях звукопроизношения у детей."\n    accessedAt: 2026-09-18\n  - title: "Treatment of speech sound disorders in children: Nonspeech oral exercises"\n    url: "https://pubmed.ncbi.nlm.nih.gov/33718569/"\n    organisation: "PubMed"\n    publicationYear: 2021\n    note: "Использовано как более поздний обзор литературы по неречевым оральным упражнениям при нарушениях звукопроизношения у детей."\n    accessedAt: 2026-09-24\n---'),
              ('## Что делать дальше\n\n[← Вернуться в раздел «Коммуникация и AAC»](/kz/ru/parents/kommunikatsiya-i-aac/)\n\n[Проверить, помогает ли выбранная поддержка](/kz/ru/parents/kak-ponyat-pomogaet-li-podderzhka/)\n\nТакже полезно:\n\n- [AAC: альтернативная и дополнительная коммуникация](/kz/ru/parents/aac/)\n- [PECS](/kz/ru/parents/pecs/)', '## Навигация по маршруту\n\n- Предыдущий раздел: [«Коммуникация и AAC»](/kz/ru/parents/kommunikatsiya-i-aac/)\n- Следующий материал: [«Развитие, взаимодействие и игра»](/kz/ru/parents/razvitie-vzaimodeystvie-i-igra/)\n- Проверка результата: [«Как понять, помогает ли выбранная помощь»](/kz/ru/parents/kak-ponyat-pomogaet-li-podderzhka/)\n- Также полезно: [AAC](/kz/ru/parents/aac/) и [PECS](/kz/ru/parents/pecs/)')
          ])

          apply(files['22'], [
              ('"Naturalistic Intervention и NDBI нужно оценивать', '"Обучение в естественных ситуациях (Naturalistic Intervention) и NDBI нужно оценивать'),
              ('    organisation: "National Clearinghouse on Autism Evidence and Practice"\n    publicationYear: 2020', '    organisation: "Hume et al."\n    publicationYear: 2021'),
