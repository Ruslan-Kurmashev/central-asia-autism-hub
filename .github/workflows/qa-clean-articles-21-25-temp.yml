              ('- сам начинает interaction\n- остаётся включённым в значимой деятельности.', '- сам начинает взаимодействие\n- остаётся вовлечённым в значимую деятельность.'),
              ('Поэтому взаимной коммуникации не должна оцениваться только количеством устных слов.', 'Поэтому взаимную коммуникацию не следует оценивать только количеством устных слов.'),
              ('Play - игра - может быть:', 'Игра (play) может быть:'),
              ('- engagement\n- взаимной коммуникации', '- вовлечённости\n- взаимной коммуникации'),
