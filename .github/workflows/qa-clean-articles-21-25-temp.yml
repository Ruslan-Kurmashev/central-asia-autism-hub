              ('    note: "Использовано для данных по адаптивному поведению, повседневным навыкам, языку, совместному вниманию и ограничениям, связанным с риском систематической ошибки и уверенностью в доказательствах."', '    note: "Обзор включал ранние интенсивные поведенческие вмешательства и NDBI; использован для данных по адаптивному поведению, повседневным навыкам, языку, совместному вниманию и ограничениям доказательств."'),
              ('[← Какие виды помощи и поддержки бывают при аутизме](/kz/ru/parents/vidy-pomoshchi-i-podderzhki-pri-autizme/)', '[← Логопедическая и речевая помощь при аутизме](/kz/ru/parents/speech-language-therapy/)\n\n[К общей карте помощи](/kz/ru/parents/vidy-pomoshchi-i-podderzhki-pri-autizme/)'),
              ('Eye contact - зрительный контакт - может присутствовать', 'Зрительный контакт (eye contact) может присутствовать'),
