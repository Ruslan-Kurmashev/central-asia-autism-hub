              ('- самостоятельно инициирует shared activity\n- показывает интересный объект\n- отвечает на инициативу другого человека\n- участвует в 3-4 reciprocal turns - взаимных обменах\n- использует AAC во время игры\n- расширил количество значимых игровых занятий\n- переносит skill домой и в школу.', '- самостоятельно инициирует совместную деятельность\n- показывает интересный объект\n- отвечает на инициативу другого человека\n- участвует в 3-4 взаимных обменах (reciprocal turns)\n- использует AAC во время игры\n- расширил количество значимых игровых занятий\n- переносит навык домой и в школу.'),
              ('Это может быть clear совместного внимания episode - явный эпизод совместного внимания.', 'Это может быть явный эпизод совместного внимания.'),
