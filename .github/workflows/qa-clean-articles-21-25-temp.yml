name: QA clean articles 21-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-clean-articles-21-25-temp.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply editorial and evidence QA fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              '21': Path('src/content/pages/kz/ru/speech-language-therapy.md'),
              '22': Path('src/content/pages/kz/ru/development-interaction-play.md'),
              '23': Path('src/content/pages/kz/ru/naturalistic-intervention.md'),
              '24': Path('src/content/pages/kz/ru/ndbi.md'),
              '25': Path('src/content/pages/kz/ru/joint-attention.md'),
          }

          def apply(path, replacements):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          apply(files['21'], [
              ('- трудности звукопроизношения\n- моторные речевые трудности', '- трудностей звукопроизношения\n- моторных речевых трудностей'),
              ('какой именно вмешательство используется', 'какое именно вмешательство используется'),
              ('понимание языка (receptive language - понимание речи)', 'понимание речи (receptive language)'),
              ('использование языка для выражения мыслей и потребностей (expressive language - экспрессивная речь)', 'экспрессивную речь и использование языка для выражения мыслей и потребностей (expressive language)'),
              ('ASHA также рекомендует оценивать социальная коммуникация, инициирование общения', 'ASHA также рекомендует оценивать социальную коммуникацию, инициирование общения'),
              ('когда обычная речевой терапии «не сработала»', 'когда обычная речевая терапия «не сработала»'),
              ('эффекты на социальная коммуникация и другие области', 'эффекты на социальную коммуникацию и другие области'),
              ('Нужно знать конкретный вмешательство.', 'Нужно знать конкретное вмешательство.'),
              ('- очерёдность в разговоре\n- пониманием непонимания\n- уточнение', '- очерёдностью в разговоре\n- пониманием того, что собеседник не понял сообщение\n- уточнением'),
              ('- разбор сбои коммуникации', '- разбор сбоев коммуникации'),
              ('без постоянного зрительный контакт', 'без постоянного зрительного контакта'),
              ('**«будет смотреть в глаза 80% разговора»**\n\nсам по себе', '**«будет смотреть в глаза 80% разговора»**\n\nсама по себе'),
              ('- задержки словаря\n- трудности понимания языка\n- особенности социальной коммуникации.', '- задержки развития словаря\n- трудностей понимания языка\n- особенностей социальной коммуникации.'),
              ('несколько разных коммуникационные потребности', 'несколько разных коммуникационных потребностей'),
              ('Отдельно стоит относиться к неречевые орально-моторные упражнения.', 'Отдельно стоит относиться к неречевым орально-моторным упражнениям.'),
              ('Специалисты по речи и языку могут участвовать в:\n\n- AAC оценка\n- выборе системы коммуникации\n- словаря design\n- access method\n- обучении партнёров по коммуникации\n- мониторинг результата.', 'Специалисты по речи и языку могут участвовать в:\n\n- оценке потребностей в AAC\n- выборе системы коммуникации\n- проектировании и организации словаря\n- выборе способа доступа (access method)\n- обучении партнёров по коммуникации\n- мониторинге результата.'),
              ('принцип zero-exclusion approach - отсутствие исключающих критериев', 'принцип отсутствия исключающих критериев (zero-exclusion approach)'),
              ('NICE рекомендует вмешательство, которые помогают родителям, carers, teachers и сверстникам:\n\n- лучше понимать способы коммуникации ребёнка\n- быть более responsive', 'NICE рекомендует вмешательства, которые помогают родителям, ухаживающим взрослым, педагогам и сверстникам:\n\n- лучше понимать способы коммуникации ребёнка\n- быть более отзывчивыми и чувствительными к его способам общения'),
              ('## Visual supports\n\nVisual supports могут включать:\n\n- изображения\n- письменные инструкции\n- visual schedules\n- first-then supports\n- symbols\n- step-by-step sequences.\n\nNICE рекомендует визуальные средства как один из способов адаптации environment и processes of care.\n\nЭто support strategy.', '## Визуальные опоры (visual supports)\n\nВизуальные опоры могут включать:\n\n- изображения\n- письменные инструкции\n- визуальные расписания (visual schedules)\n- опоры «сначала - потом» (first-then supports)\n- символы\n- пошаговые последовательности.\n\nNICE рекомендует визуальные средства как один из способов адаптации среды и процессов оказания помощи.\n\nЭто стратегия поддержки.'),
              ('**«понимать двухэтапную инструкцию с visual support»**', '**«понимать двухэтапную инструкцию с визуальной опорой»**'),
