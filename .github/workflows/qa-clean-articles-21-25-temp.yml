              ('Mixed-methods systematic review 2025 года обнаружил положительные pooled effects на:\n\n- адаптивное поведение\n- daily living skills\n- language\n- совместного внимания.\n\nНо большинство исследований', 'Систематический обзор смешанных методов 2025 года (mixed-methods systematic review), который включал ранние интенсивные поведенческие вмешательства и NDBI, обнаружил положительные объединённые эффекты для:\n\n- адаптивного поведения\n- навыков повседневной жизни\n- языка\n- совместного внимания.\n\nЭти результаты нельзя приписывать только NDBI, потому что обзор объединял несколько типов вмешательств.\n\nНо большинство исследований'),
              ('- лучше замечать communication attempts\n- следовать интересу ребёнка\n- давать время\n- поддерживать shared engagement', '- лучше замечать попытки коммуникации\n- следовать интересу ребёнка\n- давать время\n- поддерживать совместную вовлечённость'),
