              ('В него входят разные programs и procedures.', 'В него входят разные программы и процедуры.'),
              ('- какой program\n- какой age\n- какой результат\n- какая intensity.', '- какая программа\n- какой возраст\n- какой результат\n- какая интенсивность.'),
              ('## Что показывал meta-analysis NDBI', '## Что показал метаанализ NDBI'),
