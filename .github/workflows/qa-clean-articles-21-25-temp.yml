              ('чтобы поддержать interaction.', 'чтобы поддержать взаимодействие.'),
              ('Эти interests можно использовать для:\n\n- вовлечённости\n- совместной игры\n- communication opportunities\n- обучения.\n\nНо интерес не нужно специально отбирать, чтобы потом использовать его как reward - награду.', 'Эти интересы можно использовать для:\n\n- вовлечённости\n- совместной игры\n- возможностей для коммуникации\n- обучения.\n\nНо интерес не нужно специально отбирать, чтобы потом использовать его как награду (reward).'),
