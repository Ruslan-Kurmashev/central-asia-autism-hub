name: Fetch Asian-context article visuals

on:
  push:
    branches: [fix/asian-context-visuals]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/asian-context-visuals

      - name: Download optimized Pexels photographs
        run: |
          mkdir -p public/images/editorial
          curl -fL 'https://images.pexels.com/photos/7898452/pexels-photo-7898452.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-creative-asian.jpg
          curl -fL 'https://images.pexels.com/photos/8297670/pexels-photo-8297670.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-adapted-cbt-asian.jpg
          curl -fL 'https://images.pexels.com/photos/7943196/pexels-photo-7943196.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-psychological-support-asian.jpg
          curl -fL 'https://images.pexels.com/photos/7417142/pexels-photo-7417142.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-technology-asian.jpg
          curl -fL 'https://images.pexels.com/photos/5691810/pexels-photo-5691810.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-caregiver-wellbeing-asian.jpg
          curl -fL 'https://images.pexels.com/photos/8055140/pexels-photo-8055140.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-cbt-asian.jpg
          curl -fL 'https://images.pexels.com/photos/7743763/pexels-photo-7743763.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-respite-asian.jpg
          curl -fL 'https://images.pexels.com/photos/7780915/pexels-photo-7780915.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-rubi-asian.jpg
          curl -fL 'https://images.pexels.com/photos/5094097/pexels-photo-5094097.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-who-cst-asian.jpg
          file public/images/editorial/article-*-asian.jpg
          du -h public/images/editorial/article-*-asian.jpg

      - name: Commit photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add Asian-context editorial photography"
          git push origin HEAD:fix/asian-context-visuals
