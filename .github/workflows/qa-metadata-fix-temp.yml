name: Temporary metadata QA fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add temporary metadata QA fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Align review metadata wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/content/pages/kz/ru/autism-assessments-kazakhstan.md')
          s = p.read_text(encoding='utf-8')
          old = 'Протоколы и порядок оказания помощи могут обновляться, поэтому материал запланирован к повторной проверке через шесть месяцев.'
          new = 'Протоколы и порядок оказания помощи могут обновляться, а протокол РАС №145 находится в запланированном окне пересмотра; поэтому материал запланирован к повторной проверке до конца 2026 года.'
          if old not in s:
              raise SystemExit('Expected evidenceLimitations text not found')
          s = s.replace(old, new)
          if '—' in s:
              raise SystemExit('Long dash found')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "AutismHub QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/pages/kz/ru/autism-assessments-kazakhstan.md
          git diff --cached --check
          git commit -m "Align autism assessment review metadata"
          git push origin main
