name: Temporary QA cleanup articles 11-15

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.event.head_commit.message == 'Final language cleanup articles 11-15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Final Russian terminology cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('src/content/pages/kz/ru')

          fixes = {
              'types-of-autism-support.md': [
                  ('До начала поддержки желательно определить исходную точку (baseline) - и заранее решить, когда вы будете пересматривать результат.',
                   'До начала поддержки желательно определить исходную точку (baseline) и заранее решить, когда вы будете пересматривать результат.'),
              ],
              'how-to-read-evidence.md': [
                  ('Использован для guideline position и примеров вмешательств, которые не следует использовать.',
                   'Использован для позиции клинической рекомендации и примеров вмешательств, которые не следует использовать.'),
              ],
          }

          for name, replacements in fixes.items():
              p = base / name
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {name}: {old}')
                  text = text.replace(old, new)
              if '—' in text:
                  raise SystemExit(f'Long dash found in {name}')
              p.write_text(text, encoding='utf-8')
          PY
          git config user.name "AutismHub QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/pages/kz/ru/types-of-autism-support.md src/content/pages/kz/ru/how-to-read-evidence.md
          git diff --cached --check
          git commit -m "Finish language cleanup articles 11-15"
          git push origin main
