name: Import licensed Pexels family reading photo
on:
  push:
    paths:
      - '.github/workflows/import-bilingual-family-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-stock-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify licensed family reading stock photo
        run: |
          set -eu
          mkdir -p public/images/editorial
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 'https://images.pexels.com/photos/7105614/pexels-photo-7105614.jpeg?auto=compress&cs=tinysrgb&w=1400&q=82' --output public/images/editorial/parent-bilingual-family-reading-pexels-7105614.jpg
          test "$(wc -c < public/images/editorial/parent-bilingual-family-reading-pexels-7105614.jpg)" -gt 16000
          file public/images/editorial/parent-bilingual-family-reading-pexels-7105614.jpg | grep -E 'JPEG image'
      - name: Commit imported stock photograph to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/editorial/parent-bilingual-family-reading-pexels-7105614.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Import Pexels family reading photo for bilingual parent guide'
            git push origin HEAD:main
          fi
