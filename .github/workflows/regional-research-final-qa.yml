name: Final regional research QA

on:
  push:
    paths:
      - '.github/workflows/regional-research-final-qa.yml'
      - 'src/layouts/ArticleLayout.astro'
      - 'src/content/pages/kz/ru/*.md'
      - 'scripts/check-regional-research-final.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-research-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check QA script syntax
        run: node --check scripts/check-regional-research-final.mjs
      - name: Build static pages
        run: npm run build
      - name: Test regional article reflow and external science URLs
        run: node scripts/check-regional-research-final.mjs
