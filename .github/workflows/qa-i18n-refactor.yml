name: QA milestone i18n refactor

on:
  push:
    branches:
      - content/development-milestones

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate draft branch
        run: npm run validate
      - name: Check milestone UI files for hard-coded Cyrillic text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('src/components/DevelopmentMilestoneAgeSelector.astro'),
              Path('src/components/MilestoneSheet.astro'),
              Path('src/pages/kz/[lang]/parents/[parentSlug]/[age].astro'),
          ]
          pattern = re.compile(r'[А-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]')
          failures = []
          for path in files:
              text = path.read_text()
              if pattern.search(text):
                  failures.append(str(path))
          if failures:
              raise SystemExit('Hard-coded Cyrillic UI text remains in:\n' + '\n'.join(failures))
          print('No hard-coded Cyrillic UI text remains in milestone components/routes.')
          PY
      - name: Prepare temporary published RU state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/content/pages/kz/ru/development-milestones.md')
          text = path.read_text()
          text = text.replace('translationStatus: pending', 'translationStatus: source', 1)
          text = text.replace('draft: true', 'draft: false\npublishedAt: 2026-09-13\nupdatedAt: 2026-09-13', 1)
          path.write_text(text)
          PY
      - name: Build temporary published state
        run: npm run build
      - name: Verify generated milestone routes and localized UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('dist/kz/ru/parents/orientiry-razvitiya-rebenka')
          ages = [
              '2-mesyatsa', '4-mesyatsa', '6-mesyatsev', '9-mesyatsev',
              '1-god', '15-mesyatsev', '18-mesyatsev', '2-goda',
              '2-5-goda', '3-goda', '4-goda', '5-let'
          ]
          expected = [base / 'index.html'] + [base / age / 'index.html' for age in ages]
          missing = [str(path) for path in expected if not path.exists()]
          if missing:
              raise SystemExit('Missing generated pages:\n' + '\n'.join(missing))
          sheet = (base / '18-mesyatsev' / 'index.html').read_text()
          required = [
              'Ориентиры развития в 18 месяцев',
              'Это лист наблюдений, а не тест.',
              'Варианты ответа',
              'CDC: ориентиры для возраста 18 месяцев',
          ]
          missing_copy = [value for value in required if value not in sheet]
          if missing_copy:
              raise SystemExit('Localized RU copy missing: ' + ', '.join(missing_copy))
          print('i18n render QA passed for 13 milestone pages.')
          PY
