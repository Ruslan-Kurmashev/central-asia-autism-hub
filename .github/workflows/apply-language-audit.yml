name: Apply milestone language audit corrections

on:
  push:
    branches:
      - content/development-milestones

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/development-milestones
      - name: Apply reviewed EN and KK wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def apply(path_str, replacements):
              path = Path(path_str)
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)

          apply('src/i18n/content.ts', [
              ("selectorInstruction: 'Балаңыздың жасына сәйкес кезеңді ашыңыз.'", "selectorInstruction: 'Балаңыздың қазіргі жасына сәйкес парақты ашыңыз.'"),
              ("pageTitleTemplate: 'Даму бағдарлары: {age}'", "pageTitleTemplate: 'Даму кезеңдері: {age}'"),
              ("pageDescriptionTemplate: 'Ата-аналарға арналған бақылау парағы: {age} кезеңіндегі баланың даму бағдарлары. Материал диагностикалық тест емес.'", "pageDescriptionTemplate: 'Ата-аналарға арналған бақылау парағы: {age} кезеңіндегі баланың даму кезеңдері. Материал диагностикалық тест емес.'"),
              ("breadcrumbLabel: 'Даму бағдарлары'", "breadcrumbLabel: 'Даму кезеңдері'"),
              ("sourceLinkTemplate: 'CDC: {age} кезеңіне арналған даму бағдарлары'", "sourceLinkTemplate: 'CDC: {age} кезеңіне арналған даму кезеңдері'"),
          ])

          apply('src/data/development-milestones.en.ts', [
              ("parentTitle: 'How children develop from 2 months to 5 years: developmental milestones for parents'", "parentTitle: 'Child development from 2 months to 5 years: milestones for parents'"),
              ("{ id: '9m-name', title: 'Looks or turns toward you when you call their name' }", "{ id: '9m-name', title: 'Looks when you call their name' }"),
              ("{ id: '15m-affection', title: 'Shows affection to familiar people, for example by hugging or cuddling' }", "{ id: '15m-affection', title: 'Shows you affection, such as hugging, cuddling, or kissing you' }"),
              ("{ id: '15m-direction', title: 'Follows a simple direction when words are combined with a gesture' }", "{ id: '15m-direction', title: 'Follows directions given with both a gesture and words' }"),
              ("{ id: '15m-stack', title: 'Stacks one small object on top of another' }", "{ id: '15m-stack', title: 'Stacks at least two small objects, such as blocks' }"),
              ("{ id: '18m-walks', title: 'Walks without holding on' }", "{ id: '18m-walks', title: 'Walks without holding on to anyone or anything' }"),
              ("{ id: '18m-cup', title: 'Drinks from a cup without a lid', note: 'Some spilling is common at this age.' }", "{ id: '18m-cup', title: 'Drinks from a cup without a lid and may spill sometimes' }"),
              ("{ id: '24m-book', title: 'Points to an item in a book when you ask about it' }", "{ id: '24m-book', title: 'Points to things in a book when you ask, such as “Where is the bear?”' }"),
              ("{ id: '24m-two-words', title: 'Says at least two words together, such as “more milk” or “mama go”' }", "{ id: '24m-two-words', title: 'Says at least two words together, such as “More milk.”' }"),
              ("{ id: '24m-body', title: 'Points to at least two body parts when you name them' }", "{ id: '24m-body', title: 'Points to at least two body parts when you ask them to show you' }"),
              ("{ id: '24m-gestures', title: 'Uses more gestures than just waving and pointing' }", "{ id: '24m-gestures', title: 'Uses more gestures than just waving and pointing, such as blowing a kiss or nodding yes' }"),
              ("{ id: '30m-look', title: 'Shows you what they can do by saying “Look at me!” or something similar' }", "{ id: '30m-look', title: 'Shows you what they can do by saying “Look at me!”' }"),
              ("{ id: '30m-routine', title: 'Follows a simple familiar routine when reminded' }", "{ id: '30m-routine', title: 'Follows simple routines when told, such as helping to pick up toys when you say, “It’s clean-up time.”' }"),
              ("{ id: '30m-action', title: 'Says two or more words together, including an action word, such as “doggie runs”' }", "{ id: '30m-action', title: 'Says two or more words together, with one action word, such as “Doggie run”' }"),
              ("{ id: '30m-pretend', title: 'Uses objects in pretend play, such as pretending a block is food' }", "{ id: '30m-pretend', title: 'Uses things to pretend, such as feeding a block to a doll as if it were food' }"),
              ("{ id: '30m-two-step', title: 'Follows a two-step direction' }", "{ id: '30m-two-step', title: 'Follows two-step instructions, such as “Put the toy down and close the door.”' }"),
              ("{ id: '30m-twist', title: 'Twists things such as doorknobs or suitable lids' }", "{ id: '30m-twist', title: 'Uses hands to twist things, such as turning doorknobs or unscrewing lids' }"),
              ("{ id: '3y-calms', title: 'Usually calms down within about 10 minutes after you leave' }", "{ id: '3y-calms', title: 'Calms down within 10 minutes after you leave, such as at a childcare drop-off' }"),
              ("{ id: '3y-conversation', title: 'Has a conversation with at least two back-and-forth exchanges' }", "{ id: '3y-conversation', title: 'Talks with you in conversation using at least two back-and-forth exchanges' }"),
              ("{ id: '3y-picture', title: 'Says what is happening in a picture or book, such as “running” or “eating”' }", "{ id: '3y-picture', title: 'Says what action is happening in a picture or book when asked, such as “running” or “eating”' }"),
              ("{ id: '3y-hot', title: 'Avoids touching a hot object after you warn them' }", "{ id: '3y-hot', title: 'Avoids touching hot objects, such as a stove, when you warn them' }"),
              ("{ id: '3y-string', title: 'Strings large safe items together, such as large beads' }", "{ id: '3y-string', title: 'Strings items together, such as large beads or macaroni' }"),
              ("{ id: '4y-children', title: 'Asks to go play with other children' }", "{ id: '4y-children', title: 'Asks to go play with children if none are around' }"),
              ("{ id: '4y-danger', title: 'Avoids some obvious dangers' }", "{ id: '4y-danger', title: 'Avoids danger, such as not jumping from tall heights at the playground' }"),
              ("{ id: '5y-story', title: 'Tells a story with at least two connected events' }", "{ id: '5y-story', title: 'Tells a story they heard or made up with at least two events' }"),
              ("{ id: '5y-attention', title: 'Pays attention for about 5-10 minutes during activities, not including screen time' }", "{ id: '5y-attention', title: 'Pays attention for 5-10 minutes during activities, such as story time or arts and crafts; screen time does not count' }"),
          ])

          apply('src/data/development-milestones.kk.ts', [
              ("parentTitle: 'Баланың 2 айдан 5 жасқа дейінгі дамуы: ата-аналарға арналған даму бағдарлары'", "parentTitle: 'Баланың 2 айдан 5 жасқа дейінгі дамуы: ата-аналарға арналған даму кезеңдері'"),
              ("optionObserved: 'Бақылаймын'", "optionObserved: 'Байқаймын'"),
              ("'Бұл даму бағдарлары CDC Learn the Signs. Act Early. бағдарламасына негізделген.", "'Бұл даму кезеңдері CDC Learn the Signs. Act Early. бағдарламасына негізделген."),
              ("title: 'Сіз жақындағанда қуанышты реакция көрсетеді'", "title: 'Сіз жақындағанда қуанғанын білдіреді'"),
              ("title: '«А-а» немесе «у-у» сияқты дыбыстар шығарып былдырлайды'", "title: '«А-а» немесе «у-у» сияқты дыбыстар шығарады'"),
              ("title: 'Бейтаныс адамдардан именуі, жабысып қалуы немесе қорқуы мүмкін'", "title: 'Бейтаныс адамдардан именуі, сізге жабыса түсуі немесе қорқуы мүмкін'"),
              ("title: 'Атын атағанда сізге қарайды немесе сіз жаққа бұрылады'", "title: 'Атын атағанда қарайды немесе бұрылады'"),
              ("title: 'Өздігінен отыру қалпына келеді'", "title: 'Өздігінен отырып алады'"),
              ("title: 'Жиһаздан ұстап жүріп қозғалады'", "title: 'Жиһаздан ұстап жүреді'"),
              ("title: 'Жақын адамдарға мейірімін көрсетеді, мысалы құшақтайды немесе еркелеп жақындайды'", "title: 'Сізге мейірімін көрсетеді, мысалы құшақтайды, еркелеп жақындайды немесе сүйеді'"),
              ("title: 'Қолын жууға дайындағанда қолдарын алға созады'", "title: 'Қолын жуып беруіңіз үшін қолдарын созады'"),
              ("title: 'Ойыншықтарды қарапайым түсінікті тәсілмен қолданады, мысалы машинаны жүргізеді'", "title: 'Ойыншықтармен қарапайым түрде ойнайды, мысалы машинаны жүргізеді'"),
              ("{ id: '18m-walks', title: 'Тірексіз өздігінен жүреді' }", "{ id: '18m-walks', title: 'Ешкімнен немесе ешнәрседен ұстамай жүреді' }"),
              ("{ id: '18m-cup', title: 'Қақпағы жоқ кеседен ішеді', note: 'Бұл жаста аздап төгіп алу қалыпты болуы мүмкін.' }", "{ id: '18m-cup', title: 'Қақпағы жоқ кеседен ішеді, кейде төгіп алуы мүмкін' }"),
              ("title: 'Басқа адамның ауырғанын немесе мұңайғанын байқайды'", "title: 'Басқа адамның ауырғанын немесе ренжігенін байқайды'"),
              ("title: 'Кітаптағы зат туралы сұрағанда оны саусағымен көрсетеді'", "title: 'Кітаптағы затты сұрағанда көрсетеді, мысалы «Аю қайда?» дегенде'"),
              ("title: 'Кемінде екі сөзді біріктіреді, мысалы «тағы сүт» немесе «мама бар»'", "title: 'Кемінде екі сөзді біріктіреді, мысалы «тағы сүт» немесе «мама кел»'"),
              ("title: 'Атағанда дененің кемінде екі бөлігін көрсетеді'", "title: 'Сұрағанда дененің кемінде екі бөлігін көрсетеді'"),
              ("title: 'Қол бұлғау мен саусақпен көрсетуден басқа да ым-ишараларды қолданады'", "title: 'Қол бұлғау мен саусақпен көрсетуден басқа да ым-ишараларды қолданады, мысалы сүйіп қоштасады немесе басын изейді'"),
              ("title: 'Не істей алатынын сізге көрсетеді, мысалы «Қара!» дейді'", "title: 'Не істей алатынын «Маған қара!» деп сізге көрсетеді'"),
              ("title: 'Еске салғаннан кейін таныс қарапайым күн тәртібін орындайды'", "title: 'Айтқанда қарапайым күнделікті әрекетті орындайды, мысалы «Жинау уақыты» дегенде ойыншықтарды жинауға көмектеседі'"),
              ("title: 'Екі кезекті әрекеттен тұратын өтінішті орындайды'", "title: 'Екі қадамнан тұратын нұсқауды орындайды, мысалы «Ойыншықты қой да, есікті жап»'"),
              ("title: 'Тұтқаларды бұрады және қолайлы қақпақтарды бұрап ашады'", "title: 'Тұтқаларды бұрады немесе қақпақтарды бұрап ашады'"),
              ("title: 'Ата-анасы кеткеннен кейін шамамен 10 минут ішінде әдетте тынышталады'", "title: 'Сіз кеткеннен кейін, мысалы балабақшада қалдырғанда, 10 минут ішінде тынышталады'"),
              ("title: 'Кемінде екі рет кезектесіп жауап алмасатын қысқа әңгімеге қатысады'", "title: 'Сізбен кемінде екі рет кезектесіп сөйлесетін әңгімеге қатысады'"),
              ("title: 'Суретте не болып жатқанын айта алады, мысалы «жүгіріп жүр» немесе «жеп отыр»'", "title: 'Сұрағанда суретте немесе кітапта қандай әрекет болып жатқанын айтады, мысалы «жүгіріп жүр» немесе «жеп отыр»'"),
              ("title: 'Ескерткеннен кейін ыстық затқа қол тигізуден сақтанады'", "title: 'Ескерткенде плита сияқты ыстық заттарға қол тигізбейді'"),
              ("title: 'Басқа балалармен ойнауға сұранады'", "title: 'Жанында басқа балалар болмаса, олармен ойнауға барғысы келетінін айтады'"),
              ("title: 'Кейбір анық қауіпті әрекеттерден сақтанады'", "title: 'Қауіптен сақтанады, мысалы ойын алаңында биіктен секірмейді'"),
              ("title: 'Адамды кемінде үш дене бөлігімен салады'", "title: 'Адамның суретін кемінде үш дене бөлігімен салады'"),
              ("title: 'Қарындашты немесе борды жұдырықпен емес, саусақтары мен бас бармағының арасында ұстайды'", "title: 'Қарындашты немесе борды жұдырықтап емес, саусақтары мен бас бармағының көмегімен ұстайды'"),
              ("title: 'Кемінде екі байланысты оқиғадан тұратын қысқа әңгіме айтады'", "title: 'Естіген немесе өзі ойлап тапқан кемінде екі оқиғадан тұратын әңгіме айтады'"),
              ("title: 'Қарапайым ұйқастарды таниды немесе қолданады'", "title: 'Қарапайым ұйқастарды қолданады немесе таниды'"),
              ("title: 'Экран уақытын есептемегенде, бір әрекетке шамамен 5-10 минут зейін қояды'", "title: 'Экран уақытын есептемегенде, кітап тыңдау немесе сурет салу сияқты әрекетке 5-10 минут зейін қояды'"),
          ])

          apply('src/content/pages/kz/en/development-milestones.md', [
              ('title: "How children develop from 2 months to 5 years: developmental milestones for parents"', 'title: "Child development from 2 months to 5 years: milestones for parents"'),
              ('Important: **developmental milestones are not an exam, not an autism test, and not a way to make a diagnosis yourself**. One skill that your child does not yet show does not by itself mean that your child has a developmental condition.', 'Important: **developmental milestones are not a test for autism and cannot be used to make a diagnosis on their own**. The fact that your child is not yet showing one skill does not by itself mean they have a developmental condition.'),
              ('The site does not send your marks or notes to a server and does not intentionally save them.', 'The site does not send your marks or notes to a server and does not save them.'),
          ])

          kk_path = Path('src/content/pages/kz/kk/development-milestones.md')
          kk = kk_path.read_text()
          kk = kk.replace('даму бағдарлары', 'даму кезеңдері')
          kk = kk.replace('Даму бағдарлары', 'Даму кезеңдері')
          kk = kk.replace('**✅ Бақылаймын**', '**✅ Байқаймын**')
          kk = kk.replace('Әр бағдар үшін үш нұсқаның бірін таңдауға болады:', 'Әр тармақ үшін үш нұсқаның бірін таңдауға болады:')
          kk = kk.replace('Тұрмыстық мысалдар бағдардың нені білдіретінін түсінуге көмектеседі.', 'Күнделікті мысалдар әр тармақтың нені білдіретінін түсінуге көмектеседі.')
          kk = kk.replace('Сайт енгізілген белгілер мен жазбаларды серверге жібермейді және оларды арнайы сақтамайды.', 'Сайт енгізілген белгілер мен жазбаларды серверге жібермейді және сақтамайды.')
          kk = kk.replace('https://www.unicef.org/kazakhstan/documents/%D1%80%D0%B0%D1%81%D1%82%D0%B5%D0%BC-%D0%B8-%D1%80%D0%B0%D0%B7%D0%B2%D0%B8%D0%B2%D0%B0%D0%B5%D0%BC%D1%81%D1%8F-%D0%B2%D0%BC%D0%B5%D1%81%D1%82%D0%B5', 'https://www.unicef.org/kazakhstan/kk/documents/%D0%B1%D1%96%D1%80%D0%B3%D0%B5-%D3%A9%D1%81%D1%96%D0%BF-%D0%B1%D1%96%D1%80%D0%B3%D0%B5-%D0%B4%D0%B0%D0%BC%D0%B8%D0%BC%D1%8B%D0%B7')
          kk_path.write_text(kk)
          PY
      - name: Commit reviewed wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/content.ts src/data/development-milestones.en.ts src/data/development-milestones.kk.ts src/content/pages/kz/en/development-milestones.md src/content/pages/kz/kk/development-milestones.md
          git diff --cached --check
          git commit -m "Refine English and Kazakh milestone language"
          git push origin HEAD:content/development-milestones
