name: Public counter API smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

jobs:
  counter-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check counter API response and CORS
        run: node scripts/check-public-counter-endpoint.mjs
