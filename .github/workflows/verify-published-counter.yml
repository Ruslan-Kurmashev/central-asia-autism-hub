name: Verify published page-view counter

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check root opens the homepage without a language selection screen
        shell: bash
        run: |
          set -euo pipefail
          url="https://ruslan-kurmashev.github.io/central-asia-autism-hub/?root_verify=${GITHUB_RUN_ID}"
          passed=0
          for attempt in $(seq 1 10); do
            html="$(curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "${url}" || true)"
            if [[ "${html}" == *'id="home-v2-title"'* && "${html}" == *'home-v2__hero'* && "${html}" == *'language-switcher'* && "${html}" != *'Choose your language'* ]]; then
              printf 'PASS root: full platform homepage and language switcher displayed directly\n'
              passed=1
              break
            fi
            sleep 4
          done
          if [[ "${passed}" -ne 1 ]]; then
            printf 'FAIL root: homepage missing or old language screen present\n' >&2
            exit 1
          fi
      - name: Check public RU KK EN pages serve the counter
        shell: bash
        run: |
          set -euo pipefail
          base='https://ruslan-kurmashev.github.io/central-asia-autism-hub'
          for lang in ru kk en; do
            url="${base}/kz/${lang}/?counter_verify=${GITHUB_RUN_ID}"
            success=0
            for attempt in $(seq 1 10); do
              html="$(curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "${url}" || true)"
              if [[ "${html}" == *'data-public-counter'* && "${html}" == *'https://hits.sh/'* && "${html}" == *'data-badge-url'* ]]; then
                printf 'PASS %s: public HTML contains shared SVG counter\n' "${lang}"
                success=1
                break
              fi
              sleep 4
            done
            if [[ "${success}" -ne 1 ]]; then
              printf 'FAIL %s: public HTML does not yet contain the counter\n' "${lang}" >&2
              exit 1
            fi
          done

      - name: Verify public regional research photographs
        shell: bash
        run: |
          set -euo pipefail
          base='https://ruslan-kurmashev.github.io/central-asia-autism-hub'
          records=(
            'autizm-v-centralnoy-azii-statistika-pyati-stran research-literacy-critical-reading-highlighter.jpg central-asia-autism-five-countries-evidence-map.svg'
            'budushchee-issledovaniy-autizma-v-centralnoy-azii research-literacy-study-designs-research-team.jpg central-asia-autism-future-research-roadmap.svg'
            'issledovaniya-autizma-kazahstan-centralnaya-aziya research-literacy-study-process-lab-notes.jpg central-asia-autism-research-timeline-cover.svg'
            'pochemu-rastet-chislo-diagnozov-autizma-v-kazahstane research-literacy-correlation-chart-review.jpg kazakhstan-autism-registration-pathway.svg'
            'psihologicheskoe-blagopoluchie-roditeley-autizm-kazahstan research-literacy-contradictions-review-team.jpg kazakhstan-autism-caregiver-mental-health-2018.svg'
            'rannee-vyyavlenie-autizma-v-kazahstane parent-development-observation-notes.jpg kazakhstan-autism-early-detection-pathway.svg'
            'regiony-kazahstana-registraciya-autizma research-literacy-statistics-textbook.jpg kazakhstan-regional-autism-registration-2025.svg'
            'statistika-autizma-kazahstan-2020-2026 research-literacy-graphs-paper-report.jpg autism-kazakhstan-registered-2020-2024.svg'
            'trudnosti-semey-detey-s-autizmom-v-kazahstane kz-help-007.jpg kazakhstan-asd-family-support-survey-2025.svg'
          )
          listing="$(curl -fsSL --retry 3 --max-time 20 "${base}/kz/ru/research/topics/kazakhstan-research/?image_check=${GITHUB_RUN_ID}")"
          for item in "${records[@]}"; do
            read -r slug photo chart <<< "${item}"
            image_path="${base}/images/editorial/photos/${photo}"
            html="$(curl -fsSL --retry 3 --max-time 20 "${base}/kz/ru/research/${slug}/?image_check=${GITHUB_RUN_ID}")"
            [[ "${html}" == *"/images/editorial/photos/${photo}"* ]] || { echo "FAIL article cover: ${slug}"; exit 1; }
            [[ "${html}" == *"/images/research/${chart}"* ]] || { echo "FAIL original figure missing: ${slug}"; exit 1; }
            [[ "${listing}" == *"/images/editorial/photos/${photo}"* ]] || { echo "FAIL catalogue thumb: ${slug}"; exit 1; }
            image_status="$(curl -Ls -o /dev/null --max-time 20 -w '%{http_code}' "${image_path}")"
            [[ "${image_status}" == '200' ]] || { echo "FAIL image HTTP ${image_status}: ${photo}"; exit 1; }
            echo "PASS regional science cover: ${slug}"
          done
