name: Import licensed self-care dressing photos
on:
  push:
    paths:
      - '.github/workflows/import-selfcare-shirt-photo-sequence.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-stock-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download authentic Pexels photographic source images
        run: |
          set -euo pipefail
          mkdir -p public/images/editorial
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 140 'https://images.pexels.com/photos/7104238/pexels-photo-7104238.jpeg?auto=compress&cs=tinysrgb&w=1200&q=82' --output public/images/editorial/selfcare-shirt-step-7104238.jpg
          test "$(wc -c < public/images/editorial/selfcare-shirt-step-7104238.jpg)" -gt 20000
          file public/images/editorial/selfcare-shirt-step-7104238.jpg | grep -q 'JPEG image'
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 140 'https://images.pexels.com/photos/7220910/pexels-photo-7220910.jpeg?auto=compress&cs=tinysrgb&w=1200&q=82' --output public/images/editorial/selfcare-shirt-step-7220910.jpg
          test "$(wc -c < public/images/editorial/selfcare-shirt-step-7220910.jpg)" -gt 20000
          file public/images/editorial/selfcare-shirt-step-7220910.jpg | grep -q 'JPEG image'
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 140 'https://images.pexels.com/photos/7943242/pexels-photo-7943242.jpeg?auto=compress&cs=tinysrgb&w=1200&q=82' --output public/images/editorial/selfcare-shirt-step-7943242.jpg
          test "$(wc -c < public/images/editorial/selfcare-shirt-step-7943242.jpg)" -gt 20000
          file public/images/editorial/selfcare-shirt-step-7943242.jpg | grep -q 'JPEG image'
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 140 'https://images.pexels.com/photos/5715080/pexels-photo-5715080.jpeg?auto=compress&cs=tinysrgb&w=1200&q=82' --output public/images/editorial/selfcare-shirt-step-5715080.jpg
          test "$(wc -c < public/images/editorial/selfcare-shirt-step-5715080.jpg)" -gt 20000
          file public/images/editorial/selfcare-shirt-step-5715080.jpg | grep -q 'JPEG image'
      - name: Commit photographs to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/editorial/selfcare-shirt-step-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Import four licensed Pexels stock photos for self-care dressing guide'
            git push origin HEAD:main
          fi
