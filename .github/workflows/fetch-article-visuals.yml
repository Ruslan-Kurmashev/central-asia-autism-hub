name: Fetch article visuals

on:
  push:
    branches: [feature/unified-article-visuals]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/unified-article-visuals

      - name: Download optimized Pexels photographs
        run: |
          mkdir -p public/images/editorial
          curl -fL 'https://images.pexels.com/photos/8382363/pexels-photo-8382363.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-creative-art.jpg
          curl -fL 'https://images.pexels.com/photos/7447261/pexels-photo-7447261.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-family-therapy.jpg
          curl -fL 'https://images.pexels.com/photos/7078782/pexels-photo-7078782.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-family-rest.jpg
          curl -fL 'https://images.pexels.com/photos/5336939/pexels-photo-5336939.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-family-session.jpg
          curl -fL 'https://images.pexels.com/photos/39999216/pexels-photo-39999216.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-forest-walk.jpg
          curl -fL 'https://images.pexels.com/photos/7447259/pexels-photo-7447259.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/article-parent-training.jpg
          file public/images/editorial/article-*.jpg
          du -h public/images/editorial/article-*.jpg

      - name: Commit photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add article-specific editorial photography"
          git push origin HEAD:feature/unified-article-visuals
