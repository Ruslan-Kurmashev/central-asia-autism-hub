name: Import licensed Pexels editorial image
on:
  push:
    paths:
      - '.github/workflows/import-parent-context-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-stock-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate Pexels photograph
        run: |
          set -eu
          mkdir -p public/images/editorial
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 'https://images.pexels.com/photos/7780915/pexels-photo-7780915.jpeg?auto=compress&cs=tinysrgb&w=1400&q=82' --output public/images/editorial/parent-context-home-preschool-pexels-7780915.jpg
          test "$(wc -c < public/images/editorial/parent-context-home-preschool-pexels-7780915.jpg)" -gt 16000
          file public/images/editorial/parent-context-home-preschool-pexels-7780915.jpg | grep -E 'JPEG image'
      - name: Commit photograph into main repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/editorial/parent-context-home-preschool-pexels-7780915.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add Pexels parent and child stock photo for context article'
            git push origin HEAD:main
          fi
