name: Import licensed regional-context parent reading photo
on:
  push:
    paths:
      - '.github/workflows/import-regional-bilingual-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify Pexels editorial photograph
        run: |
          set -eu
          mkdir -p public/images/editorial
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 'https://images.pexels.com/photos/5094108/pexels-photo-5094108.jpeg?auto=compress&cs=tinysrgb&w=1400&q=83' --output public/images/editorial/parent-bilingual-reading-pexels-5094108.jpg
          test "$(wc -c < public/images/editorial/parent-bilingual-reading-pexels-5094108.jpg)" -gt 16000
          file public/images/editorial/parent-bilingual-reading-pexels-5094108.jpg | grep -E 'JPEG image'
      - name: Commit photo to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/editorial/parent-bilingual-reading-pexels-5094108.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Import license-verified family reading stock photograph'
            git push origin HEAD:main
          fi
