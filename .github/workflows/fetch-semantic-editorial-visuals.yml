name: Fetch semantic editorial visuals

on:
  push:
    branches: [feature/kazakhstan-semantic-visuals]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/kazakhstan-semantic-visuals

      - name: Download optimized free Pexels photographs
        run: |
          mkdir -p public/images/editorial
          curl -fL 'https://images.pexels.com/photos/29446275/pexels-photo-29446275.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/kz-creative-dombyra.jpg
          curl -fL 'https://images.pexels.com/photos/5712455/pexels-photo-5712455.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/adapted-cbt-notebook.jpg
          curl -fL 'https://images.pexels.com/photos/6373808/pexels-photo-6373808.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/psychological-support-room.jpg
          curl -fL 'https://images.pexels.com/photos/6177679/pexels-photo-6177679.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/technology-tablet.jpg
          curl -fL 'https://images.pexels.com/photos/20205808/pexels-photo-20205808.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/caregiver-wellbeing-tea-book.jpg
          curl -fL 'https://images.pexels.com/photos/5831667/pexels-photo-5831667.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/cbt-notebook-pen.jpg
          curl -fL 'https://images.pexels.com/photos/33851736/pexels-photo-33851736.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/kz-respite-alma-arasan.jpg
          curl -fL 'https://images.pexels.com/photos/19693883/pexels-photo-19693883.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/rubi-wooden-blocks.jpg
          curl -fL 'https://images.pexels.com/photos/29857262/pexels-photo-29857262.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/who-cst-cards-books.jpg
          file public/images/editorial/{kz-creative-dombyra,adapted-cbt-notebook,psychological-support-room,technology-tablet,caregiver-wellbeing-tea-book,cbt-notebook-pen,kz-respite-alma-arasan,rubi-wooden-blocks,who-cst-cards-books}.jpg
          du -h public/images/editorial/{kz-creative-dombyra,adapted-cbt-notebook,psychological-support-room,technology-tablet,caregiver-wellbeing-tea-book,cbt-notebook-pen,kz-respite-alma-arasan,rubi-wooden-blocks,who-cst-cards-books}.jpg

      - name: Commit photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add semantic Kazakhstan-context editorial visuals"
          git push origin HEAD:feature/kazakhstan-semantic-visuals
