name: One-time article punctuation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-article-punctuation.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: contains(github.event.head_commit.message, 'Run one-time punctuation cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Replace prose punctuation in all articles
        run: node scripts/check-article-punctuation.mjs --fix

      - name: Verify all content files
        run: node scripts/check-article-punctuation.mjs

      - name: Commit only article content changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/pages src/content/research src/content/learning
          if git diff --cached --quiet; then
            echo "All article punctuation was already normalized."
          else
            git commit -m "Normalize remaining prose semicolons in all AutismHub articles"
            git push origin HEAD:main
          fi
