name: Temporary lockfile refresh output

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh-lock:
    if: github.head_ref == 'qa/external-links-dependencies-accessibility-20261010' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Regenerate lock against patched Astro
        run: |
          npm install astro@7.3.8 --save-exact --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Return refreshed dependency manifests for reviewed commit
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = readFileSync('package-lock.json', 'utf8');
          for (const line of lock.split('\n')) console.log('QA_LOCK_LINE ' + JSON.stringify(line));
          console.log('QA_PACKAGE_CONTENT ' + JSON.stringify(readFileSync('package.json', 'utf8')));
          NODE
