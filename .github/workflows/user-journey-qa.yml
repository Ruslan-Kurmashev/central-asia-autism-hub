name: User journey browser QA

on:
  pull_request:
    branches: [main]
  push:
    paths:
      - '.github/workflows/user-journey-qa.yml'
      - 'scripts/check-user-journeys.mjs'
      - 'docs/AUTISMHUB_VISUAL_STYLE.md'
      - 'src/components/**'
      - 'src/scripts/site-search-client.js'
      - 'src/styles/**'
      - 'src/pages/**'
      - 'src/content/pages/**'
      - 'src/content/research/**'
      - 'src/content/learning/**'
      - 'public/images/**'
      - 'scripts/find-changed-pages.mjs'
      - 'src/data/kazakhstan-announcements.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check visitor QA script syntax
        run: node --check scripts/check-user-journeys.mjs
      - name: Build three-language static site
        run: npm run build
      - name: Resolve changed published article and course URLs
        env:
          QA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/find-changed-pages.mjs
      - name: Run user journeys and changed-page QA in Chromium
        run: node scripts/check-user-journeys.mjs
      - name: Upload homepage and article screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autismhub-browser-screenshots
          path: docs/audit-results/site-browser-snapshots/
          if-no-files-found: warn
          retention-days: 14
