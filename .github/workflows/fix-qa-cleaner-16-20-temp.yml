name: Fix temporary QA cleaner 16-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-qa-cleaner-16-20-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fix exact source phrase in QA cleaner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/qa-clean-articles-16-20-temp.yml')
          text = path.read_text(encoding='utf-8')
          old = "('- уменьшать ненужных подсказок', '- уменьшать количество ненужных подсказок')"
          new = "('- уменьшать ненужные подсказок', '- уменьшать количество ненужных подсказок')"
          if old not in text:
              raise SystemExit('Expected QA cleaner phrase not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "AutismHub QA"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/qa-clean-articles-16-20-temp.yml
          git commit -m "Fix articles 16-20 QA cleaner phrase"
          git push origin HEAD:main
