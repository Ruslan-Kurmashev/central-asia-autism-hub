name: Finalize development milestones publication

on:
  push:
    branches:
      - content/development-milestones

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/development-milestones
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set publication metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'ru': ('src/content/pages/kz/ru/development-milestones.md', 'source'),
              'kk': ('src/content/pages/kz/kk/development-milestones.md', 'checked'),
              'en': ('src/content/pages/kz/en/development-milestones.md', 'checked'),
          }
          for lang, (path_str, status) in files.items():
              path = Path(path_str)
              text = path.read_text()
              if 'translationStatus: pending' not in text:
                  raise SystemExit(f'{lang}: expected pending translation status')
              if 'draft: true' not in text:
                  raise SystemExit(f'{lang}: expected draft true')
              text = text.replace('translationStatus: pending', f'translationStatus: {status}', 1)
              text = text.replace(
                  'draft: true',
                  'publishedAt: 2026-09-13\nupdatedAt: 2026-09-13\nreviewDueAt: 2027-09-13\ndraft: false',
                  1,
              )
              path.write_text(text)
          PY
      - name: Validate production state
        run: npm run validate
      - name: Verify published multilingual routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = {
              'ru': ('orientiry-razvitiya-rebenka', ['2-mesyatsa','4-mesyatsa','6-mesyatsev','9-mesyatsev','1-god','15-mesyatsev','18-mesyatsev','2-goda','2-5-goda','3-goda','4-goda','5-let']),
              'kk': ('balanyn-damu-bagdarlary', ['2-ai','4-ai','6-ai','9-ai','1-zhyl','15-ai','18-ai','2-zhyl','2-5-zhyl','3-zhyl','4-zhyl','5-zhyl']),
              'en': ('child-development-milestones', ['2-months','4-months','6-months','9-months','1-year','15-months','18-months','2-years','30-months','3-years','4-years','5-years']),
          }
          expected = []
          for lang, (root, ages) in roots.items():
              base = Path('dist/kz') / lang / 'parents' / root
              expected.append(base / 'index.html')
              expected.extend(base / age / 'index.html' for age in ages)
          missing = [str(p) for p in expected if not p.exists()]
          if missing:
              raise SystemExit('Missing published routes:\n' + '\n'.join(missing))
          if len(expected) != 39:
              raise SystemExit(f'Expected 39 pages, got {len(expected)}')
          print('All 39 multilingual development milestone pages generated successfully.')
          PY
      - name: Commit publication metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/pages/kz/ru/development-milestones.md src/content/pages/kz/kk/development-milestones.md src/content/pages/kz/en/development-milestones.md
          git diff --cached --check
          git commit -m "Publish multilingual development milestones"
          git push origin HEAD:content/development-milestones
