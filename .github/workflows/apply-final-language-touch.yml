name: Apply final milestone language correction

on:
  push:
    branches:
      - content/development-milestones

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/development-milestones
      - name: Refine Kazakh 30 month intro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/data/development-milestones.kk.ts')
          text = path.read_text()
          old = 'Көптеген балалар көбірек сөзді біріктіреді, екі қадамнан тұратын өтініштерді орындайды және басқа балалардың жанында немесе олармен бірге ойнайды.'
          new = 'Көптеген балалар көбірек сөзді біріктіреді, екі қадамнан тұратын нұсқауларды орындайды және басқа балалардың жанында немесе олармен бірге ойнайды.'
          if old not in text:
              raise SystemExit('Expected Kazakh intro text not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/development-milestones.kk.ts
          git diff --cached --check
          git commit -m "Refine final Kazakh milestone wording"
          git push origin HEAD:content/development-milestones
