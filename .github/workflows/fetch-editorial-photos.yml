name: Fetch editorial photos

on:
  push:
    branches: [feature/homepage-editorial-photos]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/homepage-editorial-photos

      - name: Download optimized Pexels photographs
        run: |
          mkdir -p public/images/editorial
          curl -fL 'https://images.pexels.com/photos/36698020/pexels-photo-36698020.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/family-tablet.jpg
          curl -fL 'https://images.pexels.com/photos/5094676/pexels-photo-5094676.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/parent-child-drawing.jpg
          curl -fL 'https://images.pexels.com/photos/8435776/pexels-photo-8435776.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/sensory-hands.jpg
          curl -fL 'https://images.pexels.com/photos/8422103/pexels-photo-8422103.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/children-stretching.jpg
          curl -fL 'https://images.pexels.com/photos/7880777/pexels-photo-7880777.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/parent-child-conversation.jpg
          curl -fL 'https://images.pexels.com/photos/4874928/pexels-photo-4874928.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/family-reading.jpg
          curl -fL 'https://images.pexels.com/photos/12788474/pexels-photo-12788474.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/family-meal.jpg
          curl -fL 'https://images.pexels.com/photos/9574355/pexels-photo-9574355.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop' -o public/images/editorial/research-lab.jpg
          file public/images/editorial/*
          du -h public/images/editorial/*

      - name: Commit photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add free editorial photography"
          git push origin HEAD:feature/homepage-editorial-photos
