name: Build article design preview

on:
  push:
    branches: [design-v2-article]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v7
        with:
          name: refreshed-package-lock
          path: package-lock.json
      - name: Clean install
        run: npm ci
      - name: Validate
        run: npm run validate
