name: Validate pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content, types, build, and internal links
        run: npm run validate

      - name: Install browser QA tooling (research QA branch only)
        if: github.head_ref == 'qa/research-explainer-integration-20261009'
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Browser QA for a test published research page
        if: github.head_ref == 'qa/research-explainer-integration-20261009'
        run: node scripts/qa-research-browser.mjs

      - name: Attach browser screenshots
        if: always() && github.head_ref == 'qa/research-explainer-integration-20261009'
        uses: actions/upload-artifact@v4
        with:
          name: research-visual-qa
          path: qa-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
