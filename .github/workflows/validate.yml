name: Validate pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python for printable practice resources
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate PDF, DOCX and XLSX assessment downloads
        run: |
          python -m pip install --disable-pip-version-check "reportlab>=4.2,<5" "python-docx>=1.1,<2"
          python scripts/build-professional-assessment-downloads.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce typography law for all publications and CMS
        run: npm run check:type-scale

      - name: Validate content, types, build, and internal links
        run: npm run validate
